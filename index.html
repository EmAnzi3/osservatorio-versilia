  <script>
    (() => {
      const correctHero = new URL('images/versilia-viareggio-apuane.jpg?v=20260803-1658', document.baseURI).href;
      const enforceHero = () => {
        const image = document.querySelector('.hero-photo img');
        if (image && image.src !== correctHero) image.src = correctHero;
      };
      new MutationObserver(enforceHero).observe(document.getElementById('app'), { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
      enforceHero();
    })();
  </script>
