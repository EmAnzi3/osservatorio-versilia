<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F3654">
  <meta name="robots" content="noindex,nofollow">
  <title>Sei offline · Osservatorio Versilia</title>
  <style>
    :root{color-scheme:light;--paper:#f4eee2;--ink:#102f45;--blue:#0f3654;--teal:#58a28f;--line:#cbd5d3}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}
    main{width:min(560px,100%);background:#fffaf1;border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 24px 70px #102f4517}
    img{width:82px;height:auto}h1{margin:24px 0 12px;font-size:38px;line-height:1}p{color:#566d78;line-height:1.6;margin:0 0 22px}button{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:12px 16px;font-weight:700;cursor:pointer}small{display:block;margin-top:24px;color:#718189}
  </style>
</head>
<body>
  <main>
    <img src="assets/brand-mark.svg" alt="">
    <h1>Sei offline.</h1>
    <p>Le pagine già visitate possono restare disponibili. Per aggiornare dati, fonti e confronti serve una connessione.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
    <small>Osservatorio Versilia · dati pubblici dei sette comuni</small>
  </main>
</body>
</html>
