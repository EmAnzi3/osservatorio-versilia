name: A5 municipal golden lock

on:
  pull_request:
    paths:
      - "assets/app.js"
      - "assets/app-parts/**"
      - "assets/fidelity.css"
      - "assets/fidelity.js"
      - "assets/ux-accordion.js"
      - "assets/ux-history*.js"
      - "assets/ux-history*.css"
      - "assets/visual-grammar.js"
      - "assets/visual-grammar.css"
      - "data/site-data.json"
      - "scripts/build_static_brand.py"
      - "scripts/build_static_brand_impl.py"
      - "scripts/build_static_safe.py"
      - "scripts/test_a5_municipal_golden_lock.py"
      - ".github/workflows/a5-municipal-golden-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  municipal-golden-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Build current preview
        run: python scripts/build_static_brand.py

      - name: Checkout immutable municipal golden baseline
        uses: actions/checkout@v4
        with:
          ref: 7eadda666118f2450290a3b1c6edb93f061b7c7b
          path: baseline

      - name: Build baseline preview
        working-directory: baseline
        run: python scripts/build_static_brand.py

      - name: Compare approved municipal surfaces against baseline
        run: |
          set -euo pipefail
          rm -rf /tmp/a5-municipal-golden-lock
          mkdir -p /tmp/a5-municipal-golden-lock
          python scripts/preview_dist.py --port 8123 --directory dist >/tmp/current-preview.log 2>&1 &
          CURRENT_PID=$!
          python baseline/scripts/preview_dist.py --port 8124 --directory baseline/dist >/tmp/baseline-preview.log 2>&1 &
          BASELINE_PID=$!
          cleanup() {
            kill "$CURRENT_PID" "$BASELINE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1
          python scripts/test_a5_municipal_golden_lock.py \
            --current-base http://127.0.0.1:8123 \
            --baseline-base http://127.0.0.1:8124 \
            --report-dir /tmp/a5-municipal-golden-lock

      - name: Upload golden-lock diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-municipal-golden-lock
          path: /tmp/a5-municipal-golden-lock
          if-no-files-found: ignore
