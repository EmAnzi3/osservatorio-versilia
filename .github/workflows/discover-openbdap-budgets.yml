name: Discover OpenBDAP budget sources

on:
  push:
    branches: ["expansion/bilanci-comunali-v160"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-openbdap-budgets
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Discover official sources
        run: python scripts/discover_openbdap_budget_sources.py

      - name: Commit discovery snapshot
        run: |
          if git diff --quiet -- data/source-snapshots/openbdap-budget-discovery.json; then
            echo "Snapshot invariato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-snapshots/openbdap-budget-discovery.json
          git commit -m "Registra le fonti OpenBDAP per i bilanci comunali"
          git push origin HEAD:expansion/bilanci-comunali-v160
