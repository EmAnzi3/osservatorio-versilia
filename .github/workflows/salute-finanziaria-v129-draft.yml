name: Materialize Salute Finanziaria v1.29.0

on:
  push:
    branches: ["feat/v1.29.0-salute-finanziaria"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "salute-finanziaria-v129-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Align canonical release contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          finalize = Path('scripts/finalize_catalog_release.py')
          text = finalize.read_text(encoding='utf-8')
          replacements = {
              'catalogo pubblico v1.28.0': 'catalogo pubblico v1.29.0',
              'VERSION = "v1.28.0"': 'VERSION = "v1.29.0"',
              'UPDATED = "2 settembre 2026"': 'UPDATED = "3 settembre 2026"',
              'EXPECTED_METRICS = 180': 'EXPECTED_METRICS = 181',
              'EXPECTED_INLINE = 176': 'EXPECTED_INLINE = 177',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Contratto inatteso in {finalize}: {old}')
              text = text.replace(old, new, 1)
          finalize.write_text(text, encoding='utf-8')

          test = Path('scripts/test_catalog_release_v116.py')
          text = test.read_text(encoding='utf-8')
          replacements = {
              'Contratto pubblico e metodologico della release v1.28.0.': 'Contratto pubblico e metodologico della release v1.29.0.',
              "assert '**v1.28.0** — 2 settembre 2026' in readme and '180 indicatori' in readme and '176 con valori incorporati' in readme": "assert '**v1.29.0** — 3 settembre 2026' in readme and '181 indicatori' in readme and '177 con valori incorporati' in readme",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Contratto inatteso in {test}: {old}')
              text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Materialize approved financial indicators
        run: python scripts/apply_salute_finanziaria_v129.py

      - name: Validate financial formulas and UI guards
        run: python scripts/test_salute_finanziaria_v129.py

      - name: Validate canonical catalog
        run: |
          python scripts/finalize_catalog_release.py --check
          python scripts/test_catalog_release_v116.py
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool data/source-registry.json > /dev/null
          python -m json.tool data/source-snapshots/salute-finanziaria-v129.json > /dev/null
          git diff --check

      - name: Commit materialized canonical files
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/site-data.json \
            data/source-registry.json \
            assets/app-parts/03.txt \
            README.md \
            scripts/finalize_catalog_release.py \
            scripts/test_catalog_release_v116.py
          if git diff --cached --quiet; then
            echo "Canonical files already materialized."
            exit 0
          fi
          git commit -m "Materializza salute finanziaria v1.29.0"
          git push origin "HEAD:${BRANCH_NAME}"
