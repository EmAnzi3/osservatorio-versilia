name: Genera Social Kit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/site-data.json"
      - "social-kit/**"
      - "scripts/generate_social_kit.py"
      - "scripts/test_social_kit.py"
      - ".github/workflows/social-kit.yml"

permissions:
  contents: read

concurrency:
  group: social-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering dependencies
        run: python -m pip install -r social-kit/requirements.txt

      - name: Generate graphics and copy
        run: python scripts/generate_social_kit.py

      - name: Run editorial and provenance checks
        run: python scripts/test_social_kit.py

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-social-kit
          path: social-kit/dist
          retention-days: 30
