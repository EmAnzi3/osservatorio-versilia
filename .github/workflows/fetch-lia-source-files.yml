name: Fetch LIA source files

on:
  push:
    branches: ["expansion/lavoro-istruzione-abitare"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch official source files
        run: python scripts/fetch_lia_source_files.py
      - name: Upload source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lia-source-files
          path: lia-source-files
          retention-days: 7
