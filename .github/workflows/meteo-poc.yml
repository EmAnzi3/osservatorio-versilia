name: Meteo climate POC

on:
  pull_request:
    paths:
      - "scripts/meteo_poc.py"
      - "scripts/lamma_inventory.py"
      - "scripts/lamma_sample.py"
      - "scripts/lamma_precip_year.py"
      - "scripts/lamma_municipal_stats.py"
      - "scripts/lamma_annual_history.py"
      - "scripts/lamma_annual_history_runner.py"
      - "scripts/era5_land_annual_history.py"
      - "scripts/era5_land_precip_hourly_patch.py"
      - "scripts/climate_stitch_series.py"
      - "scripts/climate_hardening_audit.py"
      - "data/meteo-clima-poc.json"
      - ".github/workflows/meteo-poc.yml"
  workflow_dispatch:

concurrency:
  group: meteo-climate-poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lamma-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LaMMA/GIS dependencies
        run: python -m pip install --disable-pip-version-check rasterio geopandas
      - name: Compile LaMMA POC
        run: |
          python -m py_compile scripts/meteo_poc.py
          python -m py_compile scripts/lamma_inventory.py
          python -m py_compile scripts/lamma_sample.py
          python -m py_compile scripts/lamma_precip_year.py
          python -m py_compile scripts/lamma_municipal_stats.py
          python -m py_compile scripts/lamma_annual_history.py
          python -m py_compile scripts/lamma_annual_history_runner.py
      - name: Build station benchmark
        run: python scripts/meteo_poc.py --output-dir reports/runtime/meteo-poc
      - name: Discover LaMMA climate resources
        run: python scripts/lamma_inventory.py --output reports/runtime/meteo-poc/lamma-inventory.json
      - name: Sample LaMMA temperature climatology
        run: python scripts/lamma_sample.py --output reports/runtime/meteo-poc/lamma-temperature-samples.json
      - name: Aggregate LaMMA daily precipitation 2015
        run: python scripts/lamma_precip_year.py --output reports/runtime/meteo-poc/lamma-precip-2015.json
      - name: Build municipal climate statistics
        run: python scripts/lamma_municipal_stats.py --output reports/runtime/meteo-poc/lamma-municipal-stats.json
      - name: Build complete LaMMA annual history 1995-2015
        run: python scripts/lamma_annual_history_runner.py --years 1995-2015 --output-dir reports/runtime/meteo-poc/annual-history
      - name: Upload LaMMA outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteo-lamma-history
          path: reports/runtime/meteo-poc/
          retention-days: 30

  era5-history:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CDS_API_TOKEN: ${{ secrets.CDS_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ERA5/GIS dependencies
        run: python -m pip install --disable-pip-version-check "cdsapi>=0.7.7" rasterio geopandas xarray netcdf4
      - name: Compile ERA5 pipeline
        run: |
          python -m py_compile scripts/era5_land_annual_history.py
          python -m py_compile scripts/era5_land_precip_hourly_patch.py
          python -m py_compile scripts/climate_stitch_series.py
          python -m py_compile scripts/climate_hardening_audit.py
      - name: Record CDS credential status
        run: |
          mkdir -p reports/runtime/era5
          if [[ -n "$CDS_API_TOKEN" ]]; then
            echo "CDS_API_TOKEN configured: ERA5-Land acquisition enabled." | tee reports/runtime/era5/era5-status.txt
          else
            echo "CDS_API_TOKEN not configured: ERA5-Land acquisition skipped." | tee reports/runtime/era5/era5-status.txt
          fi
      - name: Build ERA5-Land annual history 1950-2025
        if: env.CDS_API_TOKEN != ''
        run: |
          python scripts/era5_land_annual_history.py \
            --start-year 1950 \
            --end-year 2025 \
            --chunk-years 20 \
            --output reports/runtime/era5/era5-land-annual-raw.csv
      - name: Replace affected precipitation 2022-2024 from hourly data
        if: env.CDS_API_TOKEN != ''
        run: |
          python scripts/era5_land_precip_hourly_patch.py \
            --raw reports/runtime/era5/era5-land-annual-raw.csv \
            --output reports/runtime/era5/era5-land-annual-patched.csv
      - name: Confirm complete-year-only policy
        run: echo "Current-year/YTD climate extraction is intentionally disabled; only complete annual periods may enter the publication workflow."
      - name: Upload ERA5 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteo-era5-history
          path: reports/runtime/era5/
          retention-days: 30

  stitch-series:
    needs: [lamma-history, era5-history]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stitch dependency
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Download LaMMA artifact
        uses: actions/download-artifact@v4
        with:
          name: meteo-lamma-history
          path: reports/runtime/combined/lamma
      - name: Download ERA5 artifact
        uses: actions/download-artifact@v4
        with:
          name: meteo-era5-history
          path: reports/runtime/combined/era5
      - name: Stitch current series and build hardening audit when ERA5 is available
        run: |
          mkdir -p reports/runtime/final
          cp reports/runtime/combined/era5/era5-status.txt reports/runtime/final/era5-status.txt
          if [[ -f reports/runtime/combined/era5/era5-land-annual-patched.csv ]]; then
            python scripts/climate_stitch_series.py \
              --lamma reports/runtime/combined/lamma/annual-history/lamma-annual-history.csv \
              --era5 reports/runtime/combined/era5/era5-land-annual-patched.csv \
              --output reports/runtime/final/municipal-climate-1950-2025.csv
            python scripts/climate_hardening_audit.py \
              --published-json data/meteo-clima-poc.json \
              --lamma reports/runtime/combined/lamma/annual-history/lamma-annual-history.csv \
              --era5 reports/runtime/combined/era5/era5-land-annual-patched.csv \
              --output-json reports/runtime/final/climate-hardening-audit.json \
              --output-md reports/runtime/final/climate-hardening-audit.md
          else
            echo "Full 1950-2025 series and hardening audit not built because ERA5-Land acquisition is unavailable." > reports/runtime/final/stitch-status.txt
          fi
          echo "Tmin/Tmax 1975-2025 remain governed by the dedicated homogeneous ERA5-Land workflow and SIR temporal validation." > reports/runtime/final/minmax-status.txt
      - name: Upload final outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteo-clima-poc
          path: reports/runtime/final/
          retention-days: 30
