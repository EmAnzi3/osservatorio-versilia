name: Meteo climate POC

on:
  pull_request:
    paths:
      - "scripts/meteo_poc.py"
      - "scripts/lamma_inventory.py"
      - "scripts/lamma_sample.py"
      - "scripts/lamma_precip_year.py"
      - "scripts/lamma_municipal_stats.py"
      - "scripts/lamma_annual_history.py"
      - "scripts/lamma_annual_history_runner.py"
      - "scripts/era5_land_annual_history.py"
      - "scripts/era5_land_precip_hourly_patch.py"
      - "scripts/climate_stitch_series.py"
      - ".github/workflows/meteo-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meteo-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CDS_API_TOKEN: ${{ secrets.CDS_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install climate/GIS dependencies
        run: python -m pip install --disable-pip-version-check "cdsapi>=0.7.7" rasterio geopandas xarray netcdf4

      - name: Compile POC
        run: |
          python -m py_compile scripts/meteo_poc.py
          python -m py_compile scripts/lamma_inventory.py
          python -m py_compile scripts/lamma_sample.py
          python -m py_compile scripts/lamma_precip_year.py
          python -m py_compile scripts/lamma_municipal_stats.py
          python -m py_compile scripts/lamma_annual_history.py
          python -m py_compile scripts/lamma_annual_history_runner.py
          python -m py_compile scripts/era5_land_annual_history.py
          python -m py_compile scripts/era5_land_precip_hourly_patch.py
          python -m py_compile scripts/climate_stitch_series.py

      - name: Build station benchmark
        run: python scripts/meteo_poc.py --output-dir reports/runtime/meteo-poc

      - name: Discover LaMMA climate resources
        run: python scripts/lamma_inventory.py --output reports/runtime/meteo-poc/lamma-inventory.json

      - name: Sample LaMMA temperature climatology
        run: python scripts/lamma_sample.py --output reports/runtime/meteo-poc/lamma-temperature-samples.json

      - name: Aggregate LaMMA daily precipitation 2015
        run: python scripts/lamma_precip_year.py --output reports/runtime/meteo-poc/lamma-precip-2015.json

      - name: Build municipal climate statistics
        run: python scripts/lamma_municipal_stats.py --output reports/runtime/meteo-poc/lamma-municipal-stats.json

      - name: Build complete LaMMA annual history 1995-2015
        run: python scripts/lamma_annual_history_runner.py --years 1995-2015 --output-dir reports/runtime/meteo-poc/annual-history

      - name: Record CDS credential status
        run: |
          mkdir -p reports/runtime/meteo-poc
          if [[ -n "$CDS_API_TOKEN" ]]; then
            echo "CDS_API_TOKEN configured: ERA5-Land acquisition enabled." > reports/runtime/meteo-poc/era5-status.txt
          else
            echo "CDS_API_TOKEN not configured: ERA5-Land acquisition skipped." > reports/runtime/meteo-poc/era5-status.txt
          fi

      - name: Build ERA5-Land annual history 1950-2025
        if: env.CDS_API_TOKEN != ''
        run: |
          python scripts/era5_land_annual_history.py \
            --start-year 1950 \
            --end-year 2025 \
            --chunk-years 20 \
            --output reports/runtime/meteo-poc/era5-land-annual-raw.csv

      - name: Replace affected ERA5-Land precipitation 2022-2024 from hourly data
        if: env.CDS_API_TOKEN != ''
        run: |
          python scripts/era5_land_precip_hourly_patch.py \
            --raw reports/runtime/meteo-poc/era5-land-annual-raw.csv \
            --output reports/runtime/meteo-poc/era5-land-annual-patched.csv

      - name: Stitch LaMMA and calibrated ERA5-Land series
        if: env.CDS_API_TOKEN != ''
        run: |
          python scripts/climate_stitch_series.py \
            --lamma reports/runtime/meteo-poc/annual-history/lamma-annual-history.csv \
            --era5 reports/runtime/meteo-poc/era5-land-annual-patched.csv \
            --output reports/runtime/meteo-poc/municipal-climate-1950-2025.csv

      - name: Upload POC outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteo-clima-poc
          path: reports/runtime/meteo-poc/
          retention-days: 30
