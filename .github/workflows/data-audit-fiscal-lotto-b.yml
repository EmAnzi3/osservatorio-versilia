name: Data audit Lotto B - Fiscalità locale

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/probe_fiscal_lotto_b_sources.py"
      - "scripts/materialize_fiscal_lotto_b.py"
      - "scripts/test_fiscal_lotto_b.py"
      - "scripts/test_fiscal_lotto_b_browser.py"
      - "data/**"
      - ".github/workflows/data-audit-fiscal-lotto-b.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fiscal-lotto-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install requests pypdf
      - name: Probe OpenBDAP and DAIT
        run: python scripts/probe_fiscal_lotto_b_sources.py
      - name: Validate probe JSON
        run: python -m json.tool reports/fiscal-lotto-b-probe.json > /dev/null
      - name: Materialize prerequisite Income Lotto A
        run: python scripts/materialize_income_lotto_a_v2.py
      - name: Materialize Fiscalità Lotto B
        run: |
          python scripts/materialize_fiscal_lotto_b.py
          python scripts/test_fiscal_lotto_b.py
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool data/source-registry.json > /dev/null
          python -m json.tool data/source-monitor-state.json > /dev/null
          python -m json.tool data/source-snapshots/fiscal-lotto-b-2025.json > /dev/null
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-lotto-b-probe
          path: reports/fiscal-lotto-b-probe.json
          retention-days: 7
