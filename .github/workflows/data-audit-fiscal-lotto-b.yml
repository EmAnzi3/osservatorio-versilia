name: Data audit Lotto B - Fiscalità locale

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/probe_fiscal_lotto_b_sources.py"
      - "scripts/materialize_fiscal_lotto_b.py"
      - "scripts/patch_fiscal_lotto_b_frontend.py"
      - "scripts/test_fiscal_lotto_b.py"
      - "scripts/test_fiscal_lotto_b_browser.py"
      - "data/source-snapshots/fiscal-lotto-b-2025.json"
      - ".github/workflows/data-audit-fiscal-lotto-b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fiscal-lotto-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned source tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Probe official OpenBDAP and DAIT sources
        run: |
          python scripts/probe_fiscal_lotto_b_sources.py
          python -m json.tool reports/fiscal-lotto-b-probe.json > /dev/null

      - name: Validate canonical Fiscalità tranche
        run: |
          python scripts/finalize_catalog_release.py --check
          python scripts/test_fiscal_lotto_b.py
          python -m py_compile scripts/materialize_fiscal_lotto_b.py scripts/patch_fiscal_lotto_b_frontend.py scripts/test_fiscal_lotto_b.py
          python -m json.tool data/source-snapshots/fiscal-lotto-b-2025.json > /dev/null

      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-lotto-b-probe
          path: reports/fiscal-lotto-b-probe.json
          retention-days: 7
