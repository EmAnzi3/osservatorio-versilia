name: Build LIA source audit

on:
  push:
    branches: ["expansion/lavoro-istruzione-abitare"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 pandas openpyxl odfpy
      - name: Build seven-town audit
        run: python scripts/build_lia_audit.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lia-audit
          path: lia-audit
          retention-days: 7
