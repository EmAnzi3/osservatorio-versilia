name: One-shot fix tooltip SVG test

on:
  push:
    branches: ["agent/scale-tooltip-grafici-v113"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scale-tooltip-grafici-v113
      - name: Fix SVG tooltip assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_visual_grammar.py')
          text = p.read_text(encoding='utf-8')
          old = 'assert "massarosa" in page.locator(".chart-point.active .chart-tooltip").inner_text().lower()'
          new = 'assert "massarosa" in (page.locator(".chart-point.active .chart-tooltip").text_content() or "").lower()'
          if old not in text:
              raise SystemExit('Tooltip SVG assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit canonical test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-tooltip-test.yml
          git add scripts/test_visual_grammar.py
          git commit -m "Corregge test tooltip SVG"
          git push origin HEAD:agent/scale-tooltip-grafici-v113
