name: Bilanci v1.39 source gate

on:
  pull_request:
    paths:
      - '.github/workflows/bilanci-v139-gate.yml'
      - 'docs/audit-bilanci-v139.md'
      - 'scripts/probe_bilanci_v139_sources.py'
      - 'scripts/probe_bilanci_v139_cash.py'
      - 'scripts/materialize_bilanci_v139.py'
      - 'scripts/test_bilanci_v139.py'
      - 'scripts/test_bilanci_v139_browser.py'
      - 'scripts/build_bilanci_snapshot.py'
      - 'scripts/test_release_v160.py'
      - 'scripts/apply_salute_finanziaria_v129.py'
      - 'scripts/test_salute_finanziaria_v129.py'
      - 'data/source-snapshots/bilanci-v1.6.0.json'
      - 'data/source-snapshots/salute-finanziaria-v129.json'
      - 'data/source-snapshots/siope-history-v1.6.0.json'
      - 'data/source-snapshots/bilanci-v139.json'
      - 'data/site-data.json'
      - 'data/source-registry.json'
      - 'assets/app-parts/**'
      - 'scripts/build_static_brand.py'
      - 'scripts/preflight.py'
      - 'ci/workflow-contract.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-audit dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Compile v1.39 source probes
        run: python -m py_compile scripts/probe_bilanci_v139_sources.py scripts/probe_bilanci_v139_cash.py

      - name: Probe year-end cash fund 7/7
        run: python scripts/probe_bilanci_v139_cash.py

      - name: Audit official OpenBDAP and SIOPE sources
        run: python scripts/probe_bilanci_v139_sources.py --output reports/bilanci-v139-source-audit.json

      - name: Check v1.6 Bilanci backward compatibility
        run: python scripts/test_release_v160.py

      - name: Check v1.29 financial-profile backward compatibility
        run: python scripts/test_salute_finanziaria_v129.py

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilanci-v139-source-audit
          path: reports/bilanci-v139-source-audit.json
          if-no-files-found: warn

  canonical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install canonical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Canonical quick gate
        run: python scripts/preflight.py --quick

      - name: Verify build is non-mutating
        run: git diff --exit-code -- . ':(exclude)dist' ':(exclude)reports/bilanci-v139-source-audit.json'
