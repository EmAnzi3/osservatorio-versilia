name: Canonicalize Economy v1.13

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "canonicalize-economy-v113"
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize canonical Economy v1.13 sources
        run: python scripts/apply_costi_fiscalita_release.py

      - name: Validate canonical release
        run: |
          python scripts/test_costi_fiscalita_redditi_draft.py
          node --check assets/ux-history.js
          node --check assets/ux-history-core.js
          node --check assets/visual-grammar.js
          node --check service-worker.js
          git diff --check

      - name: Commit canonical source state
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/site-data.json \
            data/source-registry.json \
            assets/app-parts \
            assets/ux-history.js \
            assets/ux-history-core.js \
            assets/ux-experiment.css \
            assets/visual-grammar.js \
            assets/fidelity.css \
            scripts/build_static_safe.py \
            scripts/build_static_brand.py \
            service-worker.js \
            scripts/test_brand_identity.py \
            scripts/test_composite_indicators.py \
            scripts/test_exports_v161.py \
            scripts/test_release_v170_compat.py \
            scripts/test_ux_experiment.py
          if git diff --cached --quiet; then
            echo "Canonical sources already aligned with v1.13.0"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canonicalizza Economia v1.13.0"
          git push origin HEAD:main
