name: Correggi test case-sensitive Costa una volta

on:
  push:
    branches:
      - staging/demanio-marittimo-v127
    paths:
      - .github/workflows/fix-costa-gate-case-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/demanio-marittimo-v127
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correggi esclusivamente il confronto testuale del gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_costa_mare_v123_browser.py')
          t = p.read_text(encoding='utf-8')
          old = '        assert "Peso sulla Versilia costiera" in text, text\n'
          new = '        assert "peso sulla versilia costiera" in text.lower(), text\n'
          if new not in t:
              if old not in t:
                  raise SystemExit('Asserzione attesa non trovata')
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY
          python -m py_compile scripts/test_costa_mare_v123_browser.py
          grep -F 'assert "peso sulla versilia costiera" in text.lower(), text' scripts/test_costa_mare_v123_browser.py
      - name: Commit della sola correzione test
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_costa_mare_v123_browser.py
          git diff --cached --quiet && exit 0
          git commit -m "test: rende robusto il gate costa al text-transform"
          git push origin HEAD:staging/demanio-marittimo-v127
