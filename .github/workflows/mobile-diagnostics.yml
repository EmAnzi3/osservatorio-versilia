name: Mobile diagnostics

on:
  push:
    branches: ["agent/migrazioni-omi-v111"]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Build pre-rendered site
        run: python scripts/build_static_brand.py
      - name: Node accordion syntax
        run: node --check assets/ux-accordion.js
      - name: Mobile interactions
        run: python scripts/test_mobile_interactions.py
      - name: Accordion tools persistence
        run: python scripts/test_accordion_tools_persistence.py
