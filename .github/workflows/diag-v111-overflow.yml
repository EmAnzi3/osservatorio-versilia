name: Diagnose v1.11 mobile overflow

on:
  push:
    branches: ["agent/migrazioni-omi-v111"]
  workflow_dispatch:

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrazioni-omi-v111
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build
        run: python scripts/build_static_brand.py
      - name: Diagnose overflow
        run: |
          python -m http.server 8765 --directory dist >/tmp/server.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":390,"height":844})
              page.goto('http://127.0.0.1:8765/comuni/massarosa/?tema=demografia&indicatore=ageDistribution', wait_until='networkidle')
              dims=page.evaluate('({client:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth})')
              print('DIMS',dims)
              offenders=page.evaluate('''() => [...document.querySelectorAll('*')].map(el=>{const r=el.getBoundingClientRect(); const cs=getComputedStyle(el); return {tag:el.tagName,cls:el.className||'',id:el.id||'',left:r.left,right:r.right,width:r.width,scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,position:cs.position,display:cs.display,whiteSpace:cs.whiteSpace,text:(el.textContent||'').trim().replace(/\\s+/g,' ').slice(0,120)}}).filter(x=>x.right>390.5 || x.left<-0.5 || x.scrollWidth>x.clientWidth+1).sort((a,b)=>(b.right-390)-(a.right-390)).slice(0,80)''')
              for x in offenders: print('OFFENDER',x)
              browser.close()
          PY
