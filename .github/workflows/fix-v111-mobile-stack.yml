name: Fix v1.11 mobile composite stack

on:
  push:
    branches: ["agent/migrazioni-omi-v111"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrazioni-omi-v111
          fetch-depth: 0
      - name: Prevent hidden touch tooltip from widening mobile page
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('assets/fidelity.css')
          text=path.read_text(encoding='utf-8')
          rule='\n/* Mobile: i tooltip delle fasce sono ridondanti rispetto al dettaglio sottostante e non devono allargare la pagina. */\n@media(max-width:700px){.composite-stack-town .bar-hover-label{display:none!important}}\n'
          if rule.strip() not in text:
              path.write_text(text.rstrip()+rule,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fidelity.css
          git commit -m "fix: contain composite stack on mobile"
          git push origin HEAD:agent/migrazioni-omi-v111
