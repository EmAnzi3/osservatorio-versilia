name: Correggi visual grammar demanio una volta

on:
  push:
    branches:
      - staging/demanio-marittimo-v127
    paths:
      - .github/workflows/fix-demanio-visual-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/demanio-marittimo-v127
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correggi solo la sovrascrittura visual grammar
        run: |
          set -euo pipefail
          python scripts/patch_demanio_visual_once.py
          node --check assets/visual-grammar.js
          python scripts/test_costa_mare_v123.py
      - name: Commit della sola correzione
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visual-grammar.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserva quota demanio nella visual grammar"
          git push origin HEAD:staging/demanio-marittimo-v127
