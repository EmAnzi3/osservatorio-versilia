name: A5 change scope lock

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-lock:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/a5-controlled-iteration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce declared batch scope
        run: python scripts/test_a5_change_scope.py --config ci/a5-change-scope.json
