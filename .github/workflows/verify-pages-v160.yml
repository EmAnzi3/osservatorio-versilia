name: Verify Pages deployment v1.6.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-pages-v160.yml"

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: verify-pages-v160
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for the matching Pages deployment
        run: |
          set -euo pipefail
          conclusion=""
          run_url=""
          for attempt in $(seq 1 40); do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&per_page=20")"
            status="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$response" | head -n1)"
            conclusion="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion // ""' <<<"$response" | head -n1)"
            run_url="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .html_url' <<<"$response" | head -n1)"
            echo "Tentativo ${attempt}: status=${status:-non trovato}, conclusion=${conclusion:-in attesa}"
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 10
          done
          if [ "$conclusion" != "success" ]; then
            echo "Deploy Pages non concluso con successo: ${conclusion:-non trovato}" >&2
            exit 1
          fi
          echo "PAGES_RUN_URL=$run_url" >> "$GITHUB_ENV"

      - name: Record successful deployment on PR 8
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/8/comments" \
            -f body="✅ Pubblicazione GitHub Pages di Osservatorio Versilia v1.6.0 verificata con esito positivo. Commit distribuito: \`${GITHUB_SHA}\`. Workflow: ${PAGES_RUN_URL}"

      - name: Remove the one-shot verifier
        run: |
          git rm .github/workflows/verify-pages-v160.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rimuove il verificatore temporaneo del deploy v1.6.0"
          git push origin HEAD:main

# One-shot deployment verifier. It removes itself after a successful Pages run.
