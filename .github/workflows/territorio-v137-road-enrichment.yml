name: Territorio v1.37 Iter.Net road enrichment

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-road-enrichment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS and browser stack
        run: |
          python -m pip install geopandas pyogrio shapely openpyxl playwright
          python -m playwright install --with-deps chromium
      - name: Materialize Iter.Net road enrichment
        run: python scripts/territorio_v137_road_enrichment_apply.py
      - name: Canonical build and road contract
        run: |
          python scripts/build_static_brand.py
          python scripts/verify_territorio_v137_dist.py
      - name: Browser QA road data are visible
        run: |
          mkdir -p reports/territorio-v137-road-enrichment
          python -m http.server 8765 --directory dist >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python scripts/territorio_v137_road_enrichment_qa.py
      - name: Commit enriched production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-snapshots/territorio-v137-official.json scripts/generate_territorio_v137_snapshot.py scripts/materialize_territorio_v137.py scripts/verify_territorio_v137_dist.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "feat(territorio): expose Iter.Net road classes"
          git push origin HEAD:draft/territorio-indicatori-v137
      - name: Upload road QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: territorio-v137-road-enrichment
          path: reports/territorio-v137-road-enrichment/
          if-no-files-found: error
          retention-days: 7
