name: Sync Bonifica snapshot v1.26

on:
  push:
    branches: ["feat/bonifica-rischio-v126"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bonifica-rischio-v126
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update snapshot promotion metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/source-snapshots/bonifica-rischio-v126.json')
          snap=json.loads(path.read_text(encoding='utf-8'))
          status=snap['sources']['statusLayer']
          status['note']=('Estrazione WFS massiva acquisita il 31/08/2026. Le 1.265 righe degli export comunali sono ricondotte a 1.265 feature distinte di cb_pmo_lineare; '
                          'interventi_puntuali è una rappresentazione alternativa di un sottoinsieme e non viene sommato. Conteggi di stato e valori lordi operativi sono pubblicati tramite lo snapshot dedicato; '
                          'importo_lordo non coincide con il valore approvato dell’Allegato A-1 e non rappresenta spesa pagata o liquidata.')
          snap['publishedViaStatusSnapshot']={
              'snapshot':'data/source-snapshots/bonifica-rischio-v126-status.json',
              'metrics':['pabInterventionsInProgress','pabInterventionsCompleted','pabInProgressOperationalGrossValue','pabCompletedOperationalGrossValue'],
              'referenceTimestamp':'2026-08-31T17:19:31+02:00',
              'note':'Stato lavori pubblicato su estrazione WFS massiva riconciliata 1:1 con le 1.265 righe degli export comunali. Gli importi sono valori lordi operativi, non importi approvati A-1 né spesa pagata/liquidata.'
          }
          deferred=snap.setdefault('deferred',{})
          deferred.pop('inProgressCompletedCountsAndValues',None)
          deferred['maintainedPhysicalKmAndShare']=('49 delle 1.265 feature operative selezionate non espongono geometria nel GeoJSON, per 28.562,44 m di attività. '
                                                    'La lunghezza fisica unica e la quota di reticolo manutenzionato restano quindi non pubblicabili senza proxy.')
          path.write_text(json.dumps(snap,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/test_catalog_release_v116.py
      - name: Commit snapshot metadata
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-snapshots/bonifica-rischio-v126.json
          git commit -m "Record Bonifica work-status promotion"
          git push origin HEAD:feat/bonifica-rischio-v126
