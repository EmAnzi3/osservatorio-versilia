name: Probe servizi digitali IPA

on:
  push:
    branches: ["agent/amministrazione-probe-ratio7"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit IPA e PA Digitale 2026
        run: python scripts/probe_servizi_digitali_ipa.py
