name: Radar Opportunità · probe PCM sources

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/radar-dispatch-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Diagnose PCM primary sources
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          sys.path.insert(0, 'scripts')
          import opportunity_daily_refresh_revalidated as revalidation
          from playwright.sync_api import sync_playwright

          targets = {'pcm-pari-tratta-bando-8-2026', 'pcm-capitale-mare-2027'}
          entries = {}
          for path in sorted(Path('data').glob('opportunity-verified-v*.json')):
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              rows = payload if isinstance(payload, list) else payload.get('entries') or payload.get('opportunities') or payload.get('verified') or []
              if isinstance(rows, dict):
                  rows = list(rows.values())
              for row in rows:
                  if isinstance(row, dict) and row.get('coverage_id') in targets:
                      entries[row['coverage_id']] = row

          assert targets <= set(entries), targets - set(entries)
          today = datetime.now(timezone.utc).date()
          for coverage_id in sorted(targets):
              entry = entries[coverage_id]
              print('\n===', coverage_id, '===')
              print('url:', entry['url'])
              print('required_terms:', entry.get('required_terms'))
              print('resilient:', revalidation.verify_entry_resilient(entry, today, live=True, fallback_max_days=7))

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(ignore_https_errors=True, user_agent=revalidation._BROWSER_UA, locale='it-IT')
                  page = context.new_page()
                  try:
                      response = page.goto(entry['url'], wait_until='domcontentloaded', timeout=60000)
                      try:
                          page.wait_for_load_state('networkidle', timeout=8000)
                      except Exception:
                          pass
                      print('http-status:', response.status if response else None)
                      print('final-url:', page.url)
                      print('title:', page.title())
                      body = page.locator('body').inner_text(timeout=10000)
                      print('body-snippet:', body[:2500].replace('\n', ' | '))
                      links = page.locator('a').evaluate_all("els => els.map(a => ({text:(a.innerText||'').trim(), href:a.href||''}))")
                      useful = []
                      for link in links:
                          text = (link.get('text') or '').lower()
                          href = link.get('href') or ''
                          hay = text + ' ' + href.lower()
                          if any(k in hay for k in ['pdf', 'bando', 'avviso', '2026', '2027', 'domanda', 'decreto']):
                              useful.append((link.get('text') or '')[:180] + ' -> ' + href)
                      print('useful-links:')
                      for item in useful[:80]:
                          print(' -', item)
                  finally:
                      context.close()
                      browser.close()
          PY
