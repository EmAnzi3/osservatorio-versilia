name: Radar Opportunità · probe finale fonti instabili v3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/radar-dispatch-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Verify three formerly unstable opportunities
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          import opportunity_daily_refresh_revalidated as revalidation

          targets = {
              'pcm-pari-tratta-bando-8-2026',
              'pcm-capitale-mare-2027',
              'eu-eucf-call-8-2026',
          }
          entries = {}
          for path in sorted(Path('data').glob('opportunity-verified-v*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              rows = payload.get('entries') or [] if isinstance(payload, dict) else payload
              for row in rows:
                  if isinstance(row, dict) and row.get('coverage_id') in targets:
                      entries[row['coverage_id']] = row

          missing = targets - set(entries)
          assert not missing, f'Entry non trovate: {sorted(missing)}'
          today = datetime.now(timezone.utc).date()
          failed = []
          for coverage_id in sorted(targets):
              result = revalidation.verify_entry_resilient(
                  entries[coverage_id], today, live=True, fallback_max_days=7
              )
              print(f'{coverage_id}: {result}')
              if not (result[0] and result[1] == 'live' and result[2] is None):
                  failed.append((coverage_id, result))
          assert not failed, failed
          print('Tre fonti instabili riconfermate LIVE: PASS')
          PY
