name: Radar Opportunità · probe coverage diretta v2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/radar-dispatch-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Radar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Probe verified coverage entries in parallel
        run: python scripts/probe_opportunity_verified_live.py
