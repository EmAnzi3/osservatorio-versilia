name: Radar Opportunità · probe LIFE PDA portal

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/radar-dispatch-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Verify PDA through official Funding and Tenders portal
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          import opportunity_daily_refresh_revalidated as revalidation

          entry = None
          for path in sorted(Path('data').glob('opportunity-verified-v*.json')):
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              rows = payload if isinstance(payload, list) else payload.get('entries') or payload.get('opportunities') or payload.get('verified') or []
              if isinstance(rows, dict):
                  rows = list(rows.values())
              for row in rows:
                  if isinstance(row, dict) and row.get('coverage_id') == 'life-2026-cet-pda':
                      entry = row
          assert entry, 'PDA entry missing'

          portal = 'https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/topic-details/LIFE-2026-CET-PDA'
          text = revalidation._fetch_playwright_text(portal, timeout_ms=60000)
          check = revalidation._ORIGINAL_VERIFY(
              entry,
              datetime.now(timezone.utc).date(),
              detail_payloads={entry['url']: text},
              live=False,
              fallback_max_days=-1,
          )
          print('portal-check:', check)
          print('text-has-reference:', 'LIFE-2026-CET-PDA' in text)
          print('text-has-open:', 'Open' in text)
          print('text-has-deadline:', '16 September 2026' in text)
          assert check[0], check
          print('Funding & Tenders PDA: LIVE PASS')
          PY
