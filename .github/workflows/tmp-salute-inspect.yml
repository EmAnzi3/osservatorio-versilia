name: tmp-salute-inspect
on:
  push:
    branches: [codex/salute-12-indicatori]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist salute schema
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/site-data.json',encoding='utf-8'))
          keys=['mortalityAll','chronicTotal','elderlyHomeCare','pharmaciesPer1000']
          out={'theme':d['themes']['salute'],'metrics':{k:d['metrics'][k] for k in keys}}
          open('tmp-salute-schema.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp-salute-schema.json
          git commit -m 'chore: narrow temporary salute schema'
          git push