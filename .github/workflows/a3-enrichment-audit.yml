name: A3 Enrichment Audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: a3-enrichment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install production build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Run A3 regression suite
        run: |
          python scripts/test_enrichment_audit_matrix.py
          python scripts/test_enrichment_structural_closure.py
          python scripts/test_enrichment_route_evidence.py
          python scripts/test_enrichment_companion_evidence.py

      - name: Materialize effective public catalog
        env:
          OV_RELEASE_BUILD: "1"
        run: |
          python scripts/build_static_brand.py
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('dist/data/site-data.json')
          registry_path = Path('dist/data/source-registry.json')
          assert data_path.is_file(), data_path
          assert registry_path.is_file(), registry_path
          data = json.loads(data_path.read_text(encoding='utf-8'))
          metrics = data.get('metrics') or {}
          assert len(metrics) == 225, f"Effective Public Catalog inatteso: {len(metrics)} indicatori"
          print('Effective Public Catalog: 225 indicatori materializzati in dist/.')
          PY

      - name: Build effective A3 matrix
        run: |
          python scripts/enrichment_audit_matrix.py \
            --data dist/data/site-data.json \
            --registry dist/data/source-registry.json \
            --output /tmp/a3-enrichment-matrix.json \
            --allow-unclassified

      - name: Report residual A3 pairs
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          residual = [
              row for row in matrix['rows']
              if row.get('state') is None
          ]
          counts = Counter(row['dimension'] for row in residual)
          print('A3 residual dimensions:', dict(sorted(counts.items())))
          for row in residual:
              print(f"A3_RESIDUAL {row['metricId']} :: {row['dimension']} :: {row.get('sourceProfileId') or '-'}")
          PY

      - name: Verify route and demographic closures
