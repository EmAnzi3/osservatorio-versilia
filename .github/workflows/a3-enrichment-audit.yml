name: A3 Enrichment Audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: a3-enrichment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install production build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Run A3 regression suite
        run: |
          python scripts/test_enrichment_audit_matrix.py
          python scripts/test_enrichment_structural_closure.py
          python scripts/test_enrichment_route_evidence.py
          python scripts/test_enrichment_companion_evidence.py

      - name: Materialize effective public catalog
        env:
          OV_RELEASE_BUILD: "1"
        run: |
          python scripts/build_static_brand.py
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('dist/data/site-data.json')
          registry_path = Path('dist/data/source-registry.json')
          assert data_path.is_file(), data_path
          assert registry_path.is_file(), registry_path
          data = json.loads(data_path.read_text(encoding='utf-8'))
          metrics = data.get('metrics') or {}
          assert len(metrics) == 225, f"Effective Public Catalog inatteso: {len(metrics)} indicatori"
          print('Effective Public Catalog: 225 indicatori materializzati in dist/.')
          PY

      - name: Build effective A3 matrix
        run: |
          python scripts/enrichment_audit_matrix.py \
            --data dist/data/site-data.json \
            --registry dist/data/source-registry.json \
            --output /tmp/a3-enrichment-matrix.json \
            --allow-unclassified

      - name: Report residual A3 pairs
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          residual = [
              row for row in matrix['rows']
              if row.get('state') is None
          ]
          counts = Counter(row['dimension'] for row in residual)
          print('A3 residual dimensions:', dict(sorted(counts.items())))
          for row in residual:
              print(f"A3_RESIDUAL {row['metricId']} :: {row['dimension']} :: {row.get('sourceProfileId') or '-'}")
          PY

      - name: Verify route and demographic closures
        run: |
          python - <<'PY'
          import json

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          summary = matrix['summary']
          assert summary['publicMetricCount'] == 225, summary
          assert summary['pairCount'] == 2025, summary

          companion_expected = {
              ('population', 'eta'),
              ('populationChange', 'eta'),
              ('naturalDemographicDynamics', 'eta'),
              ('internalResidentialMobility', 'eta'),
              ('foreignResidentialMobility', 'eta'),
              ('totalResidentialMobility', 'eta'),
              ('foreignResidents', 'eta'),
          }
          route_expected = {
              ('voterTurnout', 'serie_storica'),
              ('voterTurnout', 'sesso'),
              ('voterTurnout', 'dettaglio_territoriale'),
              ('voterTurnout', 'assoluto_normalizzato'),
              ('voterTurnout', 'numeratore_denominatore'),
              ('voterTurnout', 'categorie_specifiche'),
              ('economyActivityAtlas', 'serie_storica'),
              ('economyActivityAtlas', 'dettaglio_territoriale'),
              ('economyActivityAtlas', 'benchmark_toscana_italia'),
              ('economyActivityAtlas', 'assoluto_normalizzato'),
              ('economyActivityAtlas', 'numeratore_denominatore'),
              ('economyActivityAtlas', 'categorie_specifiche'),
          }
          ratio_expected = {
              ('tourismIntensity', 'assoluto_normalizzato'),
              ('tourismIntensity', 'numeratore_denominatore'),
              ('commuterBalanceRate', 'assoluto_normalizzato'),
              ('commuterBalanceRate', 'numeratore_denominatore'),
              ('inboundCommutersRate', 'assoluto_normalizzato'),
              ('inboundCommutersRate', 'numeratore_denominatore'),
              ('outboundCommutersRate', 'assoluto_normalizzato'),
              ('outboundCommutersRate', 'numeratore_denominatore'),
              ('tourismBedsPer1000', 'assoluto_normalizzato'),
              ('tourismBedsPer1000', 'numeratore_denominatore'),
          }
          demographic_formula_expected = {
              ('populationChange', 'assoluto_normalizzato'): 'structured:companion:series_change_formula:',
              ('populationChange', 'numeratore_denominatore'): 'structured:companion:series_change_formula:',
              ('dependencyIndices', 'eta'): 'structured:companion:parts_ratio_formula:',
              ('dependencyIndices', 'assoluto_normalizzato'): 'structured:companion:parts_ratio_formula:',
              ('dependencyIndices', 'numeratore_denominatore'): 'structured:companion:parts_ratio_formula:',
          }
          staff_turnover_expected = {
              ('municipalStaffTurnover', 'eta'): 'structured:companion:age_breakdown:municipalStaffAgeStructure:',
              ('municipalStaffTurnover', 'numeratore_denominatore'): 'structured:companion:target_fields_ratio_formula:',
          }
          normalized_companion_expected = {
              ('commuterBalance', 'assoluto_normalizzato'): 'structured:companion:normalized_companion_formula:',
              ('inboundCommuters', 'assoluto_normalizzato'): 'structured:companion:normalized_companion_formula:',
              ('outboundCommuters', 'assoluto_normalizzato'): 'structured:companion:normalized_companion_formula:',
          }
          municipal_employee_age_expected = {
              ('municipalEmployeesPer1000', 'eta'): 'structured:companion:age_breakdown:municipalStaffAgeStructure:',
          }
          average_population_expected = {
              ('internalResidentialMobility', 'numeratore_denominatore'): 'structured:companion:part_count_average_population_formula:',
              ('foreignResidentialMobility', 'numeratore_denominatore'): 'structured:companion:part_count_average_population_formula:',
              ('totalResidentialMobility', 'numeratore_denominatore'): 'structured:companion:part_count_average_population_formula:',
              ('naturalDemographicDynamics', 'numeratore_denominatore'): 'structured:companion:part_count_average_population_formula:',
          }
          canonical_field_ratio_expected = {
              ('currentPayments', 'numeratore_denominatore'): 'structured:companion:canonical_field_ratio_formula:',
              ('capitalPayments', 'numeratore_denominatore'): 'structured:companion:canonical_field_ratio_formula:',
              ('siopePayments', 'numeratore_denominatore'): 'structured:companion:canonical_field_ratio_formula:',
              ('publicWorks', 'numeratore_denominatore'): 'structured:companion:canonical_field_ratio_formula:',
          }
          available_missing_expected = {
              ('evPoints', 'numeratore_denominatore'),
              ('pharmaciesPer1000', 'assoluto_normalizzato'),
              ('pharmaciesPer1000', 'numeratore_denominatore'),
              ('tourismStructuresPer1000', 'assoluto_normalizzato'),
              ('tourismStructuresPer1000', 'numeratore_denominatore'),
              ('roadFinesPerResident', 'assoluto_normalizzato'),
              ('roadFinesPerResident', 'numeratore_denominatore'),
          }
          semantic_not_applicable_expected = {
              ('agriculturalUsedArea', 'sesso'),
              ('agriculturalUsedArea', 'eta'),
              ('averageAgriculturalFarmSize', 'sesso'),
              ('averageAgriculturalFarmSize', 'eta'),
              ('cropProfile', 'sesso'),
              ('cropProfile', 'eta'),
              ('irrigatedAgriculturalArea', 'sesso'),
              ('irrigatedAgriculturalArea', 'eta'),
              ('forestCoverIndex', 'sesso'),
              ('forestCoverIndex', 'eta'),
              ('landCoverProfile', 'sesso'),
              ('landCoverProfile', 'eta'),
              ('extractiveSites', 'sesso'),
              ('extractiveSites', 'eta'),
          }
          rows = {
              (row['metricId'], row['dimension']): row
              for row in matrix['rows']
          }
          for pair in sorted(companion_expected):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith('structured:companion:'), (pair, row)

          for pair in sorted(route_expected):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith('structured:storage:'), (pair, row)

          for pair in sorted(ratio_expected):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith('structured:companion:ratio_formula:'), (pair, row)

          for pair, evidence_prefix in sorted(demographic_formula_expected.items()):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith(evidence_prefix), (pair, row)

          for pair, evidence_prefix in sorted(staff_turnover_expected.items()):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith(evidence_prefix), (pair, row)

          for expected in (
              normalized_companion_expected,
              municipal_employee_age_expected,
              average_population_expected,
              canonical_field_ratio_expected,
          ):
              for pair, evidence_prefix in sorted(expected.items()):
                  row = rows[pair]
                  assert row['state'] == 'ACQUIRED', (pair, row)
                  assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
                  assert row['evidence'].startswith(evidence_prefix), (pair, row)

          for pair in sorted(available_missing_expected):
              row = rows[pair]
              assert row['state'] == 'AVAILABLE_MISSING', (pair, row)
              assert row['classificationOrigin'] == 'metric_override', (pair, row)
              assert row['sourceReference'], (pair, row)

          for pair in sorted(semantic_not_applicable_expected):
              row = rows[pair]
              assert row['state'] == 'NOT_APPLICABLE', (pair, row)
              assert row['classificationOrigin'] == 'metric_override', (pair, row)
              assert row['evidence'], (pair, row)

          assert summary['classifiedPairCount'] == 1805, summary
          assert summary['unclassifiedPairCount'] == 220, summary
          print(
              'A3 effective matrix: '
              f"{summary['classifiedPairCount']} classified / "
              f"{summary['unclassifiedPairCount']} residual; "
              '12 special-route + 8 age companion + 10 ratio + 3 normalized companion + 9 demographic formula + 2 staff turnover + 4 canonical-field ratio + 7 available-missing ratio + 14 semantic N/A pairs verified.'
          )
          PY
