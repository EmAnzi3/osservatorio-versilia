name: A3 Enrichment Audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: a3-enrichment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install production build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Run A3 regression suite
        run: |
          python scripts/test_enrichment_audit_matrix.py
          python scripts/test_enrichment_structural_closure.py
          python scripts/test_enrichment_route_evidence.py
          python scripts/test_enrichment_companion_evidence.py

      - name: Materialize effective public catalog
        env:
          OV_RELEASE_BUILD: "1"
        run: |
          python scripts/build_static_brand.py
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('dist/data/site-data.json')
          registry_path = Path('dist/data/source-registry.json')
          assert data_path.is_file(), data_path
          assert registry_path.is_file(), registry_path
          data = json.loads(data_path.read_text(encoding='utf-8'))
          metrics = data.get('metrics') or {}
          assert len(metrics) == 225, f"Effective Public Catalog inatteso: {len(metrics)} indicatori"
          print('Effective Public Catalog: 225 indicatori materializzati in dist/.')
          PY

      - name: Build effective A3 matrix
        run: |
          python scripts/enrichment_audit_matrix.py \
            --data dist/data/site-data.json \
            --registry dist/data/source-registry.json \
            --output /tmp/a3-enrichment-matrix.json \
            --allow-unclassified

      - name: Verify A3 closure contracts
        run: |
          python - <<'PY'
          import json

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          summary = matrix['summary']
          assert summary['publicMetricCount'] == 225, summary
          assert summary['pairCount'] == 2025, summary
          assert summary['classifiedPairCount'] == 1749, summary
          assert summary['unclassifiedPairCount'] == 276, summary

          companion_expected = {
              ('population', 'eta'),
              ('populationChange', 'eta'),
              ('naturalDemographicDynamics', 'eta'),
              ('internalResidentialMobility', 'eta'),
              ('foreignResidentialMobility', 'eta'),
              ('totalResidentialMobility', 'eta'),
              ('foreignResidents', 'eta'),
          }
          affluenza_expected = {
              ('voterTurnout', 'serie_storica'),
              ('voterTurnout', 'sesso'),
              ('voterTurnout', 'dettaglio_territoriale'),
              ('voterTurnout', 'assoluto_normalizzato'),
              ('voterTurnout', 'numeratore_denominatore'),
              ('voterTurnout', 'categorie_specifiche'),
          }
          rows = {
              (row['metricId'], row['dimension']): row
              for row in matrix['rows']
          }
          for pair in sorted(companion_expected):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith('structured:companion:'), (pair, row)
          for pair in sorted(affluenza_expected):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith('structured:storage:data/affluenza:'), (pair, row)

          print(
              'A3 effective matrix: '
              f"{summary['classifiedPairCount']} classified / "
              f"{summary['unclassifiedPairCount']} residual; "
              '7 demographic companion + 6 affluenza route pairs verified.'
          )
          PY
