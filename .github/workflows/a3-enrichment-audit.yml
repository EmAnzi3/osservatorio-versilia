name: A3 Enrichment Audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: a3-enrichment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install production build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Run A3 regression suite
        run: |
          python scripts/test_enrichment_audit_matrix.py
          python scripts/test_enrichment_structural_closure.py
          python scripts/test_enrichment_route_evidence.py
          python scripts/test_enrichment_companion_evidence.py
          python scripts/test_enrichment_source_audit.py
          python scripts/test_enrichment_backlog.py
          python scripts/test_a3_5_demography_sex.py
          python scripts/test_a3_5_openbdap_ratio_components.py
          python scripts/test_a3_5_frame_sbs_dimensions.py
          python scripts/test_a3_5_istat_census_components.py
          python scripts/test_a3_5_source_backed_companions.py
          python scripts/test_a3_5_historical_mef_companions.py

      - name: Materialize effective public catalog
        env:
          OV_RELEASE_BUILD: "1"
        run: |
          python scripts/build_static_brand.py
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('dist/data/site-data.json')
          registry_path = Path('dist/data/source-registry.json')
          assert data_path.is_file(), data_path
          assert registry_path.is_file(), registry_path
          data = json.loads(data_path.read_text(encoding='utf-8'))
          metrics = data.get('metrics') or {}
          assert len(metrics) == 225, f"Effective Public Catalog inatteso: {len(metrics)} indicatori"
          print('Effective Public Catalog: 225 indicatori materializzati in dist/.')
          PY

      - name: Build effective A3 matrix
        run: |
          python scripts/enrichment_audit_matrix.py \
            --data dist/data/site-data.json \
            --registry dist/data/source-registry.json \
            --output /tmp/a3-enrichment-matrix.json \
            --allow-unclassified

      - name: Report residual A3 pairs
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          residual = [
              row for row in matrix['rows']
              if row.get('state') is None
          ]
          counts = Counter(row['dimension'] for row in residual)
          print('A3 residual dimensions:', dict(sorted(counts.items())))
          for row in residual:
              print(f"A3_RESIDUAL {row['metricId']} :: {row['dimension']} :: {row.get('sourceProfileId') or '-'}")
          PY

      - name: Enforce strict A3.2 completion
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import enrichment_audit_matrix_core as audit

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          audit.validate_matrix(matrix, require_complete=True)
          summary = matrix['summary']
          print(
              'A3.2 strict gate: '
              f"{summary['classifiedPairCount']} classificate / "
              f"{summary['unclassifiedPairCount']} residue."
          )
          PY

      - name: Build A3.3 source audit
        run: |
          python scripts/enrichment_source_audit.py \
            --matrix /tmp/a3-enrichment-matrix.json \
            --registry dist/data/source-registry.json \
            --json-output /tmp/a3-source-audit.json \
            --markdown-output /tmp/a3-source-audit.md
          python - <<'PY'
          import json

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          audit = json.load(open('/tmp/a3-source-audit.json', encoding='utf-8'))
          ms = matrix['summary']
          summary = audit['summary']
          assert summary['publicMetricCount'] == ms['publicMetricCount'], (summary, ms)
          assert summary['sourceProfileCount'] == ms['sourceProfileCount'], (summary, ms)
          assert summary['pairCount'] == ms['pairCount'], (summary, ms)
          assert summary['dimensionCount'] == ms['dimensionCount'], (summary, ms)
          print(
              'A3.3 source audit coverage: '
              f"{summary['sourceProfileCount']} profili fonte · "
              f"{summary['publicMetricCount']} indicatori · "
              f"{summary['pairCount']} coppie · "
              f"{summary['availableMissingPairCount']} AVAILABLE_MISSING."
          )
          PY

      - name: Upload A3.3 source audit
        uses: actions/upload-artifact@v4
        with:
          name: a3-source-audit
          path: |
            /tmp/a3-source-audit.json
            /tmp/a3-source-audit.md
          if-no-files-found: error

      - name: Build A3.4 enrichment backlog
        run: |
          python scripts/enrichment_backlog.py \
            --matrix /tmp/a3-enrichment-matrix.json \
            --source-audit /tmp/a3-source-audit.json \
            --json-output /tmp/a3-enrichment-backlog.json \
            --markdown-output /tmp/a3-enrichment-backlog.md
          python - <<'PY'
          import json

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          source_audit = json.load(open('/tmp/a3-source-audit.json', encoding='utf-8'))
          backlog = json.load(open('/tmp/a3-enrichment-backlog.json', encoding='utf-8'))

          ms = matrix['summary']
          source_summary = source_audit['summary']
          summary = backlog['summary']

          assert summary['publicMetricCount'] == ms['publicMetricCount'], (summary, ms)
          assert summary['sourceProfileCount'] == ms['sourceProfileCount'], (summary, ms)
          assert summary['dimensionCount'] == ms['dimensionCount'], (summary, ms)
          assert summary['availableMissingPairCount'] == ms['state_AVAILABLE_MISSING'], (summary, ms)
          assert summary['availableMissingPairCount'] == source_summary['availableMissingPairCount'], (
              summary,
              source_summary,
          )

          covered = {
              (bundle['profileId'], pair['metricId'], bundle['dimension'])
              for bundle in backlog['bundles']
              for pair in bundle['pairs']
          }
          expected = {
              (row['sourceProfileId'], row['metricId'], row['dimension'])
              for row in matrix['rows']
              if row['state'] == 'AVAILABLE_MISSING'
          }
          assert covered == expected, (len(covered), len(expected))
          assert [bundle['rank'] for bundle in backlog['bundles']] == list(
              range(1, summary['bundleCount'] + 1)
          )

          print(
              'A3.4 backlog coverage: '
              f"{summary['availableMissingPairCount']} AVAILABLE_MISSING -> "
              f"{summary['bundleCount']} pacchetti su "
              f"{summary['profilesWithBacklog']} profili."
          )
          PY

      - name: Upload A3.4 enrichment backlog
        uses: actions/upload-artifact@v4
        with:
          name: a3-enrichment-backlog
          path: |
            /tmp/a3-enrichment-backlog.json
            /tmp/a3-enrichment-backlog.md
          if-no-files-found: error

      - name: Verify A3.5 demography sex acquisition
        run: |
          python - <<'PY'
          import json

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          backlog = json.load(open('/tmp/a3-enrichment-backlog.json', encoding='utf-8'))
          rows = {
              (row['metricId'], row['dimension']): row
              for row in matrix['rows']
          }
          expected = {
              ('population', 'sesso'),
              ('dependencyIndices', 'sesso'),
              ('foreignResidents', 'sesso'),
          }
          for pair in sorted(expected):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith('structured:'), (pair, row)
              assert 'sexDimension' in row['evidence'], (pair, row)

          backlog_pairs = {
              (pair['metricId'], bundle['dimension'])
              for bundle in backlog['bundles']
              for pair in bundle['pairs']
          }
          assert expected.isdisjoint(backlog_pairs), expected & backlog_pairs
          assert (
              backlog['summary']['availableMissingPairCount']
              == matrix['summary']['state_AVAILABLE_MISSING']
          )
          print(
              'A3.5 demography sex acquisition: '
              f"{len(expected)} coppie strutturalmente ACQUIRED; "
              f"{backlog['summary']['availableMissingPairCount']} AVAILABLE_MISSING residue."
          )
          PY

      - name: Verify A3.5 Istat census components
        run: |
          python - <<'PY'
          import json

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          backlog = json.load(open('/tmp/a3-enrichment-backlog.json', encoding='utf-8'))
          rows = {
              (row['metricId'], row['dimension']): row
              for row in matrix['rows']
          }
          metrics = {
              'femaleEmploymentRate',
              'maleEmploymentRate',
              'housingStockPer1000',
              'nonOccupiedHomesPer1000',
              'vacantHomes',
              'singleHouseholds',
          }
          expected = {
              (metric_id, dimension)
              for metric_id in metrics
              for dimension in ('numeratore_denominatore', 'assoluto_normalizzato')
          }
          for pair in sorted(expected):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith('structured:'), (pair, row)
              assert 'censusRatioComponents' in row['evidence'], (pair, row)

          backlog_pairs = {
              (pair['metricId'], bundle['dimension'])
              for bundle in backlog['bundles']
              for pair in bundle['pairs']
          }
          assert expected.isdisjoint(backlog_pairs), expected & backlog_pairs
          assert (
              backlog['summary']['availableMissingPairCount']
              == matrix['summary']['state_AVAILABLE_MISSING']
          ), backlog['summary']
          print(
              'A3.5 Istat Census components: '
              f'{len(expected)} coppie strutturalmente ACQUIRED; '
              f"{backlog['summary']['availableMissingPairCount']} AVAILABLE_MISSING residue."
          )
          PY

      - name: Verify A3.5 source-backed companions
        run: |
          python - <<'PY'
          import json

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          backlog = json.load(open('/tmp/a3-enrichment-backlog.json', encoding='utf-8'))
          rows = {
              (row['metricId'], row['dimension']): row
              for row in matrix['rows']
          }

          openbdap = {
              'currentRevenueAccruedPerResident',
              'currentExpenditureCommittedPerResident',
              'capitalExpenditureCommittedPerResident',
              'ownRevenueShare',
              'currentCollectionCapacity',
              'currentPaymentCapacity',
              'availableAdministrationResultPerResident',
              'educationMissionExpenditurePerResident',
              'socialMissionExpenditurePerResident',
              'environmentMissionExpenditurePerResident',
              'mobilityMissionExpenditurePerResident',
              'cultureSportMissionExpenditurePerResident',
              'tourismDevelopmentMissionExpenditurePerResident',
              'economicDevelopmentMissionExpenditurePerResident',
              'cashReceiptsPerResident',
              'cashBalancePerResident',
          }
          expected = {
              (metric_id, 'assoluto_normalizzato')
              for metric_id in openbdap
          }
          source_both = {
              'cohabitingHouseholds',
              'oldAgeIndex',
              'averageAgriculturalFarmSize',
              'employeesPerLocalUnit',
              'localEmployeesChange',
              'localUnitsChange',
              'industryValueAddedShare',
              'industryWorkerShare',
          }
          expected |= {
              (metric_id, dimension)
              for metric_id in source_both
              for dimension in ('numeratore_denominatore', 'assoluto_normalizzato')
          }
          expected |= {
              ('agriculturalUsedArea', 'numeratore_denominatore'),
              ('irrigatedAgriculturalArea', 'numeratore_denominatore'),
          }

          assert len(expected) == 34, len(expected)
          for pair in sorted(expected):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              token = 'openBdapScaleCompanion' if pair[0] in openbdap else 'sourceBackedComponents'
              assert token in row['evidence'], (pair, row)

          backlog_pairs = {
              (pair['metricId'], bundle['dimension'])
              for bundle in backlog['bundles']
              for pair in bundle['pairs']
          }
          assert expected.isdisjoint(backlog_pairs), expected & backlog_pairs
          assert (
              backlog['summary']['availableMissingPairCount']
              == matrix['summary']['state_AVAILABLE_MISSING']
          ), backlog['summary']
          print(
              'A3.5 source-backed companions: '
              f'{len(expected)} coppie strutturalmente ACQUIRED; '
              f"{backlog['summary']['availableMissingPairCount']} AVAILABLE_MISSING residue."
          )
          PY

      - name: Verify A3.5 historical and MEF companions
        run: |
          python - <<'PY'
          import json

          matrix = json.load(open('/tmp/a3-enrichment-matrix.json', encoding='utf-8'))
          backlog = json.load(open('/tmp/a3-enrichment-backlog.json', encoding='utf-8'))
          rows = {
              (row['metricId'], row['dimension']): row
              for row in matrix['rows']
          }

          expected = {
              ('industryValueAddedShare', 'serie_storica'),
              ('industryValueAddedShare', 'categorie_specifiche'),
              ('industryWorkerShare', 'serie_storica'),
              ('industryWorkerShare', 'categorie_specifiche'),
              ('localEmployeesChange', 'serie_storica'),
              ('localUnitsChange', 'serie_storica'),
              ('populationChange', 'serie_storica'),
              ('rigidExpenditureShare', 'serie_storica'),
              ('incomeSourceProfile', 'numeratore_denominatore'),
              ('incomeSourceProfile', 'assoluto_normalizzato'),
              ('pensionIncomeShare', 'numeratore_denominatore'),
              ('pensionIncomeShare', 'assoluto_normalizzato'),
              ('municipalIrpef', 'assoluto_normalizzato'),
          }
          assert len(expected) == 13, len(expected)

          for pair in sorted(expected):
              row = rows[pair]
              assert row['state'] == 'ACQUIRED', (pair, row)
              assert row['classificationOrigin'] == 'catalog_structure', (pair, row)
              assert row['evidence'].startswith('structured:'), (pair, row)
              metric_id, dimension = pair
              if dimension == 'serie_storica':
                  assert 'a3History' in row['evidence'], (pair, row)
              elif dimension == 'categorie_specifiche':
                  assert 'businessCategoryBreakdown' in row['evidence'], (pair, row)
              elif metric_id in {'incomeSourceProfile', 'pensionIncomeShare'}:
                  assert 'mefScaleComponents' in row['evidence'], (pair, row)
              else:
                  assert 'municipalIrpefScaleCompanion' in row['evidence'], (pair, row)

          backlog_pairs = {
              (pair['metricId'], bundle['dimension'])
              for bundle in backlog['bundles']
              for pair in bundle['pairs']
          }
          assert expected.isdisjoint(backlog_pairs), expected & backlog_pairs
          assert (\n              backlog['summary']['availableMissingPairCount']\n              == matrix['summary']['state_AVAILABLE_MISSING']\n          ), backlog['summary']
          assert matrix['summary']['unclassifiedPairCount'] == 0, matrix['summary']
          print(
              'A3.5 historical + MEF companions: '
              f'{len(expected)} coppie strutturalmente ACQUIRED; '
              f"{backlog['summary']['availableMissingPairCount']} AVAILABLE_MISSING residue."
          )
          PY

      - name: Verify A3.5 ARS legacy history
        run: |
          python - <<'PY'
          import json
          matrix=json.load(open('/tmp/a3-enrichment-matrix.json',encoding='utf-8'))
          backlog=json.load(open('/tmp/a3-enrichment-backlog.json',encoding='utf-8'))
          rows={(row['metricId'],row['dimension']):row for row in matrix['rows']}
          expected={(key,'serie_storica') for key in ('chronicTotal','dementia','diabetes','elderlyHomeCare','emergencyAccess','hospitalizedAll','mortalityAll')}
          assert len(expected)==7
          for pair in sorted(expected):
              row=rows[pair]
              assert row['state']=='ACQUIRED',(pair,row)
              assert row['classificationOrigin']=='catalog_structure',(pair,row)
              assert row['evidence'].startswith('structured:'),(pair,row)
              assert 'a3History' in row['evidence'],(pair,row)
          backlog_pairs={(pair['metricId'],bundle['dimension']) for bundle in backlog['bundles'] for pair in bundle['pairs']}
          assert expected.isdisjoint(backlog_pairs),expected & backlog_pairs
          assert backlog['summary']['availableMissingPairCount']==767,backlog['summary']
          assert matrix['summary']['unclassifiedPairCount']==0,matrix['summary']
          print(f"A3.5 ARS legacy history: {len(expected)} coppie strutturalmente ACQUIRED; {backlog['summary']['availableMissingPairCount']} AVAILABLE_MISSING residue.")
          PY

