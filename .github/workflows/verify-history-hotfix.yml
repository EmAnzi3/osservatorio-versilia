name: Verifica hotfix vista storica

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-history-hotfix.yml"

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: verify-history-hotfix
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for matching Pages deployment
        run: |
          set -euo pipefail
          status=""
          conclusion=""
          run_url=""
          for attempt in $(seq 1 50); do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&per_page=20")"
            status="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$response" | head -n1)"
            conclusion="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .conclusion // ""' <<<"$response" | head -n1)"
            run_url="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .html_url' <<<"$response" | head -n1)"
            echo "Tentativo ${attempt}: ${status:-non trovato} ${conclusion:-in attesa}"
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 10
          done
          if [ "$conclusion" != "success" ]; then
            echo "Deploy Pages non riuscito: ${status:-non trovato}/${conclusion:-nessun esito}" >&2
            exit 1
          fi
          echo "PAGES_RUN_URL=$run_url" >> "$GITHUB_ENV"

      - name: Record success
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/8/comments" \
            -f body="✅ Hotfix vista storica pubblicato e verificato. Il passaggio Valore attuale/Storico funziona anche aprendo direttamente le pagine pubbliche senza parametri. Commit distribuito: \`${GITHUB_SHA}\`. Workflow: ${PAGES_RUN_URL}"

      - name: Remove verifier
        run: |
          git rm .github/workflows/verify-history-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rimuove il verificatore dell’hotfix storico"
          git push origin HEAD:main
