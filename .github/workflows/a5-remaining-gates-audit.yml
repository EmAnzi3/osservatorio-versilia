name: A5 remaining gates audit

on:
  push:
    branches:
      - "debug/a5-remaining-gates-audit"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remaining-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
          npm install --global lighthouse@13.4.1

      - name: Compile changed contracts
        run: |
          python -m py_compile             scripts/test_demography_lotto_a_browser_v2.py             scripts/test_ambiente_acqua_v124_browser.py             scripts/test_lighthouse_budget.py

      - name: Prepare coherent dist exactly like pages full
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          git diff --exit-code -- . ':(exclude)dist'
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py
          python scripts/build_pnrr_toscana_deep_dive.py
          python scripts/inject_pnrr_town_experience.py
          python scripts/copy_percorsi_dist.py
          node --check dist/assets/app-bundle.js

      - name: Audit all remaining gates without fail-fast
        shell: bash
        run: |
          set -uo pipefail
          PORT=8127
          BASE="http://127.0.0.1:${PORT}/"
          python scripts/preview_dist.py --port "${PORT}" --directory dist >/tmp/a5-remaining-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 1

          python - <<'PY'
          from __future__ import annotations
          import importlib.util
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          failures = []

          def run(label, command):
              print(f"\n==> {label}\n    {' '.join(map(str, command))}", flush=True)
              completed = subprocess.run(command, cwd=root, check=False)
              if completed.returncode:
                  failures.append((label, completed.returncode))

          run(
              "Lighthouse budget",
              [sys.executable, "scripts/test_lighthouse_budget.py",
               "--base", "http://127.0.0.1:8127/",
               "--output-dir", "reports/lighthouse-remaining"],
          )

          spec = importlib.util.spec_from_file_location("ov_preflight", root / "scripts" / "preflight.py")
          preflight = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(preflight)

          print("\n==> monthly monitor validation", flush=True)
          try:
              with tempfile.TemporaryDirectory(prefix="ov-a5-remaining-") as tmp:
                  preflight.validate_monthly_state(Path(tmp))
          except Exception as exc:
              print(f"MONTHLY VALIDATION FAILED: {exc}", file=sys.stderr)
              failures.append(("monthly monitor validation", 1))

          for label, script, *args in preflight.STATIC_FULL_TESTS:
              run(f"static full: {label}", [sys.executable, script, *args])

          if failures:
              print("\n=== REMAINING GATES FAILURES ===", file=sys.stderr)
              for label, code in failures:
                  print(f"- {label}: exit {code}", file=sys.stderr)
              raise SystemExit(1)

          print("\nA5 REMAINING GATES: GREEN", flush=True)
          PY

      - name: Upload remaining-gates diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-remaining-gates-diagnostics
          path: |
            reports/
            /tmp/a5-remaining-preview.log
          if-no-files-found: ignore
          retention-days: 7
