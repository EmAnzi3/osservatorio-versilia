name: Territorio v1.37 review fixes

on:
  push:
    branches: ["draft/territorio-indicatori-v137"]

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply semantic and history fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          
          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: attesa 1 occorrenza, trovate {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          
          def replace_block(path, start_marker, end_marker, new_block, label):
              text = path.read_text(encoding='utf-8')
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker assente')
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{label}: end marker assente')
              path.write_text(text[:start] + new_block + text[end:], encoding='utf-8')
          
          materializer = Path('scripts/materialize_territorio_v137.py')
          runtime = Path('scripts/patch_territorio_v137_runtime.py')
          verifier = Path('scripts/verify_territorio_v137_dist.py')
          
          replace_once(
              materializer,
              '"meta": {"key": "roadNetworkProfile", "theme": "ambiente",',
              '"meta": {"key": "roadNetworkProfile", "theme": "mobilita",',
              'road theme metadata',
          )
          new_install = '''def install_road_metric(site: dict) -> None:
              themes = site.get("themes", {})
              mobility = themes.get("mobilita")
              if not mobility:
                  raise RuntimeError("v1.37: tema Mobilità e infrastrutture assente.")
          
              # Il grafo viario deve comparire una sola volta, esclusivamente sotto
              # Mobilità e infrastrutture, nella sezione già dedicata alle infrastrutture.
              for theme in themes.values():
                  for section in theme.get("sections", []):
                      section["metrics"] = [key for key in section.get("metrics", []) if key != "roadNetworkProfile"]
                  theme["metrics"] = [key for section in theme.get("sections", []) for key in section.get("metrics", [])]
          
              sections = mobility.get("sections", [])
              infrastructure = next((s for s in sections if s.get("key") == "veicoli"), None)
              if not infrastructure:
                  raise RuntimeError("v1.37: sezione veicoli/infrastrutture assente nel tema Mobilità.")
              metrics = list(infrastructure.get("metrics", []))
              metrics.append("roadNetworkProfile")
              infrastructure["metrics"] = metrics
              mobility["metrics"] = [key for section in sections for key in section.get("metrics", [])]
          
          
          '''
          replace_block(materializer, 'def install_road_metric(site: dict) -> None:\n', 'def patch_registry(', new_install, 'road section install')
          replace_once(
              materializer,
              'print("v1.37.0 materializzata: 203 indicatori; 4 metriche territoriali migliorate + roadNetworkProfile.")',
              'print("v1.37.0 materializzata: 203 indicatori; 4 metriche territoriali migliorate + roadNetworkProfile in Mobilità e infrastrutture.")',
              'materializer summary',
          )
          
          replace_once(
              runtime,
              'VISUAL_GRAMMAR = ROOT / "assets" / "visual-grammar.js"\nSENTINEL = "territoryProfileTypes"',
              'VISUAL_GRAMMAR = ROOT / "assets" / "visual-grammar.js"\nUX_HISTORY_CORE = ROOT / "assets" / "ux-history-core.js"\nUX_HISTORY = ROOT / "assets" / "ux-history.js"\nSENTINEL = "territoryProfileTypes"',
              'runtime UX paths',
          )
          replace_once(
              runtime,
              '    visual = VISUAL_GRAMMAR.read_text(encoding="utf-8")\n\n    if SENTINEL in app03:',
              '    visual = VISUAL_GRAMMAR.read_text(encoding="utf-8")\n    ux_core = UX_HISTORY_CORE.read_text(encoding="utf-8")\n    ux_history = UX_HISTORY.read_text(encoding="utf-8")\n\n    if SENTINEL in app03:',
              'runtime UX reads',
          )
          replace_once(
              runtime,
              '        required = ("sqm_per_resident", "km_per_km2", "territoryProfileHistoryChart", "data-metric-key", "sqm-per-resident")\n        if not all(token in app00 + app03 + app05 + visual for token in required):',
              '        required = ("sqm_per_resident", "km_per_km2", "territoryProfileHistoryChart", "data-metric-key", "sqm-per-resident", "updateTerritoryProfileTownPosition", "TERRITORY_PROFILE_HISTORY_TYPES", "wireHistoryTooltips")\n        if not all(token in app00 + app03 + app05 + visual + ux_core + ux_history for token in required):',
              'runtime sentinel',
          )
          
          position_patch = r'''    position_helper = """
            function updateTerritoryProfileTownPosition(metric,row,choice,position) {
              if (!position || !isTerritoryProfileType(metric)) return;
              const selected=compositeSelectionOptions(metric,row).find(option=>option.key===choice) || compositeSelectionOptions(metric,row)[0];
              const agg=compositeSelectionAggregate(metric,choice);
              const local=Number(selected?.value);
              const total=Number(agg?.value);
              const unit=selected?.unit || metric.meta.unit;
              const overline=position.querySelector('.overline');
              const deltaEl=position.querySelector('[data-composite-delta]');
              const noteEl=position.querySelector('p');
              const aggLabel=position.querySelector('[data-composite-aggregate-label]');
              const aggValue=position.querySelector('[data-composite-aggregate-value]');
              const additive=['hectares','km'].includes(unit);
              if (additive) {
                const share=Number.isFinite(local) && Number.isFinite(total) && total !== 0 ? local/total*100 : null;
                if(overline) overline.textContent='Quota sul totale Versilia';
                if(deltaEl) deltaEl.innerHTML=share === null
                  ? `n.d.<small>${total === 0 ? 'totale Versilia pari a zero' : 'quota non disponibile'}</small>`
                  : `${html(number1.format(share))}%<small>del totale Versilia</small>`;
                if(noteEl) noteEl.textContent='Quota del valore comunale sul totale dei sette Comuni per la lettura selezionata.';
              } else {
                const diff=Number.isFinite(local) && Number.isFinite(total) ? local-total : null;
                if(overline) overline.textContent='Scostamento dal valore Versilia';
                if(deltaEl) deltaEl.innerHTML=diff === null
                  ? 'n.d.<small>confronto non disponibile</small>'
                  : `${html(formatValue(diff,unit))}<small>rispetto al valore Versilia</small>`;
                if(noteEl) noteEl.textContent='Per quote, densità e valori pro capite è mostrata la differenza rispetto al valore aggregato Versilia; non è un giudizio di qualità.';
              }
              if(aggLabel) aggLabel.textContent=agg.label;
              if(aggValue) aggValue.textContent=agg.formatted;
            }
          
          """
              app03 = replace_once(app03, "  function updateAgricultureProfileTownPosition(metric,row,choice,position) {\n", position_helper + "  function updateAgricultureProfileTownPosition(metric,row,choice,position) {\n", "confronto comunale territorio")
          
          '''
          text = runtime.read_text(encoding='utf-8')
          marker = '    def compare_render(b: str) -> str:\n'
          if text.count(marker) != 1:
              raise SystemExit('runtime position insertion marker')
          runtime.write_text(text.replace(marker, position_patch + marker, 1), encoding='utf-8')
          
          text = runtime.read_text(encoding='utf-8')
          old = '        b = edit_line_once(b, "const initialChoice=options[0]?.key || \'summary\';", lambda line: line.replace("const initialChoice=options[0]?.key || \'summary\';", "const initialChoice=territoryProfile ? defaultTerritoryChoice : (options[0]?.key || \'summary\');", 1), "choice territorio comunale")\n        return b\n'
          new = old[:-len('        return b\n')] + '        b = insert_after_line(b, "updateExtractiveTownPosition(metric,row,initialChoice,initialPosition);", "      updateTerritoryProfileTownPosition(metric,row,initialChoice,initialPosition);\\n", "confronto iniziale territorio comunale")\n        b = insert_after_line(b, "updateExtractiveTownPosition(metric,row,choice,position);", "        updateTerritoryProfileTownPosition(metric,row,choice,position);\\n", "confronto dinamico territorio comunale")\n        return b\n'
          if text.count(old) != 1:
              raise SystemExit(f'runtime town share insertion: {text.count(old)}')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')
          
          ux_patch = r'''    # Collega seriesByView al layer storico generale e riutilizza i tooltip
              # canonici anche dopo i rerender del wrapper storico.
              ux_core = replace_once(
                  ux_core,
                  "    wireViewShell,\n    escapeHtml\n",
                  "    wireViewShell,\n    wireHistoryTooltips,\n    formatValue,\n    escapeHtml\n",
                  "export tooltip/storico territorio",
              )
          
              ux_helper = """
            const TERRITORY_PROFILE_HISTORY_TYPES = new Set(['soilStockProfile','soilChangeProfile','protectedAreasProfile','hydroNetworkProfile','roadNetworkProfile']);
            function isTerritoryProfileHistoryMetric(metric) {
              return TERRITORY_PROFILE_HISTORY_TYPES.has(metric?.meta?.compositeType);
            }
          
          """
              ux_history = replace_once(ux_history, "  const LIBRARY_HISTORY_KEYS = new Set(['libraryLoansPerResident','libraryActiveBorrowersPer100','libraryWeeklyOpeningHours']);\n", "  const LIBRARY_HISTORY_KEYS = new Set(['libraryLoansPerResident','libraryActiveBorrowersPer100','libraryWeeklyOpeningHours']);\n" + ux_helper, "helper storico collettivo territorio")
          
              def ux_composite_choice(b: str) -> str:
                  b = edit_line_once(b, "includes(metric?.meta?.compositeType)) return metric;", lambda line: line.replace("'sexBreakdown']", "'sexBreakdown','soilStockProfile','soilChangeProfile','protectedAreasProfile','hydroNetworkProfile','roadNetworkProfile']", 1), "abilita choice storico territorio")
                  territory_case = """    if (isTerritoryProfileHistoryMetric(metric)) {
              const selected=(choice && choice !== 'summary') ? choice : (metric.meta.defaultView || metric.rows?.[0]?.parts?.[0]?.key);
              const template=(metric.aggregate?.parts || metric.rows?.[0]?.parts || []).find(part=>part.key===selected) || metric.aggregate?.parts?.[0] || metric.rows?.[0]?.parts?.[0] || {};
              const unit=template.unit || metric.meta.unit;
              clone.meta.unit=unit;
              clone.meta.label=template.label ? `${metric.meta.label} · ${template.label}` : metric.meta.label;
              clone.rows=metric.rows.map(row=>{
                const part=(row.parts || []).find(item=>item.key===selected) || row.parts?.[0] || {};
                const value=part.value === null || part.value === undefined || part.value === '' ? undefined : Number(part.value);
                return { ...row, value, formatted:Number.isFinite(value)?toolkit.formatValue(value,unit):'n.d.', series:row.seriesByView?.[selected] || null };
              });
              const aggregatePart=(metric.aggregate?.parts || []).find(item=>item.key===selected) || metric.aggregate?.parts?.[0] || {};
              clone.aggregate={ ...metric.aggregate, value:aggregatePart.value, label:`Versilia · ${aggregatePart.label || metric.meta.label}`, series:metric.aggregate?.seriesByView?.[selected] || null };
              return clone;
            }
          """
                  return insert_after_line(b, "const clone = { ...metric", territory_case, "choice seriesByView territorio")
              ux_history = patch_function(ux_history, "compositeChoiceMetric", ux_composite_choice)
          
              ux_history = patch_function(ux_history, "refreshTownCompositeCurrent", lambda b: edit_line_once(b, "includes(metric?.meta?.compositeType)) return;", lambda line: line.replace("'sexBreakdown']", "'sexBreakdown','soilStockProfile','soilChangeProfile','protectedAreasProfile','hydroNetworkProfile','roadNetworkProfile']", 1), "refresh corrente territorio"))
          
              def ux_enhance_compare(b: str) -> str:
                  return edit_line_once(b, "const selectedChoice = selected.metric?.meta?.compositeType === 'sexBreakdown'", lambda line: line.replace("selected.metric?.meta?.compositeType === 'sexBreakdown' ? currentCompositeChoice() : null", "(selected.metric?.meta?.compositeType === 'sexBreakdown' || isTerritoryProfileHistoryMetric(selected.metric)) ? currentCompositeChoice() : null", 1), "choice storico compare territorio")
              ux_history = patch_function(ux_history, "enhanceCompare", ux_enhance_compare)
          
              def ux_enhance_town(b: str) -> str:
                  b = edit_line_once(b, "const selectedChoice = selected.metric?.meta?.compositeType === 'sexBreakdown'", lambda line: line.replace("selected.metric?.meta?.compositeType === 'sexBreakdown' ? currentCompositeChoice() : null", "(selected.metric?.meta?.compositeType === 'sexBreakdown' || isTerritoryProfileHistoryMetric(selected.metric)) ? currentCompositeChoice() : null", 1), "choice storico town territorio")
                  return insert_after_line(b, "wireShell(panel.querySelector('.ux-view-shell'), 'ov-town-view', selectedTown, false);", "    panel.querySelectorAll('.composite-fixed-detail .trend-chart').forEach(chart=>toolkit.wireHistoryTooltips?.(chart));\\n", "tooltip fixed detail territorio")
              ux_history = patch_function(ux_history, "enhanceTown", ux_enhance_town)
          
              ux_history = replace_once(ux_history, "      if (metric.meta?.compositeType === 'sexBreakdown') {\n", "      if (metric.meta?.compositeType === 'sexBreakdown' || isTerritoryProfileHistoryMetric(metric)) {\n", "aggiorna storico town al cambio lettura territorio")
          
          '''
          text = runtime.read_text(encoding='utf-8')
          marker = '    APP00.write_text(app00, encoding="utf-8")\n'
          if text.count(marker) != 1:
              raise SystemExit('runtime UX insertion marker')
          text = text.replace(marker, ux_patch + marker, 1)
          text = text.replace(
              '    VISUAL_GRAMMAR.write_text(visual, encoding="utf-8")\n    print("Renderer territorio v1.37 applicato ai renderer canonici post-v1.36.")',
              '    VISUAL_GRAMMAR.write_text(visual, encoding="utf-8")\n    UX_HISTORY_CORE.write_text(ux_core, encoding="utf-8")\n    UX_HISTORY.write_text(ux_history, encoding="utf-8")\n    print("Renderer territorio v1.37 applicato: quote comunali, storico collettivo e tooltip canonici.")',
              1,
          )
          runtime.write_text(text, encoding='utf-8')
          
          # Rafforza il verifier: collocazione tematica, serie collettive e patch runtime.
          replace_once(
              verifier,
              'road = metrics["roadNetworkProfile"]\n',
              '''road = metrics["roadNetworkProfile"]
          if road.get("meta", {}).get("theme") != "mobilita":
              raise SystemExit("roadNetworkProfile: tema deve essere mobilita")
          mobility_sections = d.get("themes", {}).get("mobilita", {}).get("sections", [])
          environment_sections = d.get("themes", {}).get("ambiente", {}).get("sections", [])
          mobility_hits = [(s.get("key"), s.get("metrics", []).count("roadNetworkProfile")) for s in mobility_sections if "roadNetworkProfile" in s.get("metrics", [])]
          environment_hits = [s.get("key") for s in environment_sections if "roadNetworkProfile" in s.get("metrics", [])]
          if mobility_hits != [("veicoli", 1)] or environment_hits:
              raise SystemExit(f"roadNetworkProfile: collocazione tematica inattesa mobilita={mobility_hits} ambiente={environment_hits}")
          ''',
              'verifier road theme',
          )
          replace_once(
              verifier,
              'change = metrics["landUseChange"]\n',
              '''for metric_key, view_key in (("landUse", "percent"), ("landUseChange", "net")):
              metric = metrics[metric_key]
              reference_years = metric["rows"][0].get("seriesByView", {}).get(view_key, {}).get("years", [])
              if len(reference_years) < 2:
                  raise SystemExit(f"{metric_key}: storico collettivo insufficiente")
              for row in metric["rows"]:
                  series = row.get("seriesByView", {}).get(view_key, {})
                  if series.get("years") != reference_years or len(series.get("values", [])) != len(reference_years):
                      raise SystemExit(f"{metric_key}: storico non omogeneo per {row['town']}")
          change = metrics["landUseChange"]
          ''',
              'verifier collective history',
          )
          replace_once(
              verifier,
              'print("canonical-dist-metrics", len(metrics))\n',
              '''bundle = Path("dist/assets/app-bundle.js").read_text(encoding="utf-8")
          ux_history = Path("dist/assets/ux-history.js").read_text(encoding="utf-8")
          ux_core = Path("dist/assets/ux-history-core.js").read_text(encoding="utf-8")
          for token in ("updateTerritoryProfileTownPosition", "Quota sul totale Versilia"):
              if token not in bundle:
                  raise SystemExit(f"runtime territorio: token mancante nel bundle: {token}")
          for token in ("TERRITORY_PROFILE_HISTORY_TYPES", "row.seriesByView?.[selected]"):
              if token not in ux_history:
                  raise SystemExit(f"storico collettivo territorio: token mancante: {token}")
          if "wireHistoryTooltips" not in ux_core:
              raise SystemExit("tooltip territorio: helper canonico non esportato")
          print("canonical-dist-metrics", len(metrics))
          ''',
              'verifier runtime tokens',
          )
          
          # Controllo sintattico dei tre file di produzione modificati.
          import py_compile
          for path in (materializer, runtime, verifier):
              py_compile.compile(str(path), doraise=True)
          print('review fixes applied')
          PY
      - name: Commit fixes to draft branch
        shell: bash
        run: |
          if git diff --quiet -- scripts/materialize_territorio_v137.py scripts/patch_territorio_v137_runtime.py scripts/verify_territorio_v137_dist.py; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "EmAnzi3"
          git config user.email "emanueleanzilotti@hotmail.com"
          git add scripts/materialize_territorio_v137.py scripts/patch_territorio_v137_runtime.py scripts/verify_territorio_v137_dist.py
          git commit -m "fix(territorio): align review semantics and history UX"
          git push origin HEAD:draft/territorio-indicatori-v137
