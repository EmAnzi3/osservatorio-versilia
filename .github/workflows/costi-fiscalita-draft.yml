name: Draft costi e fiscalità

on:
  push:
    branches: ["agent/costi-fiscalita-redditi"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "costi-fiscalita-draft-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source-audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pypdf

      - name: Audit official MEF income history
        continue-on-error: true
        run: python scripts/audit_income_history_mef.py --start 2011 --end 2024 --out /tmp/mef-income-history.json

      - name: Audit official MEF IMU 2025
        continue-on-error: true
        run: python scripts/audit_imu_2025.py --out /tmp/imu-2025.json

      - name: Audit MIMIT fuel prices
        continue-on-error: true
        run: python scripts/audit_fuel_prices_mimit.py --out /tmp/mimit-fuel.json

      - name: Audit ISPRA waste-service costs
        continue-on-error: true
        run: python scripts/audit_waste_cost_ispra.py --out /tmp/ispra-waste-cost.json

      - name: Audit official ISTAT Tuscany NIC inflation
        continue-on-error: true
        run: python scripts/audit_inflation_nic_toscana.py --out /tmp/nic-toscana-2011-2024.json

      - name: Audit missing TARI 2025 documents
        continue-on-error: true
        run: python scripts/audit_tari_2025_missing.py --out /tmp/tari-2025-missing.json

      - name: Install browser tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Materialize promoted indicators
        run: python scripts/apply_costi_fiscalita_redditi_draft.py

      - name: Validate cost and taxation draft
        run: python scripts/test_costi_fiscalita_redditi_draft.py

      - name: Build pre-rendered site
        run: python scripts/build_static_brand.py

      - name: Start local draft server
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8123 --directory dist >/tmp/ov-draft-http.log 2>&1 &
          echo $! > /tmp/ov-draft-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ov-draft-http.log
          exit 1

      - name: Run all Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in $(find scripts -maxdepth 1 -type f -name 'test_*.py' | sort); do
            echo "::group::$test_file"
            python "$test_file"
            echo "::endgroup::"
          done

      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/pwa.js
          node --check assets/ux-accordion.js
          node --check assets/visual-grammar.js
          node --check service-worker.js
          node --check percorsi/app.js
          node --check percorsi/data-loader.js
          node --check dist/assets/app-bundle.js

      - name: Include Percorsi Versilia
        run: python scripts/copy_percorsi_dist.py

      - name: Upload source audit snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: costi-fiscalita-source-audits
          path: |
            /tmp/mef-income-history.json
            /tmp/imu-2025.json
            /tmp/tari-2025-missing.json
            /tmp/mimit-fuel.json
            /tmp/ispra-waste-cost.json
            /tmp/nic-toscana-2011-2024.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload local-style draft preview
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-costi-fiscalita-draft
          path: dist
          retention-days: 14
