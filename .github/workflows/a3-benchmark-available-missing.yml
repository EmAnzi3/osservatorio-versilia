name: A3 Benchmark AVAILABLE_MISSING
# certification trigger after controlled fan-in

on:
  pull_request:
    branches: ["fix/a3-enrichment-publication-gap"]
    paths:
      - ".github/workflows/a3-benchmark-available-missing.yml"
      - "scripts/build_static_brand.py"
      - "scripts/materialize_a3_benchmark_*.py"
      - "scripts/a3_publication_gap_audit.py"
      - "scripts/a3_benchmark_available_missing.py"
      - "scripts/enrichment_audit_matrix.py"
      - "data/source-snapshots/a3-*-benchmark-*.json"
      - "data/site-data.json"
      - "data/source-registry.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: diff
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "${{ github.event.action }}" != "synchronize" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^ HEAD > /tmp/changed-files
          if grep -Eq '^(scripts/build_static_brand\.py|scripts/materialize_a3_benchmark_.*\.py|scripts/a3_publication_gap_audit\.py|scripts/a3_benchmark_available_missing\.py|scripts/enrichment_audit_matrix\.py|data/source-snapshots/a3-.*-benchmark-.*\.json|data/site-data\.json|data/source-registry\.json)' /tmp/changed-files; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/changed-files

  benchmark-backlog:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Build effective public catalog
        env:
          OV_RELEASE_BUILD: "1"
        run: python scripts/build_static_brand.py
      - name: Run A3 matrix regression
        run: python scripts/test_enrichment_audit_matrix.py
      - name: Build effective A3 matrix
        run: |
          python scripts/enrichment_audit_matrix.py             --data dist/data/site-data.json             --registry dist/data/source-registry.json             --output /tmp/a3-enrichment-matrix.json             --allow-unclassified
      - name: Verify acquired benchmarks are publicly consumable
        run: |
          python scripts/a3_publication_gap_audit.py \
            --data dist/data/site-data.json \
            --matrix /tmp/a3-enrichment-matrix.json \
            --dist dist \
            --json-output /tmp/a3-benchmark-publication.json \
            --strict
      - name: Build benchmark AVAILABLE_MISSING manifest
        run: |
          python -m py_compile scripts/a3_benchmark_available_missing.py
          python scripts/a3_benchmark_available_missing.py             --matrix /tmp/a3-enrichment-matrix.json             --json-output /tmp/a3-benchmark-available-missing.json             --markdown-output /tmp/A3_BENCHMARK_AVAILABLE_MISSING.md
      - name: Upload benchmark backlog
        uses: actions/upload-artifact@v4
        with:
          name: a3-benchmark-available-missing
          path: |
            /tmp/a3-benchmark-available-missing.json
            /tmp/A3_BENCHMARK_AVAILABLE_MISSING.md
          if-no-files-found: error
