name: Audit PNRR Toscana

on:
  pull_request:
    paths:
      - "scripts/pnrr_toscana_audit.py"
      - "scripts/pnrr_toscana_forensic.py"
      - "scripts/pnrr_toscana_snapshot_runner.py"
      - "scripts/test_pnrr_toscana_audit.py"
      - ".github/workflows/pnrr-toscana-audit.yml"
      - "data/site-data.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python scripts/test_pnrr_toscana_audit.py
          python -m py_compile \
            scripts/pnrr_toscana_audit.py \
            scripts/pnrr_toscana_forensic.py \
            scripts/pnrr_toscana_snapshot_runner.py \
            scripts/test_pnrr_toscana_audit.py

      - name: Download one official source snapshot
        run: |
          mkdir -p reports/runtime
          curl \
            --fail \
            --location \
            --retry 4 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 360 \
            --user-agent "OsservatorioVersiliaDataMonitor/1.1 (+https://osservatorioversilia.it/)" \
            "https://www301.regione.toscana.it/bancadati/pnrrPerSitoWeb/getOpenData_v6.csv" \
            --output reports/runtime/rt-pnrr-current.csv
          test -s reports/runtime/rt-pnrr-current.csv

      - name: Audit and project-level forensic inventory
        run: |
          python scripts/pnrr_toscana_snapshot_runner.py \
            --source reports/runtime/rt-pnrr-current.csv \
            --audit-json reports/pnrr-toscana-audit.json \
            --audit-md reports/pnrr-toscana-audit.md \
            --forensic-json reports/pnrr-toscana-forensic.json \
            --forensic-md reports/pnrr-toscana-forensic.md

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: pnrr-toscana-audit
          path: |
            reports/pnrr-toscana-audit.json
            reports/pnrr-toscana-audit.md
            reports/pnrr-toscana-forensic.json
            reports/pnrr-toscana-forensic.md
          retention-days: 14
          if-no-files-found: error
