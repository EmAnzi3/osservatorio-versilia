name: A3 ARS History Acquisition

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/acquire_a3_5_ars_legacy_history.py"
      - ".github/workflows/a3-ars-history-acquire.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire official ARS legacy history
        run: |
          python scripts/acquire_a3_5_ars_legacy_history.py \
            --output /tmp/ars-a3-5-legacy-history.json

      - name: Upload frozen candidate snapshot
        uses: actions/upload-artifact@v4
        with:
          name: a3-ars-legacy-history
          path: /tmp/ars-a3-5-legacy-history.json
          if-no-files-found: error
