name: Mobilità v6 - integrated site artifact

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/mobilita-v6-preview-input.json'
      - 'scripts/build_mobilita_v6_site_preview.py'
      - 'scripts/capture_mobilita_v6_preview.py'
      - '.github/workflows/mobilita-v6-integrated-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrate Mobility candidate into current site tree
        run: python scripts/build_mobilita_v6_site_preview.py

      - name: Assemble complete navigable site artifact
        run: |
          OUT='artifacts/osservatorio-versilia-mobilita-v6-integrato'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          rsync -a ./ "$OUT/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='artifacts/' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='STATIC_REFACTOR.md'

          cat > "$OUT/LEGGIMI-COLLAUDO.txt" <<'EOF'
          OSSERVATORIO VERSILIA — ARTIFACT INTEGRATO LOTTO MOBILITÀ V6

          Questo pacchetto È il sito completo di collaudo, non un report e non un mockup.
          Parte dall'attuale struttura del sito e integra il candidato Mobilità nelle pagine reali.

          Pagine da controllare dopo aver avviato il server locale:
          - /confronta/mobilita/?indicatore=scheduledTplTripsPer1000
          - /comuni/massarosa/?tema=mobilita&indicatore=scheduledTplTripsPer1000
          - /comuni/forte-dei-marmi/?tema=mobilita&indicatore=scheduledTplTripsPer1000

          Il resto del sito è presente e navigabile per verificare coerenza di header, footer, temi, comuni e responsive.
          Il candidato Istat sulla popolazione insistente NON è inserito perché non validato per i 7 Comuni.

          Windows: doppio click su AVVIA-COLLAUDO.bat
          macOS/Linux: eseguire ./AVVIA-COLLAUDO.sh
          EOF

          cat > "$OUT/AVVIA-COLLAUDO.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          start "" http://127.0.0.1:4173/confronta/mobilita/?indicatore=scheduledTplTripsPer1000
          py -m http.server 4173 --bind 127.0.0.1
          if errorlevel 1 python -m http.server 4173 --bind 127.0.0.1
          EOF

          cat > "$OUT/AVVIA-COLLAUDO.sh" <<'EOF'
          #!/usr/bin/env sh
          cd "$(dirname "$0")"
          python3 -m http.server 4173 --bind 127.0.0.1
          EOF
          chmod +x "$OUT/AVVIA-COLLAUDO.sh"

      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate the packaged site itself
        run: |
          cd artifacts/osservatorio-versilia-mobilita-v6-integrato
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/mobilita-integrated-http.log 2>&1 &
          echo $! > /tmp/mobilita-integrated-http.pid
          cd ../..
          sleep 2
          python scripts/capture_mobilita_v6_preview.py

      - name: Verify artifact contains full site routes
        run: |
          OUT='artifacts/osservatorio-versilia-mobilita-v6-integrato'
          test -f "$OUT/index.html"
          test -f "$OUT/confronta/mobilita/index.html"
          test -f "$OUT/comuni/massarosa/index.html"
          test -f "$OUT/comuni/forte-dei-marmi/index.html"
          test -f "$OUT/data/site-data.json"
          test -f "$OUT/assets/app.js"
          test -f "$OUT/assets/mobilita-v6-preview.js"
          test -f "$OUT/review/mobilita-v6-preview-input.json"

      - name: Upload integrated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-mobilita-v6-integrato-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/osservatorio-versilia-mobilita-v6-integrato/
          retention-days: 14
