name: Territorio v1.37 Iter.Net boundary diagnostic

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-road-attributes-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS stack
        run: python -m pip install geopandas pyogrio shapely
      - name: Fingerprint Istat municipal boundaries against Iter.Net
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil, urllib.request, zipfile
          import geopandas as gpd
          from shapely.ops import unary_union

          WORK = Path('/tmp/territorio-v137-boundary-fingerprint')
          WORK.mkdir(parents=True, exist_ok=True)
          UA = {'User-Agent': 'OsservatorioVersilia-v137-boundary-fingerprint/1.0'}
          TOWNS = {
              'Camaiore': '046005', 'Forte dei Marmi': '046013',
              'Massarosa': '046018', 'Pietrasanta': '046024',
              'Seravezza': '046028', 'Stazzema': '046030', 'Viareggio': '046033'
          }
          OLD = {
              'Camaiore': 443.220097, 'Forte dei Marmi': 84.759517,
              'Massarosa': 341.835576, 'Pietrasanta': 304.546621,
              'Seravezza': 184.836205, 'Stazzema': 265.811675,
              'Viareggio': 404.645390
          }
          CURRENT = {
              'Camaiore': 480.955860, 'Forte dei Marmi': 139.038100,
              'Massarosa': 313.923233, 'Pietrasanta': 411.130550,
              'Seravezza': 153.945273, 'Stazzema': 120.352216,
              'Viareggio': 410.309849
          }
          SOURCES = {}
          for year in (2026, 2025, 2024, 2023):
              SOURCES[f'g{year}'] = f'https://www.istat.it/storage/cartografia/confini_amministrativi/generalizzati/{year}/Limiti0101{year}_g.zip'
              SOURCES[f'n{year}'] = f'https://www.istat.it/storage/cartografia/confini_amministrativi/non_generalizzati/{year}/Limiti0101{year}.zip'
          ROADS_URL = 'https://www502.regione.toscana.it/geoscopio/download/grafo_stradale/iternet.zip'

          def download(url, dest):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=900) as response, dest.open('wb') as fh:
                      shutil.copyfileobj(response, fh, length=1024 * 1024)
                  return True, dest.stat().st_size
              except Exception as exc:
                  return False, repr(exc)

          def extract(src, dst):
              dst.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(src) as z: z.extractall(dst)

          def norm(v):
              if v is None: return ''
              s = str(v).strip()
              if s.endswith('.0'): s = s[:-2]
              d = ''.join(c for c in s if c.isdigit())
              return d.zfill(6) if d else ''

          def clean(g):
              if g is None or g.is_empty: return g
              if not g.is_valid:
                  try: g = g.make_valid()
                  except AttributeError: g = g.buffer(0)
              return g

          def clip_km(frame, poly):
              minx, miny, maxx, maxy = poly.bounds
              sub = frame.cx[minx:maxx, miny:maxy]
              return float(sub.geometry.intersection(poly).length.sum() / 1000.0) if not sub.empty else 0.0

          roads_zip = WORK / 'roads.zip'
          ok, detail = download(ROADS_URL, roads_zip)
          if not ok: raise RuntimeError(detail)
          outer = WORK / 'roads_outer'; extract(roads_zip, outer)
          inner_zip = next(iter(outer.rglob('*.zip')))
          inner = WORK / 'roads_inner'; extract(inner_zip, inner)
          shp = next(p for p in inner.rglob('*.shp') if p.name.lower() == 'elem_strad.shp')
          roads = gpd.read_file(shp, engine='pyogrio', columns=[]).to_crs(3003)
          if len(roads) != 405341: raise RuntimeError(f'Unexpected Iter.Net count {len(roads)}')

          result = {'iterNetFeatures': len(roads), 'sources': {}}
          for label, url in SOURCES.items():
              z = WORK / f'{label}.zip'
              ok, detail = download(url, z)
              if not ok:
                  result['sources'][label] = {'url': url, 'downloadError': detail}
                  continue
              folder = WORK / label; extract(z, folder)
              candidates = list(folder.rglob('Com*.shp'))
              if not candidates:
                  result['sources'][label] = {'url': url, 'error': 'No Com*.shp'}
                  continue
              municipal = gpd.read_file(candidates[0], engine='pyogrio')
              code_field = next((c for c in ('PRO_COM_T','PRO_COM','COD_PROCOM') if c in municipal.columns), None)
              if not code_field:
                  result['sources'][label] = {'url': url, 'error': f'No code field: {list(municipal.columns)}'}
                  continue
              municipal = municipal.copy(); municipal['_code'] = municipal[code_field].map(norm)
              municipal = municipal[municipal['_code'].isin(TOWNS.values())].to_crs(3003)
              geoms = {
                  town: clean(unary_union(list(municipal.loc[municipal['_code'] == code, 'geometry'])))
                  for town, code in TOWNS.items()
              }
              if any(g is None or g.is_empty for g in geoms.values()):
                  result['sources'][label] = {'url': url, 'error': 'Missing municipality geometry'}
                  continue
              union = clean(unary_union(list(geoms.values())))
              vector = {town: clip_km(roads, geom) for town, geom in geoms.items()}
              result['sources'][label] = {
                  'url': url,
                  'file': candidates[0].name,
                  'areaKm2': union.area / 1e6,
                  'graphKm': clip_km(roads, union),
                  'municipalGraphKm': vector,
                  'sumMunicipalKm': sum(vector.values()),
                  'distanceOldSumAbsKm': sum(abs(vector[t]-OLD[t]) for t in TOWNS),
                  'distanceOldMaxAbsKm': max(abs(vector[t]-OLD[t]) for t in TOWNS),
                  'distanceCurrentSumAbsKm': sum(abs(vector[t]-CURRENT[t]) for t in TOWNS),
                  'distanceCurrentMaxAbsKm': max(abs(vector[t]-CURRENT[t]) for t in TOWNS),
              }

          def rounded(x):
              if isinstance(x, dict): return {k: rounded(v) for k,v in x.items()}
              if isinstance(x, list): return [rounded(v) for v in x]
              if isinstance(x, float): return round(x, 6)
              return x
          result = rounded(result)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          Path('reports').mkdir(exist_ok=True)
          Path('reports/territorio-v137-boundary-fingerprint.json').write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: territorio-v137-boundary-fingerprint
          path: reports/territorio-v137-boundary-fingerprint.json
          retention-days: 7
