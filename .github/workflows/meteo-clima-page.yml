name: Validate Meteo e clima page

on:
  pull_request:
    paths:
      - "confronta/meteo-clima/**"
      - "confronta/ambiente/index.html"
      - "assets/meteo-clima.css"
      - "assets/meteo-clima.js"
      - "assets/climate-ux-v3.js"
      - "assets/climate-town-benchmark.js"
      - "assets/app-parts/**"
      - "data/meteo-clima-poc.json"
      - "data/meteo-clima-minmax-poc.json"
      - ".github/workflows/meteo-clima-page.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python -m json.tool data/meteo-clima-poc.json > /dev/null
          python -m json.tool data/meteo-clima-minmax-poc.json > /dev/null

      - name: Validate JavaScript syntax
        run: |
          node --check assets/meteo-clima.js
          node --check assets/climate-ux-v3.js
          node --check assets/climate-town-benchmark.js
          cat assets/app-parts/00.txt assets/app-parts/01.txt assets/app-parts/02.txt assets/app-parts/03.txt assets/app-parts/04.txt assets/app-parts/05.txt assets/app-parts/06.txt > /tmp/app-bundle.js
          node --check /tmp/app-bundle.js

      - name: Validate climate data contract and native Ambiente integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {'Camaiore','Forte dei Marmi','Massarosa','Pietrasanta','Seravezza','Stazzema','Viareggio'}
          data = json.loads(Path('data/meteo-clima-poc.json').read_text(encoding='utf-8'))
          towns = data['municipalities']
          assert set(towns) == expected, (set(towns), expected)
          assert data['coverage']['complete'] == {'from': 1950, 'to': 2025}
          expected_years = list(range(1950, 2026))
          for name, series in towns.items():
              assert series['years'] == expected_years, name
              assert len(series['temperature']) == 76, name
              assert len(series['precipitation']) == 76, name
              assert series['latestComplete']['year'] == 2025, name
              assert all(isinstance(v, (int, float)) for v in series['temperature']), name
              assert all(isinstance(v, (int, float)) for v in series['precipitation']), name

          minmax = json.loads(Path('data/meteo-clima-minmax-poc.json').read_text(encoding='utf-8'))
          assert minmax['coverage'] == {'from': 1995, 'to': 2025}
          assert minmax['version'] == 'poc-3'
          assert set(minmax['municipalities']) == expected
          expected_minmax_years = list(range(1995, 2026))
          for name, series in minmax['municipalities'].items():
              assert series['years'] == expected_minmax_years, name
              assert len(series['tmin']) == 31 and len(series['tmax']) == 31, name
              assert series['latestComplete']['year'] == 2025, name
              assert series['latestComplete']['tmin'] == series['tmin'][-1], name
              assert series['latestComplete']['tmax'] == series['tmax'][-1], name
              assert series['calibration']['period'] == [2011, 2015], name
              assert series['calibration']['independent_temporal_validation'] == 'SIR Toscana', name

          environment = Path('confronta/ambiente/index.html').read_text(encoding='utf-8')
          assert 'climate-environment-entry' not in environment
          assert 'meteo-clima-entry.js' not in environment

          app6 = Path('assets/app-parts/06.txt').read_text(encoding='utf-8')
          app = ''.join(Path(f'assets/app-parts/{i:02}.txt').read_text(encoding='utf-8') for i in range(7))
          for token in (
              "key: 'clima'",
              'climateTemperatureTrend50y',
              'climatePrecipitationTrend50y',
              'climateTminTrend',
              'climateTmaxTrend',
              "metricKey === 'floodExposure'",
              "metricKey === 'landslideExposure'",
              "deep.hidden = !(isFlood || isLandslide)",
              'const baseBarRows = barRows',
              "left:${left.toFixed(2)}%",
              "linearClimateTrend(series.years, values, 1995, 2025)",
              "year: '1995–2025'",
              "coverage: '7/7 · 1995–2025'",
              "href:CLIMATE_METRICS.has(key) ? climateDetailHref(key) : indicatorHref(m)",
          ):
              assert token in app, token
          assert '<span class="bar-rank">${index + 1}</span>' not in app6

          ux = Path('assets/climate-ux-v3.js').read_text(encoding='utf-8')
          assert "climateTminTrend:{label:'Temperatura minima media annua'" in ux
          assert "seriesKey:'tmin',unit:'celsius',latestYear:2025,trendFrom:1995,trendTo:2025" in ux
          assert "seriesKey:'tmax',unit:'celsius',latestYear:2025,trendFrom:1995,trendTo:2025" in ux
          benchmark = Path('assets/climate-town-benchmark.js').read_text(encoding='utf-8')
          assert "climateTminTrend: { seriesKey: 'tmin', latestYear: 2025" in benchmark
          assert "climateTmaxTrend: { seriesKey: 'tmax', latestYear: 2025" in benchmark

          html = Path('confronta/meteo-clima/index.html').read_text(encoding='utf-8')
          assert '1975–2025' in html
          assert 'temperature-min-max' in html
          print('Climate draft OK: native Ambiente accordion + Tmin/Tmax 1995–2025 + town metrics + no rankings + conditional risk detail')
          PY
