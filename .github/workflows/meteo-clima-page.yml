name: Validate Meteo e clima page

on:
  pull_request:
    paths:
      - "confronta/meteo-clima/**"
      - "confronta/ambiente/index.html"
      - "assets/meteo-clima-editorial.css"
      - "assets/meteo-clima-editorial.js"
      - "assets/climate-ux-v3.js"
      - "assets/climate-town-benchmark.js"
      - "assets/app-parts/**"
      - "data/meteo-clima-poc.json"
      - "data/meteo-clima-minmax-poc.json"
      - "data/meteo-clima-minmax-lamma-1995-2015.json"
      - "scripts/climate_hardening_audit.py"
      - ".github/workflows/meteo-clima-page.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON and Python
        run: |
          python -m json.tool data/meteo-clima-poc.json > /dev/null
          python -m json.tool data/meteo-clima-minmax-poc.json > /dev/null
          python -m json.tool data/meteo-clima-minmax-lamma-1995-2015.json > /dev/null
          python -m py_compile scripts/climate_hardening_audit.py

      - name: Validate JavaScript syntax
        run: |
          node --check assets/meteo-clima-editorial.js
          node --check assets/climate-ux-v3.js
          node --check assets/climate-town-benchmark.js
          cat assets/app-parts/00.txt assets/app-parts/01.txt assets/app-parts/02.txt assets/app-parts/03.txt assets/app-parts/04.txt assets/app-parts/05.txt assets/app-parts/06.txt > /tmp/app-bundle.js
          node --check /tmp/app-bundle.js

      - name: Validate climate data contract and editorial semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {'Camaiore','Forte dei Marmi','Massarosa','Pietrasanta','Seravezza','Stazzema','Viareggio'}
          data = json.loads(Path('data/meteo-clima-poc.json').read_text(encoding='utf-8'))
          assert set(data['municipalities']) == expected
          assert data['coverage']['complete'] == {'from': 1950, 'to': 2025}
          assert data['coverage'].get('partial') is None
          for name, series in data['municipalities'].items():
              assert series['years'] == list(range(1950, 2026)), name
              assert series['latestComplete']['year'] == 2025, name

          minmax = json.loads(Path('data/meteo-clima-minmax-poc.json').read_text(encoding='utf-8'))
          assert set(minmax['municipalities']) == expected
          assert minmax['coverage'] == {'from': 1975, 'to': 2025}
          assert minmax['version'] == 'poc-5'
          for name, series in minmax['municipalities'].items():
              assert series['years'] == list(range(1975, 2026)), name
              assert series['latestComplete']['year'] == 2025, name
              assert series['calibration']['period'] == [2011, 2015], name
              assert series['calibration']['independent_temporal_validation'] == 'SIR Toscana', name

          catalog = json.loads(Path('data/site-data.json').read_text(encoding='utf-8'))
          climate_keys = {'climateTemperatureTrend50y','climatePrecipitationTrend50y','climateTminTrend','climateTmaxTrend'}
          assert climate_keys <= set(catalog['metrics'])
          assert set(next(section for section in catalog['themes']['ambiente']['sections'] if section['key'] == 'clima')['metrics']) == climate_keys
          for key in climate_keys:
              assert catalog['metrics'][key]['dataStorage']['type'] == 'external-climate'
              assert catalog['metrics'][key]['rows'] == []

          html = Path('confronta/meteo-clima/index.html').read_text(encoding='utf-8')
          assert 'noindex,nofollow' in html
          assert 'meteo-clima-editorial.js' in html
          assert 'meteo-clima.js' not in html
          assert 'Confronto senza classifiche' in html
          assert 'media aritmetica semplice dei sette Comuni' in html
          assert 'Nessun valore pubblico viene sostituito automaticamente' in html
          assert 'temperature-min-max' not in html

          js = Path('assets/meteo-clima-editorial.js').read_text(encoding='utf-8')
          assert ".sort((a,b)=>a.localeCompare(b,'it'))" in js
          assert "latestYear(state.metric)" in js
          assert "source-monitor-state.json" in js
          assert "data-climate-metric" in js
          assert '.sort((a,b)=>b.' not in js

          workflow = Path('.github/workflows/meteo-poc.yml').read_text(encoding='utf-8')
          assert 'era5_land_ytd.py' not in workflow
          assert 'current-year ERA5-Land YTD' not in workflow
          assert 'climate_hardening_audit.py' in workflow
          print('Climate draft OK: 4 canonical metrics, complete-year-only, alphabetical comparison, explicit benchmark, hardening audit, no rankings')
          PY
