name: Preview-only draft sicurezza

on:
  push:
    branches: ["agent/sicurezza-territorio-draft"]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sicurezza-territorio-draft
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Build exact repository draft
        run: |
          python scripts/build_static_brand.py
          python scripts/copy_percorsi_dist.py
      - name: Upload browser preview
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-pr65-browser-preview
          path: dist
          if-no-files-found: error
          retention-days: 7
