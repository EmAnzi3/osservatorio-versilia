name: Align v1.29 release contracts

on:
  push:
    branches: ["feat/v1.29.0-salute-finanziaria"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "align-v129-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Align release and cache contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              'scripts/test_attivita_estrattive_v128.py': {
                  'assert site["version"] == "v1.28.0"': 'assert site["version"] == "v1.29.0"',
                  'assert site["updated"] == "2 settembre 2026"': 'assert site["updated"] == "3 settembre 2026"',
                  'assert len(site["metrics"]) == 180': 'assert len(site["metrics"]) == 181',
                  'assert registry["expectedMetricCount"] == 180': 'assert registry["expectedMetricCount"] == 181',
                  'assert registry["expectedInlineMetricCount"] == 176': 'assert registry["expectedInlineMetricCount"] == 177',
              },
              'assets/app.js': {
                  "const VERSION='20260902-v128-attivita-estrattive';": "const VERSION='20260903-v129-salute-finanziaria';",
              },
              'scripts/build_static_safe.py': {
                  'UX_ASSET_VERSION = "20260902-v128-attivita-estrattive"': 'UX_ASSET_VERSION = "20260903-v129-salute-finanziaria"',
                  'HISTORY_ASSET_VERSION = "20260902-v128-attivita-estrattive"': 'HISTORY_ASSET_VERSION = "20260903-v129-salute-finanziaria"',
              },
              'scripts/build_static_brand.py': {
                  'APP_BUNDLE_ASSET_VERSION = "20260902-v128-attivita-estrattive"': 'APP_BUNDLE_ASSET_VERSION = "20260903-v129-salute-finanziaria"',
                  'PWA_JS_REVISION = "catalog-v128"': 'PWA_JS_REVISION = "catalog-v129"',
              },
              'assets/ux-history.js': {
                  "const HOTFIX_VERSION = '20260902-v128-attivita-estrattive';": "const HOTFIX_VERSION = '20260903-v129-salute-finanziaria';",
              },
              'service-worker.js': {
                  "const VERSION = 'ov-pwa-20260902-v128-attivita-estrattive';": "const VERSION = 'ov-pwa-20260903-v129-salute-finanziaria';",
              },
          }

          for filename, replacements in files.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'Contratto inatteso in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate aligned contracts
        run: |
          python scripts/test_attivita_estrattive_v128.py
          python scripts/test_cultura_history_cache_v121.py
          python scripts/test_salute_finanziaria_v129.py
          python scripts/finalize_catalog_release.py --check
          git diff --check

      - name: Commit aligned files
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/test_attivita_estrattive_v128.py \
            assets/app.js \
            scripts/build_static_safe.py \
            scripts/build_static_brand.py \
            assets/ux-history.js \
            service-worker.js
          git commit -m "Allinea cache e regressioni alla v1.29.0"
          git push origin "HEAD:${BRANCH_NAME}"
