name: A3 Benchmark source probes

on:
  pull_request:
    branches: ["fix/a3-enrichment-publication-gap"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  istat-business:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install requests openpyxl
      - name: Probe official ISTAT Frame-SBS regional tables
        run: |
          python scripts/probe_a3_benchmark_istat_business.py             --output /tmp/a3-benchmark-istat-business.json
      - uses: actions/upload-artifact@v4
        with:
          name: a3-benchmark-istat-business-probe
          path: /tmp/a3-benchmark-istat-business.json
          if-no-files-found: error

  openbdap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install requests
      - name: Probe official OpenBDAP Toscana archives
        run: |
          python scripts/probe_bilanci_v139_sources.py             --output /tmp/a3-benchmark-openbdap-source-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: a3-benchmark-openbdap-probe
          path: /tmp/a3-benchmark-openbdap-source-audit.json
          if-no-files-found: error
