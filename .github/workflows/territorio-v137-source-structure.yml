name: Territorio v1.37 source structure

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - scripts/inspect_territorio_v137_structure.py
      - .github/workflows/territorio-v137-source-structure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS dependencies
        run: python -m pip install --disable-pip-version-check openpyxl geopandas pyogrio shapely
      - name: Inspect official source schemas
        run: python scripts/inspect_territorio_v137_structure.py
      - name: Upload structure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: territorio-v137-source-structure
          path: tmp/territorio-v137-structure.json
          if-no-files-found: error
          retention-days: 7
