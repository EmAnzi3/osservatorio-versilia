name: Territorio v1.37 road enrichment retry

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-road-enrichment-retry.yml

permissions:
  contents: write
  actions: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - name: Point town QA directly at the selected road indicator
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/territorio-v137-road-enrichment.yml')
          text=path.read_text(encoding='utf-8')
          old="town.goto('http://127.0.0.1:8765/comuni/massarosa/',wait_until='networkidle')"
          new="town.goto('http://127.0.0.1:8765/comuni/massarosa/?tema=ambiente&indicatore=roadNetworkProfile',wait_until='networkidle')"
          if text.count(old)!=1:
              raise SystemExit(f'town URL target count {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit QA route correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/territorio-v137-road-enrichment.yml
          git commit -m "ci(territorio): target road metric in town QA"
          git push origin HEAD:draft/territorio-indicatori-v137
      - name: Dispatch corrected enrichment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run territorio-v137-road-enrichment.yml --ref draft/territorio-indicatori-v137
