name: Fix TPL browser gate selector

on:
  push:
    branches: ["feat/agricoltura-territorio"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agricoltura-territorio
      - name: Align browser gate with shared chart toolbar
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test_mobilita_tpl_v119_browser.py')
          text = path.read_text(encoding='utf-8')
          old = '#compare-bars .tpl-chart-toolbar'
          new = '#compare-bars .compare-chart-toolbar.scale-toolbar'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'Expected 4 obsolete selectors, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_mobilita_tpl_v119_browser.py
          git diff --cached --exit-code && exit 0
          git commit -m "test(mobilita): allinea browser gate alla toolbar condivisa"
          git push origin HEAD:feat/agricoltura-territorio
