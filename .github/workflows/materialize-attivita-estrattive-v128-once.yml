name: Materializza Attività estrattive v1.28 una volta

on:
  push:
    branches:
      - feat/v1.28.0-attivita-estrattive
    paths:
      - data/source-snapshots/attivita-estrattive-v128.bootstrap.b64
      - scripts/attivita-estrattive-v128.bootstrap.part*
      - .github/workflows/materialize-attivita-estrattive-v128-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-attivita-estrattive-v128
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1.28.0-attivita-estrattive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode materializer and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          parts = sorted(Path('scripts').glob('attivita-estrattive-v128.bootstrap.part*'))
          if [p.name for p in parts] != [f'attivita-estrattive-v128.bootstrap.part{i:02d}' for i in range(7)]:
              raise SystemExit(f'Chunk bootstrap inattesi: {[p.name for p in parts]}')
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          payload = json.loads(gzip.decompress(base64.b64decode(encoded)).decode('utf-8'))
          expected = {
              'scripts/materialize_attivita_estrattive_v128.py',
              'scripts/test_attivita_estrattive_v128.py',
              'scripts/test_attivita_estrattive_v128_browser.py',
          }
          if set(payload) != expected:
              raise SystemExit(f'Bootstrap script inatteso: {sorted(payload)}')
          for name, content in payload.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')

          # Il payload snapshot caricato via Contents API conserva un deflate valido,
          # ma il trailer gzip ha un CRC non coerente. Manteniamo i byte del payload
          # e rendiamo il decoder tollerante esclusivamente a quel trailer: se il
          # deflate o il JSON sono corrotti il run continua comunque a fallire.
          materializer = Path('scripts/materialize_attivita_estrattive_v128.py')
          text = materializer.read_text(encoding='utf-8')
          old = '    payload = json.loads(gzip.decompress(raw).decode("utf-8"))\n'
          new = '''    try:\n        decoded = gzip.decompress(raw)\n    except gzip.BadGzipFile as exc:\n        if "CRC check failed" not in str(exc):\n            raise\n        import zlib\n        decoded = zlib.decompress(raw[10:-8], -zlib.MAX_WBITS)\n    payload = json.loads(decoded.decode("utf-8"))\n'''
          if old not in text:
              raise SystemExit('Punto di patch snapshot non trovato nel materializzatore')
          materializer.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile \
            scripts/materialize_attivita_estrattive_v128.py \
            scripts/test_attivita_estrattive_v128.py \
            scripts/test_attivita_estrattive_v128_browser.py

      - name: Materialize verified release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_attivita_estrattive_v128.py
          python scripts/finalize_catalog_release.py --check
          python scripts/test_catalog_release_v116.py
          python scripts/test_attivita_estrattive_v128.py
          python -m json.tool data/site-data.json >/dev/null
          python -m json.tool data/source-registry.json >/dev/null
          python -m json.tool data/source-monitor-state.json >/dev/null
          python -m json.tool data/source-snapshots/attivita-estrattive-v128.json >/dev/null

      - name: Remove one-shot bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/source-snapshots/attivita-estrattive-v128.bootstrap.b64
          rm -f data/source-snapshots/attivita-estrattive-v128.bootstrap.part*
          rm -f scripts/attivita-estrattive-v128.bootstrap.b64
          rm -f scripts/attivita-estrattive-v128.bootstrap.part*
          rm -f .github/workflows/materialize-attivita-estrattive-v128-once.yml

      - name: Commit materialized v1.28.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'Nessuna modifica da materializzare'; exit 1; }
          git commit -m "v1.28.0 – Attività estrattive"
          git push origin HEAD:feat/v1.28.0-attivita-estrattive
