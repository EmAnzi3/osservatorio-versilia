name: One-shot project release alignment

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-shot-project-release.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align project release
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/app-parts/05.txt")
          text = path.read_text(encoding="utf-8")
          old = "['2026.08.12-v1.9.0','12 agosto 2026','115 indicatori complessivi in 11 temi, inclusi i 4 indicatori climatici. Integrati Percorsi e mobilità lenta nel dataset principale e separato il tema Sicurezza e territorio.'],"
          new = "['2026.08.14-v1.10.0','14 agosto 2026','115 indicatori complessivi in 11 temi, inclusi i 4 indicatori climatici. Integrate distribuzione per fasce d’età, mobilità residenziale interna e distribuzione dei dichiaranti per fascia di reddito.'],"
          if text.count(old) != 1:
              raise SystemExit("Voce release attesa non trovata esattamente una volta; nessuna modifica eseguita")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit release alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-parts/05.txt
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Allinea cronologia progetto alla v1.10.0"
          git push origin HEAD:main
