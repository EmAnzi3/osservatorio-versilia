name: Territorio v1.37 visual QA

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-visual-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Build canonical dist
        run: python scripts/build_static_brand.py
      - name: Run browser QA and capture screenshots
        run: |
          mkdir -p reports/territorio-v137
          python -m http.server 8765 --directory dist >/tmp/territorio-v137-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json

          base = 'http://127.0.0.1:8765'
          slugs = [
              'suolo-consumato',
              'consumo-di-suolo-annuale',
              'territorio-in-aree-naturali-protette',
              'reticolo-idrografico',
              'grafo-viario-iter-net',
          ]
          out = Path('reports/territorio-v137')
          results = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for mode, viewport in [
                  ('desktop', {'width': 1440, 'height': 1100}),
                  ('mobile', {'width': 390, 'height': 844}),
              ]:
                  context = browser.new_context(viewport=viewport)
                  for slug in slugs:
                      page = context.new_page()
                      errors = []
                      page.on('console', lambda msg, errors=errors: errors.append(f'console:{msg.type}:{msg.text}') if msg.type == 'error' else None)
                      page.on('pageerror', lambda exc, errors=errors: errors.append(f'pageerror:{exc}'))
                      response = page.goto(f'{base}/indicatori/{slug}/', wait_until='networkidle')
                      status = response.status if response else None
                      if status != 200:
                          raise RuntimeError(f'{slug}/{mode}: HTTP {status}')

                      component = page.locator('select[data-composite-component]').first
                      component_options = []
                      if component.count():
                          component_options = component.locator('option').all_text_contents()
                          values = component.locator('option').evaluate_all('(els)=>els.map(e=>e.value)')
                          if len(values) > 1:
                              component.select_option(values[-1])
                              page.wait_for_timeout(250)

                      scale_buttons = page.locator('button[data-composite-scale]')
                      protected_scales = []
                      if scale_buttons.count():
                          protected_scales = scale_buttons.evaluate_all('(els)=>els.map(e=>e.dataset.compositeScale)')
                      if slug == 'territorio-in-aree-naturali-protette':
                          if not {'percent','hectares'}.issubset(set(protected_scales)):
                              raise RuntimeError(f'protectedNaturalAreas: toggle percent/ha incompleto: {protected_scales}')
                          page.locator('button[data-composite-scale="hectares"]').first.click()
                          page.wait_for_timeout(250)
                          active = page.locator('button[data-composite-scale="hectares"].active')
                          if not active.count():
                              raise RuntimeError('protectedNaturalAreas: toggle ha non attivo dopo click')

                      body = page.locator('body').inner_text()
                      if 'NaN' in body or 'undefined' in body.lower():
                          raise RuntimeError(f'{slug}/{mode}: NaN/undefined visibile')
                      if errors:
                          raise RuntimeError(f'{slug}/{mode}: errori browser: {errors}')

                      screenshot = out / f'{slug}-{mode}.png'
                      page.screenshot(path=str(screenshot), full_page=True)
                      results.append({
                          'slug': slug,
                          'mode': mode,
                          'status': status,
                          'title': page.title(),
                          'h1': page.locator('h1').first.text_content() if page.locator('h1').count() else '',
                          'componentOptions': component_options,
                          'protectedScales': protected_scales,
                          'screenshot': screenshot.name,
                      })
                      page.close()
                  context.close()
              browser.close()

          (out / 'visual-qa.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: territorio-v137-visual-qa
          path: reports/territorio-v137/
          if-no-files-found: error
          retention-days: 7
