name: Materialize v1.25 ERP draft

on:
  push:
    branches: ["feat/v125-morosita-erp"]

permissions:
  contents: write

concurrency:
  group: materialize-v125-erp-draft
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
        with:
          ref: feat/v125-morosita-erp
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize canonical files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/materialize_erp_arrears_v125.py \
            scripts/test_erp_arrears_v125.py \
            scripts/test_erp_arrears_v125_browser.py
          python scripts/materialize_erp_arrears_v125.py
          git diff > /tmp/erp-v125-first.diff
          python scripts/materialize_erp_arrears_v125.py
          git diff > /tmp/erp-v125-second.diff
          cmp /tmp/erp-v125-first.diff /tmp/erp-v125-second.diff
          python scripts/test_erp_arrears_v125.py
          python scripts/finalize_catalog_release.py --check
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool data/source-registry.json > /dev/null
          python -m json.tool data/source-monitor-state.json > /dev/null
          python -m json.tool data/source-snapshots/erp-lucca-arrears-2020-2024.json > /dev/null

      - name: Commit materialized draft
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json \
                  data/source-registry.json \
                  data/source-monitor-state.json \
                  data/source-snapshots/erp-lucca-arrears-2020-2024.json \
                  assets/app-parts/00.txt \
                  assets/app-parts/03.txt \
                  assets/app-parts/05.txt \
                  assets/app.js \
                  assets/ux-history.js \
                  assets/export-v161.js \
                  service-worker.js \
                  scripts/build_static_safe.py \
                  scripts/build_static_brand.py \
                  scripts/finalize_catalog_release.py \
                  scripts/test_catalog_release_v116.py \
                  docs/copertura-serie-storiche.md \
                  docs/coerenza-interfaccia.md \
                  README.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica da materializzare"
            exit 0
          fi
          git commit -m "Materializza Morosità ERP v1.25.0"
          git push origin HEAD:feat/v125-morosita-erp
