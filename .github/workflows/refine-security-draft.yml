name: Rifinitura draft sicurezza

on:
  push:
    branches: ["agent/sicurezza-territorio-draft"]
    paths:
      - "scripts/refine_security_draft.py"
      - ".github/workflows/refine-security-draft.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sicurezza-territorio-draft
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Applica correzioni metodologiche
        run: python scripts/refine_security_draft.py
      - name: Verifica sintassi e diff
        run: |
          python -m py_compile scripts/apply_security_draft.py scripts/test_composite_indicators.py scripts/test_accordion_no_overlap.py scripts/test_percorsi_draft.py scripts/test_percorsi_refinements.py
          python -m json.tool data/site-data.json >/dev/null
          python -m json.tool data/source-snapshots/sicurezza-territorio-draft-2026-08.json >/dev/null
          git diff --check
      - name: Commit del draft corretto e cleanup
        run: |
          git config user.name "EmAnzi3"
          git config user.email "emanueleanzilotti@hotmail.com"
          git rm scripts/refine_security_draft.py .github/workflows/refine-security-draft.yml
          git add assets/app-parts/03.txt assets/app-parts/05.txt data/site-data.json data/source-snapshots/sicurezza-territorio-draft-2026-08.json scripts/apply_security_draft.py scripts/test_composite_indicators.py scripts/test_accordion_no_overlap.py scripts/test_percorsi_draft.py scripts/test_percorsi_refinements.py
          git commit -m "Rafforza robustezza dati Sicurezza"
          git push origin HEAD:agent/sicurezza-territorio-draft
