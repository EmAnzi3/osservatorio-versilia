name: Restore original visual assets

on:
  push:
    branches: ["main"]
    paths:
      - ".fidelity/READY"

permissions:
  contents: write

jobs:
  restore-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the exact public assets from the original site
        shell: bash
        run: |
          set -euo pipefail
          base="https://versilia-in-numeri.decent-raven-1888.chatgpt.site"
          mkdir -p crests images assets/fonts

          curl -L --fail --retry 4 --retry-delay 2 "$base/crests/massarosa.png" -o crests/massarosa.png
          curl -L --fail --retry 4 --retry-delay 2 "$base/crests/viareggio.svg" -o crests/viareggio.svg
          curl -L --fail --retry 4 --retry-delay 2 "$base/crests/camaiore.svg" -o crests/camaiore.svg
          curl -L --fail --retry 4 --retry-delay 2 "$base/crests/pietrasanta.svg" -o crests/pietrasanta.svg
          curl -L --fail --retry 4 --retry-delay 2 "$base/crests/seravezza.png" -o crests/seravezza.png
          curl -L --fail --retry 4 --retry-delay 2 "$base/crests/forte-dei-marmi.svg" -o crests/forte-dei-marmi.svg
          curl -L --fail --retry 4 --retry-delay 2 "$base/crests/stazzema.webp" -o crests/stazzema.webp
          curl -L --fail --retry 4 --retry-delay 2 "$base/images/versilia-viareggio-apuane.jpg" -o images/versilia-viareggio-apuane.jpg

          curl -L --fail --retry 4 --retry-delay 2 "$base/assets/_vinext_fonts/geist-8ac0455e797f/geist-98bbbccb.woff2" -o assets/fonts/geist-latin.woff2
          curl -L --fail --retry 4 --retry-delay 2 "$base/assets/_vinext_fonts/geist-mono-00e989178794/geist-mono-013b2f2f.woff2" -o assets/fonts/geist-mono-latin.woff2

          test "$(stat -c%s crests/massarosa.png)" -gt 20000
          test "$(stat -c%s crests/viareggio.svg)" -gt 500000
          test "$(stat -c%s images/versilia-viareggio-apuane.jpg)" -gt 150000
          test "$(stat -c%s assets/fonts/geist-latin.woff2)" -gt 20000
          test "$(stat -c%s assets/fonts/geist-mono-latin.woff2)" -gt 15000

      - name: Commit restored assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fidelity .github/workflows/fidelity-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ripristina stemmi, immagine e font originali"
          git push
