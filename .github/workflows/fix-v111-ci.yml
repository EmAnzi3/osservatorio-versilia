name: Fix v1.11 CI assertion

on:
  push:
    branches: ["agent/migrazioni-omi-v111"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrazioni-omi-v111
          fetch-depth: 0
      - name: Align composite test with selectable chart DOM
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test_composite_indicators.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert page.locator("#compare-bars .ux-bar-row").count() == 7'
          new = 'assert page.locator("#compare-bars .selectable-topic-bars .bar-row").count() == 7'
          if old not in text:
              raise SystemExit('Expected assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git checkout origin/main -- scripts/__pycache__/build_static.cpython-312.pyc
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_composite_indicators.py scripts/__pycache__/build_static.cpython-312.pyc
          git commit -m "test: align v1.11 selectable comparison checks"
          git push origin HEAD:agent/migrazioni-omi-v111
