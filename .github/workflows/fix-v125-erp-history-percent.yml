name: Fix v1.25 ERP history percent

on:
  push:
    branches: ["feat/v125-morosita-erp"]

permissions:
  contents: write

concurrency:
  group: fix-v125-erp-history-percent
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v125-morosita-erp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch historical percent rendering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_required(path, old, new, count=1):
              p = root / path
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Pattern non trovato in {path}: {old!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Renderer storico: % deve essere equivalente a percent, mantenendo due decimali.
          replace_required(
              'assets/ux-history-core.js',
              "      case 'percent': return `${formatNumber(number, 1)}%`;",
              "      case '%': return `${formatNumber(number, 2)}%`;\n      case 'percent': return `${formatNumber(number, 1)}%`;",
          )
          replace_required(
              'assets/ux-history-core.js',
              "    if (unit === 'percent' || unit === 'percentagePoints') {",
              "    if (unit === '%' || unit === 'percent' || unit === 'percentagePoints') {",
          )

          # Il materializzatore deve riprodurre il fix da main e restare idempotente.
          replace_required(
              'scripts/materialize_erp_arrears_v125.py',
              'UXH = ROOT / "assets/ux-history.js"\n',
              'UXH = ROOT / "assets/ux-history.js"\nUXHC = ROOT / "assets/ux-history-core.js"\n',
          )
          materializer = root / 'scripts/materialize_erp_arrears_v125.py'
          text = materializer.read_text(encoding='utf-8')
          anchor = '    APP03.write_text(app, encoding="utf-8")\n'
          block = '''    history_core = UXHC.read_text(encoding="utf-8")\n    precise_percent = "      case '%': return `${formatNumber(number, 2)}%`;"\n    percent_line = "      case 'percent': return `${formatNumber(number, 1)}%`;"\n    if precise_percent not in history_core:\n        if percent_line not in history_core:\n            raise RuntimeError("Formatter percent storico non trovato")\n        history_core = history_core.replace(percent_line, precise_percent + "\\n" + percent_line, 1)\n    old_delta = "    if (unit === 'percent' || unit === 'percentagePoints') {"\n    new_delta = "    if (unit === '%' || unit === 'percent' || unit === 'percentagePoints') {"\n    if new_delta not in history_core:\n        if old_delta not in history_core:\n            raise RuntimeError("Delta percent storico non trovato")\n        history_core = history_core.replace(old_delta, new_delta, 1)\n    UXHC.write_text(history_core, encoding="utf-8")\n\n'''
          if 'history_core = UXHC.read_text' not in text:
              if anchor not in text:
                  raise SystemExit('Anchor patch_ui materializzatore non trovato')
              text = text.replace(anchor, anchor + '\n' + block, 1)
              materializer.write_text(text, encoding='utf-8')

          # Gate dati: il contratto include anche il renderer storico.
          test = root / 'scripts/test_erp_arrears_v125.py'
          text = test.read_text(encoding='utf-8')
          if 'UXHC = ROOT / "assets/ux-history-core.js"' not in text:
              text = text.replace('APP03 = ROOT / "assets/app-parts/03.txt"\n', 'APP03 = ROOT / "assets/app-parts/03.txt"\nUXHC = ROOT / "assets/ux-history-core.js"\n', 1)
          if 'history_core = UXHC.read_text' not in text:
              anchor = '    app03 = APP03.read_text(encoding="utf-8")\n'
              text = text.replace(anchor, anchor + '    history_core = UXHC.read_text(encoding="utf-8")\n', 1)
          anchor = '    assert "erp-arrears-view" in app03\n'
          checks = "    assert \"case '%'\" in history_core\n    assert \"unit === '%' || unit === 'percent'\" in history_core\n"
          if checks not in text:
              if anchor not in text:
                  raise SystemExit('Anchor test renderer ERP non trovato')
              text = text.replace(anchor, anchor + checks, 1)
          test.write_text(text, encoding='utf-8')

          # Browser gate: aspetta il renderer UX definitivo e verifica le etichette reali.
          browser = root / 'scripts/test_erp_arrears_v125_browser.py'
          text = browser.read_text(encoding='utf-8')
          old = '''                y_labels = page.locator(".trend-chart .chart-y-label").all_inner_texts()\n                assert any("%" in item for item in y_labels), y_labels\n'''
          new = '''                history_card = page.locator(".history-panel .ux-history-card")\n                history_card.wait_for(state="visible")\n                y_labels = history_card.locator(".ux-history-axis-label").all_inner_texts()\n                assert any("%" in item for item in y_labels), y_labels\n                history_summary = history_card.locator(".ux-history-summary").inner_text()\n                assert "%" in history_summary, history_summary\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Asserzione Y storico ERP non trovata')
              text = text.replace(old, new, 1)
          browser.write_text(text, encoding='utf-8')
          PY

          python -m py_compile scripts/materialize_erp_arrears_v125.py scripts/test_erp_arrears_v125.py scripts/test_erp_arrears_v125_browser.py
          python scripts/materialize_erp_arrears_v125.py
          cp assets/ux-history-core.js /tmp/history-core-first.js
          cp data/site-data.json /tmp/site-first.json
          python scripts/materialize_erp_arrears_v125.py
          cmp /tmp/history-core-first.js assets/ux-history-core.js
          cmp /tmp/site-first.json data/site-data.json
          python scripts/test_erp_arrears_v125.py
          python scripts/finalize_catalog_release.py --check

      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ux-history-core.js scripts/materialize_erp_arrears_v125.py scripts/test_erp_arrears_v125.py scripts/test_erp_arrears_v125_browser.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corregge percentuali nello storico Morosità ERP"
          git push origin HEAD:feat/v125-morosita-erp
