name: tmp-salute-snapshot-once
on:
  push:
    branches: [codex/salute-12-indicatori]
permissions:
  contents: write
jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/materialize_salute_v140.py
      - name: Freeze official source snapshots
        run: python scripts/materialize_salute_v140.py --refresh-source --snapshot-only
      - name: Commit snapshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/source-snapshots/ars-salute-11-v140.json data/source-snapshots/regione-toscana-rsa-accreditate-2025-v140.json
          git commit -m 'data: freeze Salute v1.40 source snapshots'
          git pull --rebase origin codex/salute-12-indicatori
          git push origin HEAD:codex/salute-12-indicatori