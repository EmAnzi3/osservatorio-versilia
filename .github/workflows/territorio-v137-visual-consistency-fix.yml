name: Territorio v1.37 visual consistency fix

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-visual-consistency-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove redundant town-position hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_territorio_v137_runtime.py')
          s=p.read_text(encoding='utf-8')
          line='    visual = patch_function(visual, "enhanceTownPosition", lambda b: insert_after_line(b, "const metric = data.metrics?.[metricKey];", "    if ([\'soilStockProfile\',\'soilChangeProfile\',\'protectedAreasProfile\',\'hydroNetworkProfile\',\'roadNetworkProfile\'].includes(metric?.meta?.compositeType)) return;\\n", "town position territorio"))\n'
          if s.count(line)!=1:
              raise RuntimeError(f'hook enhanceTownPosition atteso una volta, trovato {s.count(line)}')
          p.write_text(s.replace(line,'',1),encoding='utf-8')
          PY
      - name: Compile runtime patch
        run: python -m py_compile scripts/patch_territorio_v137_runtime.py
      - name: Commit runtime correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/patch_territorio_v137_runtime.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(territorio): drop redundant town-position visual hook"
          git push origin HEAD:draft/territorio-indicatori-v137
