name: Fix Cultura town tooltips once

on:
  push:
    branches: ["feat/cultura-biblioteche"]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/cultura-biblioteche
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Patch only Cultura town tooltip wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/ux-history.js')
          text = path.read_text(encoding='utf-8')

          if 'function wireLibraryTownTooltips(shell)' not in text:
              old = '''  function wireShell(shell, storageKey, selectedTown, allowClear) {
            if (!shell || wiredShells.has(shell)) return;
            wiredShells.add(shell);
            const historyButton = shell.querySelector('[data-view-mode="history"]');
            const historyAvailable = Boolean(historyButton && !historyButton.disabled);
            toolkit.wireViewShell(shell, storageKey, historyAvailable);
            toolkit.wireHistorySelection(shell, selectedTown, allowClear);
          }
          '''
              new = old + '''
          function wireLibraryTownTooltips(shell) {
            if (!shell || shell.dataset.libraryTownTooltipsWired === '1') return;
            shell.dataset.libraryTownTooltipsWired = '1';
            shell.querySelectorAll('[data-view-pane="history"] .trend-chart').forEach(chart => {
              const points = [...chart.querySelectorAll('.chart-point')];
              if (!points.length) return;
              const hideAll = () => points.forEach(point => {
                point.classList.remove('active');
                point.querySelector('.chart-tooltip')?.setAttribute('hidden', '');
              });
              const show = point => {
                hideAll();
                point.classList.add('active');
                point.querySelector('.chart-tooltip')?.removeAttribute('hidden');
              };
              points.forEach((point, index) => {
                point.addEventListener('mouseenter', () => show(point));
                point.addEventListener('mouseleave', hideAll);
                point.addEventListener('focus', () => show(point));
                point.addEventListener('blur', hideAll);
                point.addEventListener('click', () => show(point));
                point.addEventListener('keydown', event => {
                  if (event.key === 'Escape') {
                    hideAll();
                    point.blur();
                    return;
                  }
                  if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
                  event.preventDefault();
                  let next = index;
                  if (event.key === 'ArrowLeft') next = (index - 1 + points.length) % points.length;
                  if (event.key === 'ArrowRight') next = (index + 1) % points.length;
                  if (event.key === 'Home') next = 0;
                  if (event.key === 'End') next = points.length - 1;
                  points[next]?.focus();
                });
              });
              chart.addEventListener('mouseleave', hideAll);
            });
          }
          '''
              if old not in text:
                  raise SystemExit('wireShell block not found')
              text = text.replace(old, new, 1)

          old_existing = '''    if (LIBRARY_HISTORY_KEYS.has(selected.key)) {
              if (existingShell) {
                wireShell(existingShell, 'ov-town-view', selectedTown, false);
                return;
              }
          '''
          new_existing = '''    if (LIBRARY_HISTORY_KEYS.has(selected.key)) {
              if (existingShell) {
                wireShell(existingShell, 'ov-town-view', selectedTown, false);
                wireLibraryTownTooltips(existingShell);
                return;
              }
          '''
          if old_existing in text:
              text = text.replace(old_existing, new_existing, 1)
          elif new_existing not in text:
              raise SystemExit('existing library town shell block not found')

          old_new = '''      wireShell(panel.querySelector('.ux-view-shell'), 'ov-town-view', selectedTown, false);
              return;
          '''
          new_new = '''      const shell = panel.querySelector('.ux-view-shell');
              wireShell(shell, 'ov-town-view', selectedTown, false);
              wireLibraryTownTooltips(shell);
              return;
          '''
          if old_new in text:
              text = text.replace(old_new, new_new, 1)
          elif new_new not in text:
              raise SystemExit('new library town shell block not found')

          path.write_text(text, encoding='utf-8')
          PY
          node --check assets/ux-history.js
          git diff --check -- assets/ux-history.js

      - name: Build real preview
        run: |
          python scripts/materialize_cultura_biblioteche_v121.py
          python scripts/build_static_brand.py
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py
          python scripts/preview_dist.py --port 8123 --directory dist >/tmp/ov-tooltip-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8123/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ov-tooltip-http.log
          exit 1

      - name: Verify town tooltips in Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          metrics = (
              'libraryLoansPerResident',
              'libraryActiveBorrowersPer100',
              'libraryWeeklyOpeningHours',
          )
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              for key in metrics:
                  page.goto(
                      f'http://127.0.0.1:8123/comuni/camaiore/?tema=comunita&indicatore={key}',
                      wait_until='networkidle',
                  )
                  page.wait_for_timeout(500)
                  shell = page.locator('.history-panel .ux-view-shell')
                  assert shell.count() == 1, f'{key}: switch assente'
                  history = shell.locator('button[data-view-mode="history"]')
                  assert history.count() == 1 and not history.is_disabled(), f'{key}: Storico non disponibile'
                  history.click()
                  page.wait_for_timeout(120)
                  chart = shell.locator('[data-view-pane="history"] .trend-chart')
                  assert chart.count() == 1, f'{key}: grafico comunale assente'
                  points = chart.locator('.chart-point')
                  assert points.count() >= 2, f'{key}: punti storici insufficienti'
                  point = points.nth(min(2, points.count() - 1))
                  tooltip = point.locator('.chart-tooltip')
                  assert tooltip.count() == 1 and tooltip.get_attribute('hidden') is not None, f'{key}: stato iniziale tooltip inatteso'
                  point.hover(force=True)
                  page.wait_for_timeout(80)
                  assert tooltip.get_attribute('hidden') is None, f'{key}: tooltip non attivato al passaggio del mouse'
                  assert tooltip.is_visible(), f'{key}: tooltip attivato ma non visibile'
              browser.close()
          print('Tooltip comunali Cultura verificati sui tre indicatori.')
          PY

      - name: Commit only the tooltip fix
        run: |
          if git diff --quiet -- assets/ux-history.js; then
            echo "Tooltip fix already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ux-history.js
          git commit -m "Fix Cultura town history tooltips"
          git push origin HEAD:feat/cultura-biblioteche
