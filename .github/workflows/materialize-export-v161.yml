name: Materialize export fixes v1.6.1

on:
  push:
    branches: ["fix/export-pdf-csv-v161"]
    paths:
      - ".github/workflows/materialize-export-v161.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-export-v161
  cancel-in-progress: true

jobs:
  build-test-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/export-pdf-csv-v161
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and PDF tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Materialize export corrections
        run: python scripts/apply_export_v161.py

      - name: Build pre-rendered preview
        run: python scripts/build_static_safe.py

      - name: Run full regression suite
        run: |
          python scripts/test_static.py
          python scripts/test_release_v150.py
          python scripts/test_release_v160.py
          python scripts/test_source_links_v160.py
          python scripts/test_siope_history_v160.py
          python scripts/test_ux_experiment.py
          python scripts/test_exports_v161.py

      - name: Upload review preview
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-export-v161-preview
          path: dist
          retention-days: 7

      - name: Commit validated corrections
        run: |
          git rm .github/workflows/materialize-export-v161.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-parts/02.txt assets/app-bundle.js assets/ux-history.js assets/ux-experiment.css
          git add .github/workflows/pages.yml scripts/apply_export_v161.py scripts/test_exports_v161.py
          git commit -m "Corregge gli export CSV e PDF"
          git push origin HEAD:fix/export-pdf-csv-v161
