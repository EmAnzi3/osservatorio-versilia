name: ARS life expectancy · temporary probe

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ars-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Probe ARS life expectancy
        run: python scripts/probe_ars_life_expectancy.py
