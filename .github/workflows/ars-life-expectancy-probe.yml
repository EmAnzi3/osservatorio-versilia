name: ARS life expectancy · temporary materializer

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/life-expectancy-history-sex-v122
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize verified ARS snapshot
        run: |
          if [ -f data/source-snapshots/ars-life-expectancy-1290-2008-2022.json ]; then
            python scripts/materialize_salute_life_expectancy_v122.py
          else
            python scripts/materialize_salute_life_expectancy_v122.py --refresh-source
          fi

      - name: Patch canonical frontend
        run: python scripts/patch_salute_life_expectancy_v122_frontend.py

      - name: Syntax checks
        run: |
          python -m py_compile scripts/materialize_salute_life_expectancy_v122.py scripts/patch_salute_life_expectancy_v122_frontend.py
          cat assets/app-parts/*.txt > /tmp/ov-app.js
          node --check /tmp/ov-app.js
          node --check assets/ux-history-core.js
          node --check assets/ux-history.js

      - name: Commit materialized implementation
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json data/source-registry.json data/source-snapshots/ars-life-expectancy-1290-2008-2022.json docs/copertura-serie-storiche.md assets/app-parts/03.txt assets/ux-history.js assets/ux-history-core.js assets/app.js service-worker.js
          git commit -m "feat: materialize ARS life expectancy history"
          git push origin HEAD:feature/life-expectancy-history-sex-v122
