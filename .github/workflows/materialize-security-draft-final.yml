name: Completa draft sicurezza

on:
  push:
    branches: ["agent/sicurezza-territorio-draft"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sicurezza-territorio-draft
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply_security_draft.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-parts/05.txt
          if git diff --cached --quiet; then
            echo "Nessuna modifica residua"
          else
            git commit -m "Completa contesto Polizia Locale nel draft"
            git push origin HEAD:agent/sicurezza-territorio-draft
          fi
