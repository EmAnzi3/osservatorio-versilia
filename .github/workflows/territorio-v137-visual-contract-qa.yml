name: Territorio v1.37 visual contract QA

on:
  push:
    branches: [draft/territorio-indicatori-v137]
    paths:
      - scripts/patch_territorio_v137_runtime.py
      - .github/workflows/territorio-v137-visual-contract-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Build canonical dist and verify numerical contract
        run: |
          python scripts/build_static_brand.py
          python scripts/verify_territorio_v137_dist.py
      - name: Assert lollipop and charted history contracts
        run: |
          mkdir -p reports/territorio-v137-contract
          python -m http.server 8765 --directory dist >/tmp/v137-contract-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json

          base='http://127.0.0.1:8765'
          out=Path('reports/territorio-v137-contract')
          slugs=['suolo-consumato','consumo-di-suolo-annuale','territorio-in-aree-naturali-protette','reticolo-idrografico','grafo-viario-iter-net']
          historical={'suolo-consumato','consumo-di-suolo-annuale'}
          results=[]

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for mode,viewport in [('desktop',{'width':1440,'height':1100}),('mobile',{'width':390,'height':844})]:
                  context=browser.new_context(viewport=viewport)
                  for slug in slugs:
                      page=context.new_page(); errors=[]
                      page.on('console',lambda m,e=errors:e.append(f'console:{m.type}:{m.text}') if m.type=='error' else None)
                      page.on('pageerror',lambda exc,e=errors:e.append(f'pageerror:{exc}'))
                      response=page.goto(f'{base}/indicatori/{slug}/',wait_until='networkidle')
                      if not response or response.status!=200: raise RuntimeError(f'{slug}/{mode}: HTTP {response.status if response else None}')

                      def assert_lollipop(label):
                          comp=page.locator('.indicator-current .comparison-bars').first
                          comp.wait_for(state='visible')
                          page.wait_for_function("el => ['lollipop','percent-dotplot','signed-dotplot'].includes(el.dataset.viz)",arg=comp.element_handle())
                          viz=comp.get_attribute('data-viz')
                          if comp.locator('.comparison-dot').count()<1 or comp.locator('.comparison-stem').count()<1:
                              raise RuntimeError(f'{slug}/{mode}/{label}: elementi lollipop mancanti')
                          return viz

                      viz=assert_lollipop('default')
                      component=page.locator('.indicator-current select[data-composite-component]').first
                      if component.count():
                          values=component.locator('option').evaluate_all('(els)=>els.map(e=>e.value)')
                          if len(values)>1:
                              component.select_option(values[-1]); page.wait_for_timeout(350); assert_lollipop('view-change')

                      if slug=='territorio-in-aree-naturali-protette':
                          ha=page.locator('.indicator-current button[data-composite-scale="hectares"]').first
                          if not ha.count(): raise RuntimeError(f'{slug}/{mode}: toggle ha assente')
                          ha.click(); page.wait_for_timeout(350); assert_lollipop('hectares')

                      if slug in historical:
                          history=page.locator('[data-financial-indicator-history]').first
                          if not history.count(): raise RuntimeError(f'{slug}/{mode}: storico assente')
                          if history.locator('.territory-history-table').count(): raise RuntimeError(f'{slug}/{mode}: tabella storica residua')
                          history.locator('.trend-chart').first.wait_for(state='visible')
                          select=history.locator('select[data-territory-history-town]').first
                          if not select.count(): raise RuntimeError(f'{slug}/{mode}: selettore storico assente')
                          opts=select.locator('option').all_text_contents()
                          if len(opts)!=8 or opts[0].strip()!='Versilia': raise RuntimeError(f'{slug}/{mode}: opzioni storico errate: {opts}')
                          vals=select.locator('option').evaluate_all('(els)=>els.map(e=>e.value)')
                          select.select_option(vals[1]); page.wait_for_timeout(300)
                          history.locator('.trend-chart').first.wait_for(state='visible')

                      body=page.locator('body').inner_text()
                      if 'NaN' in body or 'undefined' in body.lower(): raise RuntimeError(f'{slug}/{mode}: NaN/undefined visibile')
                      if errors: raise RuntimeError(f'{slug}/{mode}: errori browser: {errors}')
                      shot=out/f'{slug}-{mode}.png'; page.screenshot(path=str(shot),full_page=True)
                      results.append({'slug':slug,'mode':mode,'viz':viz,'historyChart':slug in historical,'screenshot':shot.name})
                      page.close()
                  context.close()
              browser.close()
          (out/'visual-contract.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Upload visual contract artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: territorio-v137-visual-contract
          path: reports/territorio-v137-contract/
          if-no-files-found: error
          retention-days: 7
