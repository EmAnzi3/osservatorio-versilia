name: Territorio v1.37 visual contract QA

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - scripts/patch_territorio_v137_runtime.py
      - .github/workflows/territorio-v137-visual-contract-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Build canonical dist and verify numerical contract
        run: |
          python scripts/build_static_brand.py
          python scripts/verify_territorio_v137_dist.py
      - name: Assert lollipop and charted history contracts
        run: |
          mkdir -p reports/territorio-v137-contract
          python -m http.server 8765 --directory dist >/tmp/v137-contract-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json

          base='http://127.0.0.1:8765'
          out=Path('reports/territorio-v137-contract')
          slugs=[
              'suolo-consumato',
              'consumo-di-suolo-annuale',
              'territorio-in-aree-naturali-protette',
              'reticolo-idrografico',
              'grafo-viario-iter-net',
          ]
          historical={'suolo-consumato','consumo-di-suolo-annuale'}
          results=[]

          def assert_clean(page, slug, mode, errors):
              body=page.locator('body').inner_text()
              if 'NaN' in body or 'undefined' in body.lower():
                  raise RuntimeError(f'{slug}/{mode}: NaN/undefined visibile')
              if errors:
                  raise RuntimeError(f'{slug}/{mode}: errori browser: {errors}')

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for mode,viewport in [('desktop',{'width':1440,'height':1100}),('mobile',{'width':390,'height':844})]:
                  context=browser.new_context(viewport=viewport)
                  for slug in slugs:
                      page=context.new_page()
                      errors=[]
                      page.on('console', lambda msg, errors=errors: errors.append(f'console:{msg.type}:{msg.text}') if msg.type=='error' else None)
                      page.on('pageerror', lambda exc, errors=errors: errors.append(f'pageerror:{exc}'))
                      response=page.goto(f'{base}/indicatori/{slug}/',wait_until='networkidle')
                      if not response or response.status != 200:
                          raise RuntimeError(f'{slug}/{mode}: HTTP {response.status if response else None}')

                      comparison=page.locator('.indicator-current .comparison-bars').first
                      comparison.wait_for(state='visible')
                      page.wait_for_function("el => ['lollipop','percent-dotplot','signed-dotplot'].includes(el.dataset.viz)", arg=comparison.element_handle())
                      viz=comparison.get_attribute('data-viz')
                      if viz not in {'lollipop','percent-dotplot','signed-dotplot'}:
                          raise RuntimeError(f'{slug}/{mode}: confronto non lollipop/dotplot: {viz}')
                      if comparison.locator('.comparison-dot').count() < 1 or comparison.locator('.comparison-stem').count() < 1:
                          raise RuntimeError(f'{slug}/{mode}: elementi lollipop mancanti')

                      component=page.locator('.indicator-current select[data-composite-component]').first
                      if component.count():
                          values=component.locator('option').evaluate_all('(els)=>els.map(e=>e.value)')
                          if len(values)>1:
                              component.select_option(values[-1])
                              page.wait_for_timeout(350)
                              comparison=page.locator('.indicator-current .comparison-bars').first
                              page.wait_for_function("el => ['lollipop','percent-dotplot','signed-dotplot'].includes(el.dataset.viz)", arg=comparison.element_handle())
                              if comparison.locator('.comparison-dot').count() < 1:
                                  raise RuntimeError(f'{slug}/{mode}: lollipop perso dopo cambio lettura')

                      if slug=='territorio-in-aree-naturali-protette':
                          ha=page.locator('.indicator-current button[data-composite-scale="hectares"]').first
                          if not ha.count():
                              raise RuntimeError(f'{slug}/{mode}: toggle ha assente')
                          ha.click()
                          page.wait_for_timeout(350)
                          comparison=page.locator('.indicator-current .comparison-bars').first
                          page.wait_for_function("el => ['lollipop','percent-dotplot','signed-dotplot'].includes(el.dataset.viz)", arg=comparison.element_handle())
                          if comparison.locator('.comparison-dot').count() < 1:
                              raise RuntimeError(f'{slug}/{mode}: lollipop perso in ettari')

                      if slug in historical:
                          history=page.locator('[data-financial-indicator-history]').first
                          if not history.count():
                              raise RuntimeError(f'{slug}/{mode}: contenitore storico assente')
                          if history.locator('.territory-history-table').count():
                              raise RuntimeError(f'{slug}/{mode}: tabella storica residua')
                          chart=history.locator('.trend-chart').first
                          chart.wait_for(state='visible')
                          town_select=history.locator('select[data-territory-history-town]').first
                          if not town_select.count():
                              raise RuntimeError(f'{slug}/{mode}: selettore Versilia/Comune assente')
                          options=town_select.locator('option').all_text_contents()
                          if len(options)!=8 or options[0].strip()!='Versilia':
                              raise RuntimeError(f'{slug}/{mode}: storico atteso Versilia + 7 comuni, trovato {options}')
                          values=town_select.locator('option').evaluate_all('(els)=>els.map(e=>e.value)')
                          town_select.select_option(values[1])
                          page.wait_for_timeout(300)
                          if not history.locator('.trend-chart').count():
                              raise RuntimeError(f'{slug}/{mode}: grafico storico perso dopo cambio comune')

                      assert_clean(page,slug,mode,errors)
                      screenshot=out/f'{slug}-{mode}.png'
                      page.screenshot(path=str(screenshot),full_page=True)
                      results.append({'slug':slug,'mode':mode,'viz':viz,'historyChart':slug in historical,'screenshot':screenshot.name})
                      page.close()
                  context.close()
              browser.close()

          (out/'visual-contract.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Upload visual contract artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: territorio-v137-visual-contract
          path: reports/territorio-v137-contract/
          if-no-files-found: error
          retention-days: 7
