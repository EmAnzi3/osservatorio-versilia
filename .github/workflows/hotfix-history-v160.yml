name: Hotfix vista storica v1.6.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hotfix-history-v160.yml"

permissions:
  contents: write

concurrency:
  group: hotfix-history-v160
  cancel-in-progress: true

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden history controls and storage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/ux-history-core.js')
          text = path.read_text(encoding='utf-8')
          anchor = "  let shellCounter = 0;\n"
          helpers = """  let shellCounter = 0;

  function storageGet(key) {
    try {
      return sessionStorage.getItem(key);
    } catch {
      return null;
    }
  }

  function storageSet(key, value) {
    try {
      sessionStorage.setItem(key, value);
    } catch {
      // The controls remain functional when browser storage is unavailable.
    }
  }
"""
          if 'function storageGet(key)' not in text:
              if anchor not in text:
                  raise SystemExit('Punto di inserimento storage non trovato')
              text = text.replace(anchor, helpers, 1)
          text = text.replace("if (selected) sessionStorage.setItem('ov-history-town', selected);", "if (selected) storageSet('ov-history-town', selected);")
          text = text.replace('const stored = sessionStorage.getItem(storageKey);', 'const stored = storageGet(storageKey);')
          text = text.replace('sessionStorage.setItem(storageKey, mode);', 'storageSet(storageKey, mode);')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Bust cached UX assets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_static_safe.py')
          text = path.read_text(encoding='utf-8')
          if 'UX_ASSET_VERSION = "20260806-2"' not in text:
              anchor = '_original_prepare_shells = build.prepare_shells\n'
              if anchor not in text:
                  raise SystemExit('Punto di inserimento versione asset non trovato')
              text = text.replace(anchor, anchor + '\nUX_ASSET_VERSION = "20260806-2"\n', 1)
          replacements = {
              'assets/ux-experiment.css">': 'assets/ux-experiment.css?v={UX_ASSET_VERSION}">',
              'assets/ux-background-match.css">': 'assets/ux-background-match.css?v={UX_ASSET_VERSION}">',
              'assets/ux-accordion.js" defer': 'assets/ux-accordion.js?v={UX_ASSET_VERSION}" defer',
              'assets/ux-history-core.js" defer': 'assets/ux-history-core.js?v={UX_ASSET_VERSION}" defer',
              'assets/ux-history.js" defer': 'assets/ux-history.js?v={UX_ASSET_VERSION}" defer',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add public-route regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_ux_experiment.py')
          text = path.read_text(encoding='utf-8')
          marker = '        page = browser.new_page(viewport={"width": 1440, "height": 950})\n'
          block = '''        page = browser.new_page(viewport={"width": 1440, "height": 950})

        page.goto(base + "confronta/bilanci/", wait_until="networkidle")
        page.wait_for_selector(".ux-view-shell")
        require(not page.locator('[data-view-mode="history"]').is_disabled(),
                "Percorso pubblico Bilanci: vista storica disabilitata sul primo indicatore")
        page.locator('[data-view-mode="history"]').click()
        require(page.locator('.ux-view-pane[data-view-pane="history"]').is_visible(),
                "Percorso pubblico Bilanci: vista storica non attivabile senza parametro indicatore")

        page.goto(base + "comuni/massarosa/", wait_until="networkidle")
        page.wait_for_selector(".history-panel .ux-view-shell")
        page.locator('.history-panel [data-view-mode="history"]').click()
        require(page.locator('.history-panel .ux-view-pane[data-view-pane="history"]').is_visible(),
                "Percorso pubblico comunale: vista storica non attivabile senza parametri")
'''
          if 'Percorso pubblico Bilanci' not in text:
              if marker not in text:
                  raise SystemExit('Punto di inserimento test browser non trovato')
              text = text.replace(marker, block, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build and run release checks
        run: |
          python scripts/build_static_safe.py
          python scripts/test_static.py
          python scripts/test_release_v150.py
          python scripts/test_release_v160.py
          python scripts/test_source_links_v160.py
          python scripts/test_siope_history_v160.py
          python scripts/test_ux_experiment.py

      - name: Commit validated hotfix
        run: |
          git rm .github/workflows/hotfix-history-v160.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ux-history-core.js scripts/build_static_safe.py scripts/test_ux_experiment.py
          git commit -m "Collauda e rende affidabile la vista storica pubblica"
          git push origin HEAD:main
