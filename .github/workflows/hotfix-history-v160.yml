name: Hotfix vista storica v1.6.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hotfix-history-v160.yml"

permissions:
  contents: write

concurrency:
  group: hotfix-history-v160
  cancel-in-progress: true

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden history controls and browser storage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/ux-history-core.js')
          text = path.read_text(encoding='utf-8')
          if 'function storageGet(key)' not in text:
              marker = '  function escapeHtml(value) {\n'
              helper = (
                  '  function storageGet(key) {\n'
                  '    try {\n'
                  '      return sessionStorage.getItem(key);\n'
                  '    } catch {\n'
                  '      return null;\n'
                  '    }\n'
                  '  }\n\n'
                  '  function storageSet(key, value) {\n'
                  '    try {\n'
                  '      sessionStorage.setItem(key, value);\n'
                  '    } catch {\n'
                  '      // Controls remain functional when storage is unavailable.\n'
                  '    }\n'
                  '  }\n\n'
              )
              if marker not in text:
                  raise SystemExit('Punto di inserimento storage non trovato')
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              "if (selected) sessionStorage.setItem('ov-history-town', selected);",
              "if (selected) storageSet('ov-history-town', selected);",
          )
          text = text.replace(
              'const stored = sessionStorage.getItem(storageKey);',
              'const stored = storageGet(storageKey);',
          )
          text = text.replace(
              'sessionStorage.setItem(storageKey, mode);',
              'storageSet(storageKey, mode);',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Bust cached UX assets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_static_safe.py')
          text = path.read_text(encoding='utf-8')
          version_line = 'UX_ASSET_VERSION = "20260806-2"'
          if version_line not in text:
              marker = '_original_prepare_shells = build.prepare_shells\n'
              if marker not in text:
                  raise SystemExit('Punto di inserimento versione asset non trovato')
              text = text.replace(marker, marker + '\n' + version_line + '\n', 1)
          replacements = {
              'assets/ux-experiment.css">': 'assets/ux-experiment.css?v={UX_ASSET_VERSION}">',
              'assets/ux-background-match.css">': 'assets/ux-background-match.css?v={UX_ASSET_VERSION}">',
              'assets/ux-accordion.js" defer': 'assets/ux-accordion.js?v={UX_ASSET_VERSION}" defer',
              'assets/ux-history-core.js" defer': 'assets/ux-history-core.js?v={UX_ASSET_VERSION}" defer',
              'assets/ux-history.js" defer': 'assets/ux-history.js?v={UX_ASSET_VERSION}" defer',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add permanent public-route regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_ux_experiment.py')
          text = path.read_text(encoding='utf-8')
          marker = '        page = browser.new_page(viewport={"width": 1440, "height": 950})\n'
          block = (
              '\n'
              '        page.goto(base + "confronta/bilanci/", wait_until="networkidle")\n'
              '        page.wait_for_selector(".ux-view-shell")\n'
              '        require(not page.locator(\'[data-view-mode="history"]\').is_disabled(),\n'
              '                "Percorso pubblico Bilanci: vista storica disabilitata sul primo indicatore")\n'
              '        page.locator(\'[data-view-mode="history"]\').click()\n'
              '        require(page.locator(\'.ux-view-pane[data-view-pane="history"]\').is_visible(),\n'
              '                "Percorso pubblico Bilanci: vista storica non attivabile senza parametro indicatore")\n'
              '\n'
              '        page.goto(base + "comuni/massarosa/", wait_until="networkidle")\n'
              '        page.wait_for_selector(".history-panel .ux-view-shell")\n'
              '        page.locator(\'.history-panel [data-view-mode="history"]\').click()\n'
              '        require(page.locator(\'.history-panel .ux-view-pane[data-view-pane="history"]\').is_visible(),\n'
              '                "Percorso pubblico comunale: vista storica non attivabile senza parametri")\n'
              '        page.evaluate("sessionStorage.clear()")\n'
          )
          if 'Percorso pubblico Bilanci' not in text:
              if marker not in text:
                  raise SystemExit('Punto di inserimento test browser non trovato')
              text = text.replace(marker, marker + block, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build and run all release checks
        run: |
          python scripts/build_static_safe.py
          python scripts/test_static.py
          python scripts/test_release_v150.py
          python scripts/test_release_v160.py
          python scripts/test_source_links_v160.py
          python scripts/test_siope_history_v160.py
          python scripts/test_ux_experiment.py

      - name: Commit validated hotfix
        run: |
          git rm .github/workflows/hotfix-history-v160.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ux-history-core.js scripts/build_static_safe.py scripts/test_ux_experiment.py
          git commit -m "Collauda e rende affidabile la vista storica pubblica"
          git push origin HEAD:main
