name: Fix v1.25 ERP review

on:
  push:
    branches: ["feat/v125-morosita-erp"]

permissions:
  contents: write

concurrency:
  group: fix-v125-erp-review
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
        with:
          ref: feat/v125-morosita-erp
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply review corrections
        run: |
          set -euo pipefail
          python scripts/patch_erp_review_v125.py
          python -m py_compile \
            scripts/patch_erp_review_v125.py \
            scripts/materialize_erp_arrears_v125.py \
            scripts/test_erp_arrears_v125.py \
            scripts/test_erp_arrears_v125_browser.py
          python scripts/materialize_erp_arrears_v125.py
          cp data/site-data.json /tmp/site-data-first.json
          cp assets/app-parts/00.txt /tmp/app00-first.txt
          cp assets/app-parts/03.txt /tmp/app03-first.txt
          python scripts/materialize_erp_arrears_v125.py
          cmp /tmp/site-data-first.json data/site-data.json
          cmp /tmp/app00-first.txt assets/app-parts/00.txt
          cmp /tmp/app03-first.txt assets/app-parts/03.txt
          python scripts/test_erp_arrears_v125.py
          python scripts/finalize_catalog_release.py --check

      - name: Commit review corrections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/materialize_erp_arrears_v125.py \
            scripts/test_erp_arrears_v125.py \
            scripts/test_erp_arrears_v125_browser.py \
            data/site-data.json \
            data/source-snapshots/erp-lucca-arrears-2020-2024.json \
            assets/app-parts/00.txt \
            assets/app-parts/03.txt \
            assets/fidelity.css
          if git diff --cached --quiet; then
            echo "Nessuna correzione da committare"
            exit 0
          fi
          git commit -m "Corregge benchmark, unità e leggibilità Morosità ERP"
          git push origin HEAD:feat/v125-morosita-erp
