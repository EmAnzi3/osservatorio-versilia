name: Materialize Bilanci v1.6.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Rebuild OpenBDAP snapshot
        run: python scripts/build_bilanci_snapshot.py

      - name: Materialize private preview sources
        run: python scripts/update_bilanci_v160.py

      - name: Validate budget data
        run: python scripts/test_release_v160.py

# Manual maintenance workflow only. It does not deploy GitHub Pages.
