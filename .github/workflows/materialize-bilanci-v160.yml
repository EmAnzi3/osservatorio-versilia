name: Materialize Bilanci v1.6.0

on:
  push:
    branches: ["expansion/bilanci-comunali-v160"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-bilanci-v160
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Build reproducible OpenBDAP snapshot
        run: |
          python scripts/build_bilanci_snapshot.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/source-snapshots/bilanci-v1.6.0.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['generated_at'] = '2026-08-05T17:42:06+00:00'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Materialize private preview sources
        run: python scripts/update_bilanci_v160.py

      - name: Validate budget data
        run: python scripts/test_release_v160.py

      - name: Commit readable sources
        run: |
          if git diff --quiet -- data/site-data.json data/source-snapshots/bilanci-v1.6.0.json assets/app-parts/00.txt assets/app-parts/01.txt assets/app-parts/05.txt README.md; then
            echo "Sorgenti Bilanci già materializzati."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json data/source-snapshots/bilanci-v1.6.0.json assets/app-parts/00.txt assets/app-parts/01.txt assets/app-parts/05.txt README.md
          git commit -m "Materializza il tema Bilanci comunali v1.6.0"
          git push origin HEAD:expansion/bilanci-comunali-v160
