name: Materialize Bilanci v1.6.0

on:
  workflow_dispatch:
  push:
    branches: ["expansion/bilanci-comunali-v160"]
    paths:
      - "scripts/apply_v160_review.py"
      - "scripts/discover_siope_resources.py"
      - "scripts/expand_bilanci_history_v160.py"
      - "scripts/build_siope_history.py"
      - "scripts/apply_history_series_v160.py"

permissions:
  contents: write

concurrency:
  group: materialize-bilanci-v160
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Apply approved UX changes
        if: ${{ hashFiles('scripts/apply_v160_review.py') != '' }}
        run: python scripts/apply_v160_review.py

      - name: Inspect official SIOPE resources
        if: ${{ hashFiles('scripts/discover_siope_resources.py') != '' }}
        continue-on-error: true
        run: python scripts/discover_siope_resources.py

      - name: Rebuild validated OpenBDAP base snapshot
        if: ${{ hashFiles('scripts/expand_bilanci_history_v160.py') != '' }}
        run: python scripts/build_bilanci_snapshot.py

      - name: Expand OpenBDAP history
        if: ${{ hashFiles('scripts/expand_bilanci_history_v160.py') != '' }}
        run: python scripts/expand_bilanci_history_v160.py

      - name: Materialize Bilanci theme
        if: ${{ hashFiles('scripts/expand_bilanci_history_v160.py') != '' }}
        run: python scripts/update_bilanci_v160.py

      - name: Build SIOPE history
        if: ${{ hashFiles('scripts/build_siope_history.py') != '' }}
        run: python scripts/build_siope_history.py

      - name: Apply expanded histories
        if: ${{ hashFiles('scripts/apply_history_series_v160.py') != '' }}
        run: python scripts/apply_history_series_v160.py

      - name: Build private static preview
        run: python scripts/build_static_safe.py

      - name: Run regression tests
        run: |
          python scripts/test_static.py
          python scripts/test_release_v150.py
          python scripts/test_release_v160.py
          python scripts/test_ux_experiment.py

      - name: Commit generated branch changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data docs scripts README.md
          git commit -m "Materializza correzioni UX e serie storiche v1.6.0"
          git push origin HEAD:expansion/bilanci-comunali-v160

      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-v160-review-preview
          path: dist
          retention-days: 7

# Branch-only maintenance workflow. It never deploys GitHub Pages and never merges the PR.
