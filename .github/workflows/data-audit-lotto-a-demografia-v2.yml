name: Data audit Lotto A - Demografia v2

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/probe_istat_rcs_demography.py"
      - ".github/workflows/data-audit-lotto-a-demografia-v2.yml"
      - "scripts/materialize_demography_lotto_a_v5.py"
      - "scripts/materialize_demography_rcs_lotto_a.py"
      - "scripts/patch_demography_lotto_a_frontend_v2.py"
      - "scripts/test_demography_lotto_a_v5.py"
      - "scripts/test_demography_rcs_lotto_a.py"
      - "scripts/test_demography_lotto_a_browser_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demography-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Istat RCS 2025
        run: python scripts/probe_istat_rcs_demography.py
      - name: Validate probe JSON
        run: python -m json.tool audit-artifacts/istat-rcs-demography-2025.json > /dev/null
      - name: Materialize prerequisite Demography tranche
        run: |
          python scripts/materialize_demography_lotto_a_v4.py
          python scripts/test_demography_lotto_a_materialized.py
      - name: Materialize Demography v2 details
        run: |
          python scripts/materialize_demography_lotto_a_v5.py
          python scripts/test_demography_lotto_a_v5.py
      - name: Materialize Istat RCS detail
        run: |
          python scripts/materialize_demography_rcs_lotto_a.py
          python scripts/test_demography_rcs_lotto_a.py
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool data/data-audit-lotto-a.json > /dev/null
          python -m json.tool data/source-snapshots/istat-demography-lotto-a-2026-08.json > /dev/null
          python -m json.tool data/source-snapshots/istat-rcs-demography-2025.json > /dev/null
      - name: Validate frontend patch syntax
        run: python -m py_compile scripts/patch_demography_lotto_a_frontend_v2.py
      - name: Upload Demography v2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lotto-a-demography-v2-artifacts
          path: |
            audit-artifacts/istat-rcs-demography-2025.json
            data/source-snapshots/istat-demography-lotto-a-2026-08.json
            data/source-snapshots/istat-rcs-demography-2025.json
            data/site-data.json
            data/data-audit-lotto-a.json
          retention-days: 14
