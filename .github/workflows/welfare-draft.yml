name: Welfare e prima infanzia · draft preview

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/probe_welfare_sources.py"
      - "scripts/materialize_welfare_prima_infanzia_draft.py"
      - "scripts/test_welfare_prima_infanzia_draft.py"
      - "data/source-snapshots/welfare-prima-infanzia-draft-2026-08.json"
      - ".github/workflows/welfare-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install openpyxl
          python -m playwright install --with-deps chromium

      - name: Probe official sources 7/7
        run: python scripts/probe_welfare_sources.py

      - name: Show source probe report
        if: always()
        run: |
          if [ -f artifacts/welfare-probe/probe.md ]; then
            cat artifacts/welfare-probe/probe.md
          fi

      - name: Materialize draft catalog
        run: python scripts/materialize_welfare_prima_infanzia_draft.py

      - name: Validate Welfare draft
        run: |
          python scripts/test_welfare_prima_infanzia_draft.py
          python -m json.tool data/site-data.json > /dev/null

      - name: Build draft site
        run: python scripts/build_static_brand.py

      - name: Smoke check generated pages
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "Comunità e welfare" dist
          grep -R -q "Spesa per interventi e servizi sociali per abitante" dist
          grep -R -q "Composizione della spesa sociale per area di utenza" dist
          grep -R -q "Tasso di ricettività potenziale dei servizi educativi 0–3 anni" dist
          echo "Draft Welfare presente nel prerender."

      - name: Upload source probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welfare-source-probe
          path: artifacts/welfare-probe/
          retention-days: 14

      - name: Upload navigable draft site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: welfare-draft-site
          path: dist/
          retention-days: 14
