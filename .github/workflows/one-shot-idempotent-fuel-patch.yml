name: One-shot idempotent fuel patch

on:
  push:
    branches: ["agent/scale-tooltip-grafici-v113"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/scale-tooltip-grafici-v113

      - name: Make fuel patcher tolerant of evolved scale engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_fuel_precision.py')
          text = p.read_text(encoding='utf-8')

          old = """    old = \"\"\"    const allPercent = unitKind(unit) === 'percent' && numeric.every(value => value >= 0 && value <= 100);\\n    if (allPercent) return { min: 0, max: 100, kind: 'percent' };\\n\\n    let min = Math.min(...numeric);\\n    let max = Math.max(...numeric);\"\"\"\n    new = \"\"\"    const kind = unitKind(unit);\\n    if (kind === 'eurliter') {\\n      const rawMin = Math.min(...numeric);\\n      const rawMax = Math.max(...numeric);\\n      const spread = rawMax - rawMin;\\n      const padding = Math.max(0.005, spread * 0.25);\\n      const min = Math.floor((rawMin - padding) * 1000) / 1000;\\n      const max = Math.ceil((rawMax + padding) * 1000) / 1000;\\n      return { min, max: max > min ? max : min + 0.010, kind: 'focused' };\\n    }\\n\\n    const allPercent = kind === 'percent' && numeric.every(value => value >= 0 && value <= 100);\\n    if (allPercent) return { min: 0, max: 100, kind: 'percent' };\\n\\n    let min = Math.min(...numeric);\\n    let max = Math.max(...numeric);\"\"\"\n    text = replace_once(text, old, new, 'scala prezzi focalizzata')\n    old = \"scale.kind === 'percent' ? 'scala 0–100%' : scale.kind === 'signed' ? 'lo zero è evidenziato' : 'scala con origine a zero'\"\n    new = \"scale.kind === 'percent' ? 'scala 0–100%' : scale.kind === 'signed' ? 'lo zero è evidenziato' : scale.kind === 'focused' ? 'scala adattata ai prezzi' : 'scala con origine a zero'\"\n    text = replace_once(text, old, new, 'etichetta scala prezzi')\n"""
          new = """    # La grammatica visuale può evolvere dopo la release v1.13. Se il ramo\n    # carburanti è già presente, non richiedere più la forma storica esatta\n    # della funzione scaleFor: il patcher deve restare idempotente.\n    if \"if (kind === 'eurliter') {\" not in text:\n        old = \"\"\"    const allPercent = unitKind(unit) === 'percent' && numeric.every(value => value >= 0 && value <= 100);\\n    if (allPercent) return { min: 0, max: 100, kind: 'percent' };\\n\\n    let min = Math.min(...numeric);\\n    let max = Math.max(...numeric);\"\"\"\n        new = \"\"\"    const kind = unitKind(unit);\\n    if (kind === 'eurliter') {\\n      const rawMin = Math.min(...numeric);\\n      const rawMax = Math.max(...numeric);\\n      const spread = rawMax - rawMin;\\n      const padding = Math.max(0.005, spread * 0.25);\\n      const min = Math.floor((rawMin - padding) * 1000) / 1000;\\n      const max = Math.ceil((rawMax + padding) * 1000) / 1000;\\n      return { min, max: max > min ? max : min + 0.010, kind: 'focused' };\\n    }\\n\\n    const allPercent = kind === 'percent' && numeric.every(value => value >= 0 && value <= 100);\\n    if (allPercent) return { min: 0, max: 100, kind: 'percent' };\\n\\n    let min = Math.min(...numeric);\\n    let max = Math.max(...numeric);\"\"\"\n        text = replace_once(text, old, new, 'scala prezzi focalizzata')\n\n    # Anche l'etichetta può essere stata rifattorizzata (per esempio in una\n    # variabile scaleLabel). Se contiene già il caso focused, è completa.\n    if \"scale.kind === 'focused'\" not in text:\n        old = \"scale.kind === 'percent' ? 'scala 0–100%' : scale.kind === 'signed' ? 'lo zero è evidenziato' : 'scala con origine a zero'\"\n        new = \"scale.kind === 'percent' ? 'scala 0–100%' : scale.kind === 'signed' ? 'lo zero è evidenziato' : scale.kind === 'focused' ? 'scala adattata ai prezzi' : 'scala con origine a zero'\"\n        text = replace_once(text, old, new, 'etichetta scala prezzi')\n"""
          if old not in text:
              raise SystemExit('Fuel patcher target block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-idempotent-fuel-patch.yml
          git add scripts/patch_fuel_precision.py
          git commit -m "Rende idempotente il patcher carburanti"
          git push origin HEAD:agent/scale-tooltip-grafici-v113
