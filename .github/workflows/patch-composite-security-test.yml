name: Allinea test compositi sicurezza

on:
  push:
    branches: ["agent/sicurezza-territorio-draft"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sicurezza-territorio-draft
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/patch_composite_test_security.py
      - run: |
          python -m py_compile scripts/test_composite_indicators.py
          git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_composite_indicators.py
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Estende i test ai compositi sicurezza"
            git push origin HEAD:agent/sicurezza-territorio-draft
          fi
