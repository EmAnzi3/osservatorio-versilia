name: Probe lotto Scuola MIM

on:
  push:
    branches: ["agent/scuola-mim-probe"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ispeziona risposta CSV MIM
        run: python scripts/inspect_mim_csv_response.py
      - name: Audit MIM edilizia scolastica 2024/25
        run: python scripts/probe_scuola_mim_fixed.py
      - name: Pubblica report probe
        uses: actions/upload-artifact@v4
        with:
          name: scuola-mim-probe
          path: |
            school_probe_report.json
            school_probe_report.md
          if-no-files-found: error
          retention-days: 7
