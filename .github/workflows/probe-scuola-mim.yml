name: Probe lotto Scuola MIM

on:
  push:
    branches: ["agent/scuola-mim-probe"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scopri endpoint SPARQL MIM
        run: python scripts/discover_mim_sparql.py
