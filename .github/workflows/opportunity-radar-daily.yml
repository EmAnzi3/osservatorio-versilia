name: Radar Opportunità · refresh giornaliero

on:
  schedule:
    - cron: "15 6 * * *"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/opportunity-radar-daily.yml"
      - "scripts/opportunity_*.py"
      - "scripts/test_opportunity_*.py"
      - "data/opportunity-*.json"
      - "requirements-ci.txt"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Esegue scan e gate senza persistere, pubblicare o notificare"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: opportunity-radar-daily
  # I run produttivi restano seriali e non cancellabili; sulle PR conta solo
  # l'ultimo commit, evitando code di scan live ormai obsoleti.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      content_changed: ${{ steps.run_report.outputs.content_changed }}
      reference_date: ${{ steps.run_report.outputs.reference_date }}
      fingerprint: ${{ steps.run_report.outputs.fingerprint }}
      added: ${{ steps.run_report.outputs.added }}
      modified: ${{ steps.run_report.outputs.modified }}
      archived: ${{ steps.run_report.outputs.archived }}
      removed: ${{ steps.run_report.outputs.removed }}
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Radar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Validate v0.4.4 contracts and blind-test hardening
        run: |
          python scripts/test_opportunity_regione_toscana_guard.py
          python scripts/test_opportunity_issue_notification.py
          python scripts/test_opportunity_daily_continuity.py
          python scripts/test_opportunity_primary_revalidation.py
          python scripts/test_opportunity_discovery_resilience.py
          python scripts/test_opportunity_source_health.py
          python scripts/test_opportunity_publishability_matrix.py
          python scripts/test_opportunity_expired_lifecycle.py
          python scripts/test_opportunity_content_sanitization.py
          python scripts/test_opportunity_run_report.py
          python scripts/test_opportunity_runtime_snapshot.py
          python scripts/test_opportunity_automation_workflow.py
          python scripts/test_opportunity_radar_v044.py
          python scripts/run_opportunity_radar_v044.py --backtest-only

      - name: Seed refresh from latest verified runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/opportunity-radar-daily"
          SNAPSHOT="data/opportunity-daily-public.json"
          cp "$SNAPSHOT" /tmp/opportunity-daily-main.json
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          if git show "refs/remotes/origin/$BRANCH:$SNAPSHOT" > /tmp/opportunity-daily-pending.json 2>/dev/null; then
            python scripts/opportunity_runtime_snapshot.py \
              --main /tmp/opportunity-daily-main.json \
              --candidate /tmp/opportunity-daily-pending.json \
              --output "$SNAPSHOT"
          else
            python scripts/opportunity_runtime_snapshot.py \
              --main /tmp/opportunity-daily-main.json \
              --output "$SNAPSHOT"
          fi
          cp "$SNAPSHOT" /tmp/opportunity-daily-previous.json

      - name: Materialize verified baseline
        run: python scripts/materialize_opportunity_release_snapshot.py

      - name: Seed source health from latest failed run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/opportunity-radar-daily.yml/runs?per_page=20" \
              --jq ".workflow_runs | map(select(.id != ${GITHUB_RUN_ID} and .head_branch == \"main\")) | first | .id // empty"
          )"
          if [ -z "$previous_run_id" ]; then
            echo "Nessun run precedente: salute fonti inizializzata dallo snapshot accettato."
            exit 0
          fi
          previous_conclusion="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}" --jq '.conclusion // empty'
          )"
          if [ "$previous_conclusion" != "failure" ]; then
            echo "Il run precedente ${previous_run_id} non è fallito: salute fonti inizializzata dallo snapshot accettato."
            exit 0
          fi
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}/artifacts?per_page=100" \
              --jq '.artifacts | map(select(.name == "opportunity-radar-publishability-diagnostic")) | last | .id // empty'
          )"
          if [ -z "$artifact_id" ]; then
            echo "Il run fallito ${previous_run_id} non ha diagnostica: uso lo snapshot accettato."
            exit 0
          fi
          seed_dir="/tmp/opportunity-source-health-seed"
          mkdir -p "$seed_dir"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$seed_dir/artifact.zip"
          unzip -q -o "$seed_dir/artifact.zip" -d "$seed_dir"
          seed_path="$seed_dir/opportunity-publishability-diagnostic.json"
          if [ ! -s "$seed_path" ]; then
            echo "Artifact diagnostico ${artifact_id} privo del JSON atteso: uso lo snapshot accettato."
            exit 0
          fi
          echo "OPPORTUNITY_SOURCE_HEALTH_SEED=$seed_path" >> "$GITHUB_ENV"
          echo "Salute fonti ereditata dall'artifact diagnostico ${artifact_id}."

      - name: Scan live sources and build daily snapshot
        id: live_scan
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/runtime
          python scripts/opportunity_daily_refresh_stable.py 2>&1 \
            | tee reports/runtime/opportunity-live-scan.log

      - name: Upload continuity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-continuity-diagnostic
          path: reports/runtime/opportunity-continuity-hold.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload publishability diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-publishability-diagnostic
          path: reports/runtime/opportunity-publishability-diagnostic.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate daily snapshot and freshness
        id: validate_snapshot
        if: ${{ steps.live_scan.outcome == 'success' }}
        continue-on-error: true
        run: |
          python -m json.tool data/opportunity-daily-public.json > /dev/null
          python scripts/test_opportunity_snapshot_lifecycle.py --file data/opportunity-daily-public.json --mode daily
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('data/opportunity-daily-public.json').read_text(encoding='utf-8'))
          transport_summary = ((p.get('transportAudit') or {}).get('summary') or {})
          assert (p.get('counts') or {}).get('transportFallbacks') == int(transport_summary.get('fallbackSuccesses') or 0)
          assert (p.get('counts') or {}).get('transportProxyFallbacks') == int(transport_summary.get('proxySuccesses') or 0)
          assert (p.get('counts') or {}).get('transportFailures') == int(transport_summary.get('endpointFailures') or 0)
          print(
              f"Trasporto daily coerente: fallback {transport_summary.get('fallbackSuccesses', 0)} · "
              f"fonti in grace {transport_summary.get('sourcesInGrace', 0)} · "
              f"fonti unhealthy {transport_summary.get('unhealthySources', 0)} · "
              f"fallimenti endpoint {transport_summary.get('endpointFailures', 0)}"
          )
          PY

      - name: Build and validate the public Radar before committing
        id: validate_build
        if: ${{ steps.live_scan.outcome == 'success' && steps.validate_snapshot.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('data/opportunity-daily-public.json').read_text(encoding='utf-8'))
          html = Path('dist/opportunita/index.html').read_text(encoding='utf-8')
          year, month, day = payload['referenceDate'].split('-')
          displayed = f'{day}/{month}/{year}'
          assert displayed in html, f'La build pubblica non usa lo snapshot giornaliero {displayed}'
          assert html.count('data-opportunity-card') == len(payload.get('opportunities') or [])
          print('Build Radar collegata allo snapshot giornaliero:', displayed)
          PY
          python scripts/preview_dist.py --port 8123 --directory dist >/tmp/ov-radar-daily.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/ >/dev/null; then
              python scripts/test_opportunity_release_browser.py --base http://127.0.0.1:8123/
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ov-radar-daily.log
          exit 1

      - name: Generate readable run report
        id: run_report
        if: always()
        shell: bash
        run: |
          python scripts/opportunity_run_report.py \
            --previous /tmp/opportunity-daily-previous.json \
            --current data/opportunity-daily-public.json \
            --diagnostic reports/runtime/opportunity-publishability-diagnostic.json \
            --scan-status "${{ steps.live_scan.outcome }}" \
            --validation-status "${{ steps.validate_snapshot.outcome }}" \
            --build-status "${{ steps.validate_build.outcome }}"
          cat reports/runtime/opportunity-run-report.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          report = json.load(open('reports/runtime/opportunity-run-report.json', encoding='utf-8'))
          counts = report['counts']
          changed = any(int(counts[key]) > 0 for key in ('added', 'modified', 'archived', 'removed'))
          print(f"content_changed={'true' if changed else 'false'}")
          print(f"reference_date={report.get('referenceDate') or 'n.d.'}")
          print(f"fingerprint={report['fingerprint']}")
          for key in ('added', 'modified', 'archived', 'removed'):
              print(f"{key}={int(counts[key])}")
          PY

      - name: Upload complete run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-daily-report
          path: |
            reports/runtime/opportunity-run-report.html
            reports/runtime/opportunity-run-report.json
            reports/runtime/opportunity-run-report.md
            reports/runtime/opportunity-daily-summary.md
            reports/runtime/opportunity-live-scan.log
            reports/runtime/opportunity-continuity-hold.json
            reports/runtime/opportunity-publishability-diagnostic.json
          if-no-files-found: warn
          retention-days: 90

      - name: Notify owner about blocked publication
        if: >-
          ${{ always() && github.ref == 'refs/heads/main' &&
              (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)) &&
              steps.run_report.outcome == 'success' &&
              (steps.live_scan.outcome != 'success' || steps.validate_snapshot.outcome != 'success' || steps.validate_build.outcome != 'success') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker="radar-failure:${{ steps.run_report.outputs.reference_date }}:${{ steps.run_report.outputs.fingerprint }}"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json body --jq '.[] | .body // ""' | grep -Fq "$marker"; then
            echo "Blocco Radar già notificato: ${marker}"
            exit 0
          fi
          {
            echo "<!-- ${marker} -->"
            echo "# Pubblicazione Radar bloccata"
            echo
            echo "Nessun dato è stato pubblicato. [Apri il run GitHub](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            cat reports/runtime/opportunity-run-report.md
          } > /tmp/opportunity-radar-failure.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Radar bloccato · ${{ steps.run_report.outputs.reference_date }}" \
            --body-file /tmp/opportunity-radar-failure.md \
            --assignee "$GITHUB_REPOSITORY_OWNER"

      - name: Enforce complete green run
        if: always()
        env:
          SCAN_STATUS: ${{ steps.live_scan.outcome }}
          VALIDATION_STATUS: ${{ steps.validate_snapshot.outcome }}
          BUILD_STATUS: ${{ steps.validate_build.outcome }}
          REPORT_STATUS: ${{ steps.run_report.outcome }}
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, 'scripts')
          from opportunity_run_report import incomplete_run_stages

          statuses = {
              'scan': os.environ.get('SCAN_STATUS'),
              'validation': os.environ.get('VALIDATION_STATUS'),
              'build': os.environ.get('BUILD_STATUS'),
              'report': os.environ.get('REPORT_STATUS'),
          }
          failed = incomplete_run_stages(statuses)
          if failed:
              raise SystemExit(
                  'Run Radar non pubblicabile: '
                  + ', '.join(f'{name}={status}' for name, status in failed.items())
              )
          print('Contratto del run Radar: scan, snapshot, build/browser e report PASS.')
          PY

      - name: Persist verified snapshot as runtime state
        if: >-
          ${{ github.ref == 'refs/heads/main' &&
              (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)) }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/opportunity-radar-daily"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/opportunity-daily-public.json
          if git diff --cached --quiet; then
            echo "Stato runtime già aggiornato."
            exit 0
          fi
          git commit -m "Aggiorna stato Radar $(date -u +%F)"

          git restore --worktree -- .
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Working tree tracciato non pulito prima del push:"
            git status --short --untracked-files=no
            exit 1
          fi

          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git push --force-with-lease origin HEAD:"$BRANCH"

      - name: Upload verified site for automatic publication
        if: >-
          ${{ github.ref == 'refs/heads/main' &&
              (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    name: publish verified Radar
    needs: refresh
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)) }}
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified Radar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Download readable run report
        if: needs.refresh.outputs.content_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: opportunity-radar-daily-report
          path: reports/runtime

      - name: Notify owner after successful publication
        if: needs.refresh.outputs.content_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker="radar-published:${{ needs.refresh.outputs.fingerprint }}"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json body --jq '.[] | .body // ""' | grep -Fq "$marker"; then
            echo "Pubblicazione già notificata: ${marker}"
            exit 0
          fi
          {
            echo "<!-- ${marker} -->"
            echo "# Radar aggiornato e pubblicato"
            echo
            echo "La pubblicazione è conclusa. [Apri il Radar Opportunità](https://osservatorioversilia.it/opportunita/)."
            echo
            cat reports/runtime/opportunity-run-report.md
          } > /tmp/opportunity-radar-published.md
          title="Radar pubblicato · ${{ needs.refresh.outputs.reference_date }} · +${{ needs.refresh.outputs.added }} ~${{ needs.refresh.outputs.modified }} −${{ needs.refresh.outputs.archived }}"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body-file /tmp/opportunity-radar-published.md \
            --assignee "$GITHUB_REPOSITORY_OWNER"

      - name: Close legacy daily snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(gh pr list --state open --head automation/opportunity-radar-daily --base main --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr close "$PR_NUMBER" --comment "Il Radar pubblica ora automaticamente solo dopo tutti i gate verdi; questa PR giornaliera non è più necessaria."
          fi
