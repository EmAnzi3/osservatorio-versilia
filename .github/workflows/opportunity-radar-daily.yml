name: Radar Opportunità · refresh giornaliero

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: opportunity-radar-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Radar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Validate v0.4.4 contracts and blind-test hardening
        run: |
          python scripts/test_opportunity_regione_toscana_guard.py
          python scripts/test_opportunity_issue_notification.py
          python scripts/test_opportunity_daily_continuity.py
          python scripts/test_opportunity_primary_revalidation.py
          python scripts/test_opportunity_discovery_resilience.py
          python scripts/test_opportunity_source_health.py
          python scripts/test_opportunity_radar_v044.py
          python scripts/run_opportunity_radar_v044.py --backtest-only

      - name: Seed refresh from latest accepted or pending snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/opportunity-radar-daily"
          SNAPSHOT="data/opportunity-daily-public.json"

          cp "$SNAPSHOT" /tmp/opportunity-daily-main.json
          cp "$SNAPSHOT" /tmp/opportunity-daily-previous.json

          OPEN_PR="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true

          if git show "refs/remotes/origin/$BRANCH:$SNAPSHOT" > /tmp/opportunity-daily-pending.json 2>/dev/null; then
            export OPEN_PR
            python - <<'PY'
          import json
          import os
          import shutil
          from datetime import date
          from pathlib import Path

          main_path = Path('/tmp/opportunity-daily-main.json')
          pending_path = Path('/tmp/opportunity-daily-pending.json')
          target_path = Path('data/opportunity-daily-public.json')
          previous_path = Path('/tmp/opportunity-daily-previous.json')

          main = json.loads(main_path.read_text(encoding='utf-8'))
          pending = json.loads(pending_path.read_text(encoding='utf-8'))

          def parsed_date(payload):
              try:
                  return date.fromisoformat(str(payload.get('referenceDate') or ''))
              except ValueError:
                  return None

          def pending_is_valid(payload):
              return (
                  payload.get('releaseVersion') == '0.4.4'
                  and payload.get('dailyHardeningVersion') == '0.4.4-h5'
                  and not payload.get('continuityHold')
                  and not payload.get('coverageHold')
                  and (payload.get('coverageAudit') or {}).get('status') == 'pass'
              )

          main_date = parsed_date(main)
          pending_date = parsed_date(pending)
          open_pr = bool(os.environ.get('OPEN_PR'))
          use_pending = (
              pending_is_valid(pending)
              and pending_date is not None
              and (
                  main_date is None
                  or pending_date > main_date
                  or (pending_date == main_date and open_pr)
              )
          )

          source = pending_path if use_pending else main_path
          shutil.copyfile(source, target_path)
          shutil.copyfile(source, previous_path)
          selected = pending if use_pending else main
          label = 'pending automation snapshot' if use_pending else 'main snapshot'
          print(f"Baseline refresh: {label} · {selected.get('referenceDate')}")
          PY
          else
            echo "Nessuno snapshot pendente sul branch di automazione: uso main."
          fi

      - name: Materialize verified baseline
        run: python scripts/materialize_opportunity_release_snapshot.py

      - name: Scan live sources and build daily snapshot
        run: python scripts/opportunity_daily_refresh_stable.py

      - name: Upload continuity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-continuity-diagnostic
          path: reports/runtime/opportunity-continuity-hold.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate daily snapshot and freshness
        run: |
          python -m json.tool data/opportunity-daily-public.json > /dev/null
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('data/opportunity-daily-public.json')
          p = json.loads(path.read_text(encoding='utf-8'))
          expected_date = datetime.now(timezone.utc).date().isoformat()
          assert p.get('referenceDate') == expected_date, (p.get('referenceDate'), expected_date)
          assert p.get('releaseVersion') == '0.4.4'
          assert p.get('dailyHardeningVersion') == '0.4.4-h5'
          assert p.get('sourceHealthGraceDays') == 2
          assert not p.get('continuityHold')
          assert not p.get('coverageHold')
          assert (p.get('backtest') or {}).get('passed') is True
          assert (p.get('coverageAudit') or {}).get('status') == 'pass'
          assert not ((p.get('coverageAudit') or {}).get('runtimeUncoveredFamilies') or [])
          assert (p.get('regionalCompleteness') or {}).get('status') in {'pass', 'degraded'}
          assert (p.get('continuityReconciliation') or {}).get('remaining') == 0

          transport = p.get('transportAudit') or {}
          assert transport.get('schemaVersion') == '1.2', transport
          transport_summary = transport.get('summary') or {}
          assert int(transport_summary.get('configuredSources') or 0) > 0, transport_summary
          assert int(transport_summary.get('configuredEndpoints') or 0) > 0, transport_summary
          assert int(transport_summary.get('sourceHealthGraceDays') or 0) == 2, transport_summary
          assert (p.get('counts') or {}).get('transportFallbacks') == int(transport_summary.get('fallbackSuccesses') or 0)
          assert (p.get('counts') or {}).get('transportProxyFallbacks') == int(transport_summary.get('proxySuccesses') or 0)
          assert (p.get('counts') or {}).get('transportFailures') == int(transport_summary.get('endpointFailures') or 0)

          ids = {x.get('coverage_id') for x in p.get('opportunities') or []}
          required = {
              'pcm-sport-eventi-2026',
              'life-2026-cet-heatcoolplan',
              'life-2026-cet-pda',
              'life-2026-cet-enercom',
              'life-2026-cet-empower',
          }
          assert required <= ids, sorted(required - ids)
          print(
              f"Daily snapshot validato: {len(p.get('opportunities') or [])} opportunità · "
              f"{(p.get('counts') or {}).get('new', 0)} nuove · data {expected_date} · "
              f"fallback trasporto {transport_summary.get('fallbackSuccesses', 0)} · "
              f"fonti in grace {transport_summary.get('sourcesInGrace', 0)} · "
              f"fonti unhealthy {transport_summary.get('unhealthySources', 0)} · "
              f"fallimenti endpoint {transport_summary.get('endpointFailures', 0)} · "
              f"continuità riconciliata {(p.get('continuityReconciliation') or {}).get('reconciled', 0)}"
          )
          PY

      - name: Build and validate the public Radar before committing
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('data/opportunity-daily-public.json').read_text(encoding='utf-8'))
          html = Path('dist/opportunita/index.html').read_text(encoding='utf-8')
          year, month, day = payload['referenceDate'].split('-')
          displayed = f'{day}/{month}/{year}'
          assert displayed in html, f'La build pubblica non usa lo snapshot giornaliero {displayed}'
          assert html.count('data-opportunity-card') == len(payload.get('opportunities') or [])
          print('Build Radar collegata allo snapshot giornaliero:', displayed)
          PY
          python scripts/preview_dist.py --port 8123 --directory dist >/tmp/ov-radar-daily.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/ >/dev/null; then
              python scripts/test_opportunity_release_browser.py --base http://127.0.0.1:8123/
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ov-radar-daily.log
          exit 1

      - name: Upload refresh report
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-daily-report
          path: reports/runtime/opportunity-daily-summary.md
          retention-days: 14

      - name: Commit verified daily snapshot to automation branch
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/opportunity-radar-daily"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/opportunity-daily-public.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna variazione dello snapshot."
            exit 0
          fi
          git commit -m "Aggiorna Radar Opportunità $(date -u +%F)"

          git restore --worktree -- .
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Working tree tracciato non pulito prima del rebase:"
            git status --short --untracked-files=no
            exit 1
          fi

          git fetch origin main
          git rebase origin/main

          PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            IS_DRAFT="$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "PR #${PR_NUMBER} riutilizzata: ritorno a draft prima di aggiornare il branch."
              gh pr ready "$PR_NUMBER" --undo
            fi
          fi

          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git push --force-with-lease origin HEAD:"$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create or update Radar review pull request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          REFERENCE_DATE="$(python - <<'PY'
          import json
          print(json.load(open('data/opportunity-daily-public.json', encoding='utf-8'))['referenceDate'])
          PY
          )"
          TITLE="Aggiorna Radar Opportunità ${REFERENCE_DATE}"
          cat > /tmp/opportunity-radar-pr.md <<EOF
          ## Radar Opportunità · refresh giornaliero

          Snapshot verificato del **${REFERENCE_DATE}** prodotto dal workflow giornaliero.

          - la pipeline ha superato i contratti Radar, il controllo di continuità, la copertura fonti e il browser test;
          - lo snapshot è proposto tramite branch di automazione, **mai con push diretto su \`main\`**;
          - la pubblicazione resta subordinata ai gate \`quick\` + \`full\` e al merge della PR secondo il ruleset di \`main\`.

          Nessun dato viene pubblicato automaticamente da questo workflow.
          EOF

          PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file /tmp/opportunity-radar-pr.md
          else
            IS_DRAFT="$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              gh pr ready "$PR_NUMBER" --undo
            fi
            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body-file /tmp/opportunity-radar-pr.md
          fi

      - name: Run quick and full gates on the automation branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ steps.commit.outputs.branch }}"

      - name: Notify owner about new opportunities
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s /tmp/opportunity-daily-previous.json
          echo "Confronto con l'ultima baseline effettiva usata dal refresh."

          python scripts/opportunity_issue_notification.py \
            --previous /tmp/opportunity-daily-previous.json \
            --current data/opportunity-daily-public.json \
            --json-out /tmp/radar-new-opportunities.json \
            --body-out /tmp/radar-new-opportunities.md

          count=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/radar-new-opportunities.json', encoding='utf-8'))['count'])
          PY
          )
          if [ "$count" -eq 0 ]; then
            echo "Nessuna nuova identità: nessuna Issue da creare."
            exit 0
          fi

          fingerprint=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/radar-new-opportunities.json', encoding='utf-8'))['fingerprint'])
          PY
          )
          marker="radar-new:${fingerprint}"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json body --jq '.[] | .body // ""' | grep -Fq "$marker"; then
            echo "Notifica ${fingerprint} già presente: nessun duplicato creato."
            exit 0
          fi

          title=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/radar-new-opportunities.json', encoding='utf-8'))['issueTitle'])
          PY
          )
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body-file /tmp/radar-new-opportunities.md \
            --assignee "$GITHUB_REPOSITORY_OWNER"
