name: A5 browser tail validation

on:
  push:
    branches:
      - "debug/a5-browser-tail"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
          npm install --global lighthouse@12.8.2

      - name: Prepare coherent dist like pages full
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          git diff --exit-code -- . ':(exclude)dist'
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py
          python scripts/build_pnrr_toscana_deep_dive.py
          python scripts/inject_pnrr_town_experience.py
          python scripts/copy_percorsi_dist.py
          node --check dist/assets/app-bundle.js

      - name: Run browser tail after Ambiente acqua
        shell: bash
        run: |
          set -euo pipefail
          PORT=8127
          BASE="http://127.0.0.1:${PORT}/"
          python scripts/preview_dist.py --port "${PORT}" --directory dist >/tmp/a5-browser-tail-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 1

          echo "==> ERP browser"
          python scripts/test_erp_arrears_v125_browser.py --base "${BASE}" --screenshots-dir reports/erp-arrears-v125-browser

          echo "==> Investimenti browser"
          python scripts/test_investimenti_versilia_browser.py --base "${BASE}"

          echo "==> Salute finanziaria browser"
          python scripts/test_salute_finanziaria_v129_browser.py --base "${BASE}"

          echo "==> PNRR town browser"
          python scripts/test_pnrr_toscana_town_browser.py --base "${BASE}"

          echo "==> Income/inflation browser"
          python scripts/check_income_inflation_history_browser.py --base "${BASE}"

          echo "==> Data status browser"
          python scripts/test_data_status_browser.py --base "${BASE}"

          echo "==> Chart surfaces"
          python scripts/test_chart_surfaces.py

          echo "==> Accordion/history UX"
          python scripts/test_ux_experiment.py

          echo "==> Mobile interactions"
          python scripts/test_mobile_interactions.py

          echo "==> Accordion persistence"
          python scripts/test_accordion_tools_persistence.py

          echo "==> Exports"
          python scripts/test_exports_v161.py

          echo "==> Percorsi mobile"
          python scripts/test_percorsi_mobile_list_contract.py --base "${BASE}"

          echo "==> A4 visual regression"
          python scripts/test_visual_regression.py --base "${BASE}"

          echo "==> Site chrome browser"
          python scripts/test_site_chrome_browser.py --base "${BASE}"

      - name: Upload browser-tail diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-browser-tail-diagnostics
          path: |
            reports/
            /tmp/a5-browser-tail-preview.log
          if-no-files-found: ignore
          retention-days: 7
