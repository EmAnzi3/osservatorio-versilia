name: Fix v1.5.0 app sources

on:
  push:
    branches: ["expansion/toscana-indicatori-comunali"]

permissions:
  contents: write

concurrency:
  group: fix-v150-app
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/toscana-indicatori-comunali
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/fix_v150_app.py

      - name: Commit corrected readable sources
        run: |
          if git diff --quiet -- assets/app-parts/00.txt scripts/update_toscana_indicators_v150.py; then
            echo "Sorgenti già corretti."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-parts/00.txt scripts/update_toscana_indicators_v150.py
          git commit -m "Corregge ricerca e migrazione degli indicatori v1.5.0"
          git push origin HEAD:expansion/toscana-indicatori-comunali
