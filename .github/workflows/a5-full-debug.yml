name: A5 full preflight debug

on:
  push:
    branches:
      - debug/a5-full-preflight

permissions:
  contents: read

concurrency:
  group: a5-full-debug
  cancel-in-progress: true

jobs:
  full-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout debug branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Prepare coherent dist
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          git diff --exit-code -- . ':(exclude)dist'
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py
          python scripts/build_pnrr_toscana_deep_dive.py
          python scripts/inject_pnrr_town_experience.py
          python scripts/copy_percorsi_dist.py
          node --check dist/assets/app-bundle.js

      - name: Run residual A5 gate
        run: python scripts/a5_residual_sweep_debug.py

      - name: Upload debug reports and recorded A4 baselines
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: a5-debug-reports-${{ github.run_id }}
          path: |
            reports/
            ci/visual-regression-baselines/*.json
            dist/
          if-no-files-found: ignore
          retention-days: 14
