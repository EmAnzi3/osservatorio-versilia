name: One-shot dataset metadata fix

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-shot-dataset-metadata.yml"]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update dataset metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("data/site-data.json")
          text = path.read_text(encoding="utf-8")
          old = '  "version": "v1.9.0",\n  "updated": "12 agosto 2026",'
          new = '  "version": "v1.10.0",\n  "updated": "14 agosto 2026",'
          if text.count(old) != 1:
              raise SystemExit("Metadati attesi non trovati esattamente una volta; nessuna modifica eseguita")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit metadata correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Aggiorna metadati dataset a v1.10.0"
          git push origin HEAD:main

      - name: Deploy corrected main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
