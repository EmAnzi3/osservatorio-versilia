name: TEMP PR125 fuel date

on:
  push:
    branches: ["automation/data-check-2026-08"]
    paths:
      - ".github/workflows/temp-pr125-fuel-date.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MIMIT current snapshot
        run: |
          python scripts/audit_fuel_prices_mimit.py --out reports/fuel-current.json
          cat reports/fuel-current.json
