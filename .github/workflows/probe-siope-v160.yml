name: Probe SIOPE API v1.6.0

on:
  push:
    branches: ["expansion/bilanci-comunali-v160"]
    paths:
      - "scripts/diagnose_siope_2019.py"
      - "scripts/patch_siope_builder_download.py"
      - "scripts/discover_siope_resources.py"
      - ".github/workflows/probe-siope-v160.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install requests

      - name: Materialize reviewed SIOPE parser
        run: python scripts/materialize_siope_sources.py

      - name: Install current official CKAN dump support
        run: python scripts/patch_siope_builder_download.py

      - name: Materialize verified SIOPE 2019-2025 manifest
        run: python scripts/discover_siope_resources.py

      - name: Diagnose official 2019 Entrata dump format
        run: python scripts/diagnose_siope_2019.py

# Read-only diagnostic workflow. It cannot deploy, commit or merge.
