name: Probe SIOPE API v1.6.0

on:
  push:
    branches: ["expansion/bilanci-comunali-v160"]
    paths:
      - "scripts/probe_siope_api.py"
      - ".github/workflows/probe-siope-v160.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install requests

      - name: Discover official catalogue resources
        run: python scripts/discover_siope_resources.py

      - name: Probe official CKAN and OData endpoints
        run: python scripts/probe_siope_api.py

# Read-only diagnostic workflow. It cannot deploy, commit or merge.
