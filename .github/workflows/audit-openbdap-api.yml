name: Audit OpenBDAP municipal API

on:
  push:
    branches: ["audit/toscana-comunali-bilanci"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-openbdap-api
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python scripts/audit_openbdap_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-openbdap-api
          path: audit-openbdap-api
          retention-days: 7
