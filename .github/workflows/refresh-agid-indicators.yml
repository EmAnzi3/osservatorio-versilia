name: Aggiorna imprese, ATECO e banda larga

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-agid-indicators.yml"
      - "scripts/update_agid_indicators*.py"
      - "scripts/test_agid_refresh_idempotent.py"
      - "scripts/restore_partial_agcom_metrics.py"
      - "scripts/enrich_ateco_agcom_audit.py"
      - "scripts/audit_agcom_primary.py"
      - "scripts/apply_agcom_primary_percentages.py"
      - "scripts/apply_agcom_absolute_policy.py"
      - "scripts/test_ateco_agcom_audit.py"
      - "scripts/test_agcom_primary_percentages.py"
      - "scripts/monthly_data_check_coverage.py"
      - "scripts/build_static.py"
      - "scripts/capture_agid_preview.py"
      - "assets/ateco-detail.js"
      - "assets/ateco-detail.css"
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-agid-indicators
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'EmAnzi3' &&
       github.event.comment.body == '/aggiorna-imprese-banda-larga')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run extractor and source tests
        run: |
          python scripts/test_agid_indicators.py
          python scripts/test_agid_refresh_idempotent.py
          python scripts/test_ateco_agcom_audit.py
          python scripts/test_agcom_primary_percentages.py
          python -m py_compile \
            scripts/update_agid_indicators_resilient.py \
            scripts/restore_partial_agcom_metrics.py \
            scripts/enrich_ateco_agcom_audit.py \
            scripts/audit_agcom_primary.py \
            scripts/apply_agcom_primary_percentages.py \
            scripts/apply_agcom_absolute_policy.py \
            scripts/monthly_data_check_coverage.py \
            scripts/capture_agid_preview.py

      - name: Fetch official ASIA and AGCOM data
        run: |
          python scripts/update_agid_indicators_resilient.py
          python scripts/enrich_ateco_agcom_audit.py
          python scripts/audit_agcom_primary.py
          python scripts/apply_agcom_primary_percentages.py
          python scripts/apply_agcom_absolute_policy.py

      - name: Validate dataset with declared coverage
        run: |
          mkdir -p /tmp/agid-data-check
          python scripts/monthly_data_check_coverage.py \
            --mode offline \
            --report-md /tmp/agid-data-check/report.md \
            --report-json /tmp/agid-data-check/report.json \
            --next-state /tmp/agid-data-check/state.json

      - name: Install preview browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build and validate static preview
        run: |
          python scripts/build_static_safe.py
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py
          python scripts/test_data_status.py
          python scripts/test_static.py
          grep -q 'ateco-detail.js' dist/confronta/economia/index.html
          grep -q 'ateco-detail.css' dist/comuni/massarosa/index.html
          python - <<'PY'
          from pathlib import Path
          import mimetypes
          crests = [
              'massarosa.png', 'viareggio.svg', 'camaiore.svg',
              'pietrasanta.svg', 'seravezza.png', 'forte-dei-marmi.svg',
              'stazzema.webp'
          ]
          for crest in crests:
              p = Path('dist/crests') / crest
              assert p.exists() and p.stat().st_size > 0, f'Stemma mancante: {crest}'
          for crest in ['viareggio.svg','camaiore.svg','pietrasanta.svg','forte-dei-marmi.svg']:
              assert mimetypes.guess_type(crest)[0] == 'image/svg+xml'
          print('Stemmi verificati: 7/7')
          PY

      - name: Capture desktop and mobile preview
        run: |
          python -m http.server 8765 --directory dist >/tmp/agid-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/capture_agid_preview.py \
            --base-url http://127.0.0.1:8765 \
            --output-dir reports/previews/imprese-banda-larga

      - name: Package local preview and audit outputs
        run: |
          mkdir -p preview-imprese-banda-larga/site preview-imprese-banda-larga/schermate
          cp -a dist/. preview-imprese-banda-larga/site/
          cp reports/previews/imprese-banda-larga/*.png preview-imprese-banda-larga/schermate/
          cp reports/previews/imprese-banda-larga/indicatori.md preview-imprese-banda-larga/OUTPUT_INDICATORI.md
          cp reports/previews/imprese-banda-larga/indicatori.csv preview-imprese-banda-larga/OUTPUT_INDICATORI.csv
          cp reports/previews/imprese-banda-larga/ateco-agcom-audit.md preview-imprese-banda-larga/AUDIT_ATECO_AGID.md
          cp reports/previews/imprese-banda-larga/agcom-primary-audit.md preview-imprese-banda-larga/AUDIT_AGCOM_PRIMARIO.md
          cp data/source-snapshots/agid-asia-agcom-2026-08.json preview-imprese-banda-larga/SNAPSHOT_FONTI.json
          cat > preview-imprese-banda-larga/serve_preview.py <<'PY'
          import http.server
          import os
          import sys
          from pathlib import Path
          root = Path(sys.argv[1] if len(sys.argv) > 1 else "site").resolve()
          os.chdir(root)
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 8765), http.server.SimpleHTTPRequestHandler)
          print("Preview: http://127.0.0.1:8765/confronta/economia/?indicatore=localEmployees")
          print("Per chiudere: Ctrl+C")
          server.serve_forever()
          PY
          cat > preview-imprese-banda-larga/AVVIA_PREVIEW.bat <<'BAT'
          @echo off
          setlocal
          cd /d "%~dp0"
          where py >nul 2>&1
          if %errorlevel%==0 (
            set "PY=py"
          ) else (
            where python >nul 2>&1
            if %errorlevel%==0 (
              set "PY=python"
            ) else (
              echo Python non trovato. Apri le immagini nella cartella schermate oppure installa Python 3.
              pause
              exit /b 1
            )
          )
          start "Osservatorio Versilia - server preview" %PY% "%~dp0serve_preview.py" "%~dp0site"
          timeout /t 2 /nobreak >nul
          start "" "http://127.0.0.1:8765/confronta/economia/?indicatore=localEmployees"
          echo Preview avviata. Per fermare il server chiudi la finestra del server.
          pause
          BAT
          cat > preview-imprese-banda-larga/LEGGIMI.txt <<'TXT'
          PREVIEW NON PUBBLICATA — OSSERVATORIO VERSILIA
          Estrai completamente lo ZIP e apri AVVIA_PREVIEW.bat. Non aprire gli HTML con doppio clic.
          Il server Python assegna correttamente anche il MIME image/svg+xml agli stemmi SVG.
          TXT

      - name: Upload non-published preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-imprese-banda-larga-ateco-audit
          path: preview-imprese-banda-larga
          retention-days: 14
          if-no-files-found: error

      - name: Create or update draft data pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/imprese-banda-larga"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add \
            data/site-data.json \
            data/source-registry.json \
            data/source-snapshots/agid-asia-agcom-2026-08.json \
            README.md \
            docs/aggiornamento-mensile-dati.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica da proporre."
            exit 0
          fi
          git commit -m "Aggiorna ASIA, ATECO e copertura FTTH"
          git push --force origin "$branch"

          body_file="$(mktemp)"
          cat > "$body_file" <<'EOF'
          ## Aggiornamento dati

          - ISTAT ASIA-UL: unità locali, addetti e dettaglio ATECO a 2 cifre;
          - AGCOM Broadband Map: percentuali e conteggi FTTH letti dal CSV comunale primario ufficiale;
          - soglia di pubblicabilità: 7/7 standard, 6/7 ammesso con un solo Comune privo di conteggio valido;
          - nessuna stima o ricostruzione dei valori mancanti.

          La preview e gli audit sono disponibili negli Artifacts del workflow.
          EOF

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "Aggiorna ASIA, ATECO e banda larga" --body-file "$body_file"
            pr_url="$(gh pr view "$branch" --json url --jq .url)"
          else
            pr_url="$(gh pr create --draft --base main --head "$branch" --title "Aggiorna ASIA, ATECO e banda larga" --body-file "$body_file")"
          fi
          echo "PR: $pr_url"

          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue comment "${{ github.event.issue.number }}" --body "Aggiornamento completato: $pr_url\n\nPreview e audit: $run_url"
          fi
