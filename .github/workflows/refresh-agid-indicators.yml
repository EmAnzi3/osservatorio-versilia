name: Preview imprese ATECO e banda larga

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-ateco-broadband-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python scripts/test_agid_indicators.py
          python -m py_compile \
            scripts/update_agid_indicators_resilient.py \
            scripts/enrich_ateco_details.py \
            scripts/audit_agcom_broadband.py \
            scripts/monthly_data_check_coverage.py \
            scripts/inject_ateco_assets.py \
            scripts/capture_agid_preview.py

      - name: Fetch official data and build preview dataset
        run: |
          python scripts/update_agid_indicators_resilient.py
          python scripts/enrich_ateco_details.py
          python scripts/audit_agcom_broadband.py

      - name: Validate dataset
        run: |
          mkdir -p /tmp/agid-data-check
          python scripts/monthly_data_check_coverage.py \
            --mode offline \
            --report-md /tmp/agid-data-check/report.md \
            --report-json /tmp/agid-data-check/report.json \
            --next-state /tmp/agid-data-check/state.json

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build static preview
        run: |
          python scripts/build_static_safe.py
          python scripts/inject_ateco_assets.py
          python scripts/test_static.py

      - name: Capture desktop and mobile preview
        run: |
          python -m http.server 8765 --directory dist >/tmp/agid-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/capture_agid_preview.py \
            --base-url http://127.0.0.1:8765 \
            --output-dir reports/previews/imprese-banda-larga

      - name: Prepare readable outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          data=json.loads(Path('data/site-data.json').read_text(encoding='utf-8'))
          out=Path('reports/previews/imprese-banda-larga'); out.mkdir(parents=True,exist_ok=True)
          keys=['localEmployees','employeesPerLocalUnit','localUnitsChange','localEmployeesChange','ftthCoverageDesi','ftthCoverage20m']
          lines=['# Output nuovi indicatori','']
          with (out/'indicatori.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter=';'); w.writerow(['indicatore','comune','codice_istat','valore','visualizzazione','anno','copertura'])
              for key in keys:
                  m=data['metrics'][key]; lines += [f"## {m['meta']['label']}",'',f"- **Anno:** {m['meta']['year']}",f"- **Copertura:** {m['method']['coverage']}",'','| Comune | Valore |','|---|---:|']
                  for r in m['rows']:
                      shown=r.get('formatted') or str(r.get('value'))
                      lines.append(f"| {r['town']} | {shown} |")
                      w.writerow([m['meta']['label'],r['town'],r['code'],r.get('value',''),shown,m['meta']['year'],m['method']['coverage']])
                  lines.append('')
          ateco=data.get('ateco',{}); lines += ['## Dettaglio ATECO','',f"- **Anno:** {ateco.get('year')}",f"- **Copertura:** {ateco.get('coverage')}",'']
          for code,town in ateco.get('towns',{}).items():
              top=(town.get('topByLocalUnits') or [{}])[0]
              lines.append(f"- **{town.get('town')}**: {top.get('code','')} {top.get('label','')} — {top.get('localUnits','')} unità locali")
          audit=data.get('broadbandAudit',{}); lines += ['','## Audit conteggi AGCOM','',f"- Copertura affidabile dei conteggi assoluti: **{audit.get('absoluteCountsReliableCoverage')}**",f"- Pubblicabili secondo la soglia minima 6/7: **{'sì' if audit.get('absoluteCountsPublishable') else 'no'}**",'']
          for row in audit.get('rows',[]):
              if not row.get('absoluteCountsReliable'):
                  lines.append(f"- **{row['town']}**: {'; '.join(row.get('reasons',[]))}")
          (out/'indicatori.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Package local preview
        run: |
          mkdir -p preview-imprese-banda-larga/site preview-imprese-banda-larga/schermate
          cp -a dist/. preview-imprese-banda-larga/site/
          cp reports/previews/imprese-banda-larga/*.png preview-imprese-banda-larga/schermate/
          cp reports/previews/imprese-banda-larga/indicatori.md preview-imprese-banda-larga/OUTPUT_INDICATORI.md
          cp reports/previews/imprese-banda-larga/indicatori.csv preview-imprese-banda-larga/OUTPUT_INDICATORI.csv
          cp reports/previews/imprese-banda-larga/audit-agcom.json preview-imprese-banda-larga/AUDIT_AGCOM.json
          cat > preview-imprese-banda-larga/AVVIA_PREVIEW.ps1 <<'EOF'
          $ErrorActionPreference = "Stop"
          $root = Join-Path $PSScriptRoot "site"
          $listener = New-Object System.Net.HttpListener
          $listener.Prefixes.Add("http://127.0.0.1:8765/")
          $listener.Start()
          Start-Process "http://127.0.0.1:8765/confronta/economia/?indicatore=localEmployees"
          Write-Host "Preview attiva su http://127.0.0.1:8765/ - Ctrl+C per chiudere"
          while ($listener.IsListening) {
            $context = $listener.GetContext(); $rel = $context.Request.Url.AbsolutePath.TrimStart('/')
            $file = Join-Path $root $rel
            if (Test-Path $file -PathType Container) { $file = Join-Path $file 'index.html' }
            if (!(Test-Path $file)) { $file = Join-Path $root '404.html'; $context.Response.StatusCode = 404 }
            $bytes = [IO.File]::ReadAllBytes($file); $context.Response.ContentLength64 = $bytes.Length
            $context.Response.OutputStream.Write($bytes,0,$bytes.Length); $context.Response.OutputStream.Close()
          }
          EOF
          cat > preview-imprese-banda-larga/AVVIA_PREVIEW.bat <<'EOF'
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0AVVIA_PREVIEW.ps1"
          pause
          EOF
          cat > preview-imprese-banda-larga/LEGGIMI.txt <<'EOF'
          PREVIEW NON PUBBLICATA — OSSERVATORIO VERSILIA
          Estrai lo ZIP e avvia AVVIA_PREVIEW.bat. Non aprire direttamente gli HTML.
          Controllare Economia, scheda Massarosa (tema Economia) e Mobilità/Infrastrutture.
          OUTPUT_INDICATORI.* contiene i valori; AUDIT_AGCOM.json documenta le anomalie dei conteggi FTTH.
          EOF

      - name: Upload non-published preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-imprese-banda-larga-ateco
          path: preview-imprese-banda-larga
          retention-days: 14
          if-no-files-found: error
