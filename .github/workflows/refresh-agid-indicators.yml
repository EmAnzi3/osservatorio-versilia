name: Aggiorna imprese e banda larga

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-agid-indicators
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.login == 'EmAnzi3' &&
       github.event.comment.body == '/aggiorna-imprese-banda-larga')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run extractor and coverage tests
        run: |
          python scripts/test_agid_indicators.py
          python -m py_compile \
            scripts/update_agid_indicators_resilient.py \
            scripts/restore_partial_agcom_metrics.py \
            scripts/monthly_data_check_coverage.py

      - name: Fetch and integrate official indicators
        run: |
          python scripts/update_agid_indicators_resilient.py
          python scripts/restore_partial_agcom_metrics.py

      - name: Validate dataset with declared coverage
        run: |
          mkdir -p /tmp/agid-data-check
          python scripts/monthly_data_check_coverage.py \
            --mode offline \
            --report-md /tmp/agid-data-check/report.md \
            --report-json /tmp/agid-data-check/report.json \
            --next-state /tmp/agid-data-check/state.json
          python scripts/build_static_safe.py
          python scripts/test_static.py

      - name: Install preview browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture desktop and mobile preview
        run: |
          python -m http.server 8765 --directory dist >/tmp/agid-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/capture_agid_preview.py \
            --base-url http://127.0.0.1:8765 \
            --output-dir reports/previews/imprese-banda-larga

      - name: Package local preview and outputs
        run: |
          mkdir -p preview-imprese-banda-larga/site
          mkdir -p preview-imprese-banda-larga/schermate
          cp -a dist/. preview-imprese-banda-larga/site/
          cp reports/previews/imprese-banda-larga/*.png \
            preview-imprese-banda-larga/schermate/
          cp reports/previews/imprese-banda-larga/indicatori.md \
            preview-imprese-banda-larga/OUTPUT_INDICATORI.md
          cp reports/previews/imprese-banda-larga/indicatori.csv \
            preview-imprese-banda-larga/OUTPUT_INDICATORI.csv
          cat > preview-imprese-banda-larga/AVVIA_PREVIEW.bat <<'EOF'
          @echo off
          cd /d "%~dp0site"
          start "" "http://127.0.0.1:8765/confronta/economia/?indicatore=localEmployees"
          py -m http.server 8765
          pause
          EOF
          cat > preview-imprese-banda-larga/LEGGIMI.txt <<'EOF'
          PREVIEW NON PUBBLICATA — OSSERVATORIO VERSILIA

          1. Estrai completamente il file ZIP.
          2. Apri AVVIA_PREVIEW.bat.
          3. Il browser mostrerà la preview locale.
          4. Per chiuderla, torna alla finestra nera e premi Ctrl+C.

          Pagine da controllare:
          - Economia: addetti e unità locali
          - Mobilità e infrastrutture: connettività digitale

          OUTPUT_INDICATORI.md e OUTPUT_INDICATORI.csv contengono tutti i valori.
          La cartella "schermate" contiene quattro immagini, due desktop e due mobile.
          EOF

      - name: Upload non-published preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-imprese-banda-larga
          path: preview-imprese-banda-larga
          retention-days: 14
          if-no-files-found: error

      - name: Create or update draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/imprese-banda-larga"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/site-data.json data/source-registry.json \
            data/source-snapshots/agid-asia-agcom-2026-08.json \
            README.md docs/aggiornamento-mensile-dati.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica da proporre."
            exit 0
          fi
          git commit -m "Aggiunge imprese, addetti e copertura FTTH"
          git push --force origin "$branch"

          body_file="$(mktemp)"
          cat > "$body_file" <<'EOF'
          ## Contenuto

          Integra nell’Osservatorio i dati comunali su:

          - addetti medi annui nelle unità locali;
          - addetti per unità locale;
          - variazione 2018–2023 di unità locali e addetti;
          - copertura FTTH DESI;
          - famiglie raggiunte e non raggiunte da FTTH;
          - copertura FTTH entro 20 metri.

          La serie delle **unità locali attive** già pubblicata viene estesa al periodo 2018–2023, senza creare un indicatore duplicato.

          ## Copertura

          - indicatori ASIA: **7/7**;
          - percentuali di copertura FTTH: **7/7**;
          - famiglie raggiunte e non raggiunte da FTTH: **6/7**;
          - Forte dei Marmi è mostrato come **n.d.** nei due conteggi assoluti;
          - gli aggregati dei conteggi assoluti sono dichiarati come totali parziali 6/7.

          ## Fonti

          - **ISTAT ASIA-UL**, dati 2018–2023, acquisiti tramite gli shard comunali di AgID — Cruscotto Italia;
          - **AGCOM Broadband Map**, rilevazione al 31 dicembre 2025, acquisita tramite gli shard comunali di AgID — Cruscotto Italia.

          ## Garanzie metodologiche

          - unità locali e imprese giuridiche non vengono confuse;
          - gli addetti sono riferiti al luogo di lavoro, non alla residenza;
          - la copertura FTTH descrive disponibilità dichiarata della rete, non abbonamenti o velocità effettiva;
          - nessun dato mancante viene stimato o ricostruito;
          - la copertura dichiarata deve coincidere con i valori realmente disponibili.

          La preview non pubblicata e gli output completi in Markdown e CSV sono disponibili negli **Artifacts** del workflow che ha creato questa PR.
          EOF

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --title "Aggiunge imprese, addetti e copertura FTTH" \
              --body-file "$body_file"
            pr_url="$(gh pr view "$branch" --json url --jq .url)"
          else
            pr_url="$(gh pr create --draft \
              --base main \
              --head "$branch" \
              --title "Aggiunge imprese, addetti e copertura FTTH" \
              --body-file "$body_file")"
          fi
          echo "PR: $pr_url"

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "Aggiornamento completato: $pr_url\n\nPreview e output completi: $run_url — scaricare l'artifact **preview-imprese-banda-larga**."
          fi
