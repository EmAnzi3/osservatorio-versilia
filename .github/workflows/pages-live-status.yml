name: Report GitHub Pages live status

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  actions: read
  statuses: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Report live deployment result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > /tmp/ov-pages-jobs.json

          payload=$(python - <<'PY'
          import json
          import os

          jobs = json.load(open("/tmp/ov-pages-jobs.json", encoding="utf-8")).get("jobs", [])
          deploy = next((job for job in jobs if job.get("name") == "deploy"), None)
          conclusion = deploy.get("conclusion") if deploy else "missing"
          published = conclusion == "success"
          description = "GitHub Pages pubblicato" if published else f"GitHub Pages non pubblicato: deploy {conclusion}"
          print(json.dumps({
              "state": "success" if published else "failure",
              "context": "ov-pages-live",
              "description": description[:140],
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          )

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -d "$payload"
