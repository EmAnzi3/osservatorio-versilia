name: Report GitHub Pages live status

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  statuses: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Report live deployment result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          STATE: ${{ github.event.workflow_run.conclusion == 'success' && 'success' || 'failure' }}
          DESCRIPTION: "${{ github.event.workflow_run.conclusion == 'success' && 'GitHub Pages pubblicato' || format('GitHub Pages non pubblicato: {0}', github.event.workflow_run.conclusion) }}"
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ov-pages-live",
              "description": os.environ["DESCRIPTION"][:140],
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          )
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -d "$payload"
