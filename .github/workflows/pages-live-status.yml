name: Report GitHub Pages live status

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages", "Radar Opportunità · refresh giornaliero"]
    types: [completed]

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report live deployment result and verify core routes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > /tmp/ov-pages-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > /tmp/ov-pages-jobs.json
          # ov-pages-live changes only when deploy or publish verified Radar is attempted.
          # ov-public-routes and ov-radar-refresh retain their independent outcomes.
          python scripts/pages_live_status.py \
            --run /tmp/ov-pages-run.json \
            --jobs /tmp/ov-pages-jobs.json \
            --base-url https://osservatorioversilia.it/
