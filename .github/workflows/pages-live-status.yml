name: Report GitHub Pages live status

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages", "Radar Opportunità · refresh giornaliero"]
    types: [completed]

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report live deployment result and verify core routes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > /tmp/ov-pages-jobs.json

          python scripts/validate_public_site.py --base-url https://osservatorioversilia.it/ > /tmp/ov-live-site-check.txt 2>&1 || true
          cat /tmp/ov-live-site-check.txt

          payload=$(python - <<'PY'
          import json
          import os

          jobs = json.load(open("/tmp/ov-pages-jobs.json", encoding="utf-8")).get("jobs", [])
          deploy = next(
              (job for job in jobs if job.get("name") in {"deploy", "publish verified Radar"}),
              None,
          )
          conclusion = deploy.get("conclusion") if deploy else "missing"
          deploy_ok = conclusion == "success"
          with open("/tmp/ov-live-site-check.txt", encoding="utf-8") as handle:
              routes_ok = "Public site integrity PASS" in handle.read()
          published = conclusion == "success"
          published = published and routes_ok
          if published:
              description = "Pages pubblicato; route pubbliche verificate"
          elif not deploy_ok:
              conclusion = deploy.get("conclusion") if deploy else "missing"
              description = f"Pages non pubblicato: deploy {conclusion}"
          else:
              description = "Deploy riuscito ma una o più route pubbliche non sono verificate"
          print(json.dumps({
              "state": "success" if published else "failure",
              "context": "ov-pages-live",
              "description": description[:140],
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          )

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -d "$payload"
