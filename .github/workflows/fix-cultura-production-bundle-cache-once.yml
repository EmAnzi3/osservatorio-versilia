name: Fix Cultura production bundle cache once

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/cultura-biblioteche'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/cultura-biblioteche
          fetch-depth: 0

      - name: Patch the production bundle cache contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Pattern missing in {path}: {old}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          build = root / 'scripts/build_static_brand.py'
          replace_once(build, 'APP_BUNDLE_ASSET_VERSION = "20260826-v120"', 'APP_BUNDLE_ASSET_VERSION = "20260827-v121-history-ui3"')
          replace_once(build, 'PWA_JS_REVISION = "catalog-v120"', 'PWA_JS_REVISION = "catalog-v121"')

          catalog = root / 'scripts/test_catalog_release_v116.py'
          replace_once(catalog, 'assert \'APP_BUNDLE_ASSET_VERSION = "20260826-v120"\' in build_brand', 'assert \'APP_BUNDLE_ASSET_VERSION = "20260827-v121-history-ui3"\' in build_brand')
          replace_once(catalog, 'assert \'PWA_JS_REVISION = "catalog-v120"\' in build_brand', 'assert \'PWA_JS_REVISION = "catalog-v121"\' in build_brand')

          cache_test = root / 'scripts/test_cultura_history_cache_v121.py'
          text = cache_test.read_text(encoding='utf-8')
          if 'BUILD_BRAND =' not in text:
              text = text.replace(
                  'PART = (ROOT / "assets" / "app-parts" / "03.txt").read_text(encoding="utf-8")\n',
                  'PART = (ROOT / "assets" / "app-parts" / "03.txt").read_text(encoding="utf-8")\nBUILD_BRAND = (ROOT / "scripts" / "build_static_brand.py").read_text(encoding="utf-8")\n',
                  1,
              )
          marker = 'assert "const VERSION=\'20260827-v121-history-ui2\';" in APP, "Cache-buster app non aggiornato"\n'
          production_asserts = (
              'assert \'APP_BUNDLE_ASSET_VERSION = "20260827-v121-history-ui3"\' in BUILD_BRAND, "Cache-buster del bundle di produzione non aggiornato"\n'
              'assert \'PWA_JS_REVISION = "catalog-v121"\' in BUILD_BRAND, "Revisione PWA del catalogo non aggiornata"\n'
          )
          if production_asserts not in text:
              if marker not in text:
                  raise RuntimeError('Cache test insertion marker missing')
              text = text.replace(marker, marker + production_asserts, 1)
          text = text.replace(
              'print("Cache policy Cultura verificata: app-parts versionati e network-first, renderer storico presente.")',
              'print("Cache policy Cultura verificata: bundle di produzione v1.21 cache-busted, app-parts network-first e renderer storico presente.")',
          )
          cache_test.write_text(text, encoding='utf-8')

          browser = root / 'scripts/test_cultura_biblioteche_v121_browser.py'
          text = browser.read_text(encoding='utf-8')
          if 'APP_BUNDLE_VERSION = "20260827-v121-history-ui3"' not in text:
              text = text.replace(
                  'KEYS = tuple(key for key, _ in METRICS)\n',
                  'KEYS = tuple(key for key, _ in METRICS)\nAPP_BUNDLE_VERSION = "20260827-v121-history-ui3"\n',
                  1,
              )
          if 'def assert_production_bundle_version(page)' not in text:
              insert_at = '\n\ndef no_overflow(page, label: str) -> None:\n'
              helper = '''\n\ndef assert_production_bundle_version(page) -> None:\n    scripts = page.locator('script[src*="assets/app-bundle.js"]')\n    assert scripts.count() == 1, f"Bundle applicativo di produzione assente o duplicato: {scripts.count()}"\n    src = scripts.first.get_attribute("src") or ""\n    assert f"v={APP_BUNDLE_VERSION}" in src, f"Cache-buster bundle inatteso: {src}"\n\n\ndef assert_town_history(page, base: str) -> None:\n    for key, _short_label in METRICS:\n        page.goto(\n            urljoin(base, f"comuni/camaiore/?tema=comunita&indicatore={key}"),\n            wait_until="networkidle",\n        )\n        page.wait_for_timeout(450)\n        assert_production_bundle_version(page)\n        no_overflow(page, f"Camaiore/{key}/storico")\n        topic = page.locator("#town-topic")\n        assert topic.count() == 1, f"Camaiore/{key}: contenitore tema assente"\n        selected = topic.locator(f'button[data-metric="{key}"]').first\n        assert selected.count() == 1 and selected.get_attribute("aria-selected") == "true", f"Camaiore/{key}: indicatore non selezionato"\n        chart = topic.locator(".history-panel .trend-chart")\n        assert chart.count() == 1, f"Camaiore/{key}: grafico storico non renderizzato"\n        assert chart.locator("svg").count() == 1, f"Camaiore/{key}: SVG storico assente"\n        assert topic.locator(".history-panel .comparison-bars").count() == 0, f"Camaiore/{key}: fallback confronto mostrato al posto dello storico"\n'''
              if insert_at not in text:
                  raise RuntimeError('Browser helper insertion marker missing')
              text = text.replace(insert_at, helper + insert_at, 1)
          goto_marker = '    page.wait_for_timeout(500)\n    no_overflow(page, "confronto mobile" if mobile else "confronto desktop")\n'
          goto_new = '    page.wait_for_timeout(500)\n    assert_production_bundle_version(page)\n    no_overflow(page, "confronto mobile" if mobile else "confronto desktop")\n'
          if goto_new not in text:
              if goto_marker not in text:
                  raise RuntimeError('Browser compare insertion marker missing')
              text = text.replace(goto_marker, goto_new, 1)
          tail_marker = '    assert_town_missing_metrics(page, base, "massarosa", "Massarosa")\n    assert_town_missing_metrics(page, base, "stazzema", "Stazzema")\n'
          tail_new = '    if not mobile:\n        assert_town_history(page, base)\n    assert_town_missing_metrics(page, base, "massarosa", "Massarosa")\n    assert_town_missing_metrics(page, base, "stazzema", "Stazzema")\n'
          if tail_new not in text:
              if tail_marker not in text:
                  raise RuntimeError('Browser town-history insertion marker missing')
              text = text.replace(tail_marker, tail_new, 1)
          browser.write_text(text, encoding='utf-8')

          workflow = root / '.github/workflows/fix-cultura-production-bundle-cache-once.yml'
          workflow.unlink()
          PY

      - name: Commit production cache repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_static_brand.py scripts/test_catalog_release_v116.py scripts/test_cultura_history_cache_v121.py scripts/test_cultura_biblioteche_v121_browser.py .github/workflows/fix-cultura-production-bundle-cache-once.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix Cultura history production bundle cache"
          git push origin HEAD:feat/cultura-biblioteche
