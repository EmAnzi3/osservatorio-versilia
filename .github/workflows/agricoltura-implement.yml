name: Agricoltura · artifact di collaudo

on:
  push:
    branches: ["feat/agricoltura-territorio"]

permissions:
  contents: write

concurrency:
  group: agricoltura-preview-artifact
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Apply review corrections and materialize
        run: |
          set -euo pipefail
          python scripts/prepatch_agricoltura_href.py
          python scripts/fix_agricoltura_review_v120_v2.py
          python scripts/materialize_agricoltura_territorio_v120.py
          python scripts/patch_agricoltura_release_v120.py
          python scripts/materialize_agricoltura_territorio_v120.py

      - name: Verify agriculture lot
        run: |
          set -euo pipefail
          python -m json.tool data/site-data.json >/dev/null
          python -m json.tool data/source-registry.json >/dev/null
          python -m json.tool data/source-snapshots/istat-agricoltura-territorio-2020.json >/dev/null
          python scripts/test_agricoltura_territorio_v120.py
          python scripts/finalize_catalog_release.py --check
          python scripts/test_catalog_release_v116.py
          python scripts/test_site_consistency.py --source-only

      - name: Build preview and regression checks
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          node --check dist/assets/app-bundle.js
          node --check dist/assets/visual-grammar.js
          python scripts/test_indicator_pages.py
          python scripts/test_composite_indicators.py
          python scripts/test_static.py
          if grep -R "comuni/undefined" dist --include='*.html' --include='*.js'; then
            echo "Trovato hyperlink comunale undefined"
            exit 1
          fi
          grep -q "Olive da tavola" dist/data/site-data.json
          grep -q "Media semplice dei" dist/assets/visual-grammar.js

      - name: Commit verified corrections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-parts/01.txt assets/app-parts/03.txt assets/visual-grammar.js assets/chart-surfaces.css data/site-data.json data/source-registry.json data/source-snapshots/istat-agricoltura-territorio-2020.json scripts/materialize_agricoltura_territorio_v120.py scripts/test_agricoltura_territorio_v120.py README.md docs/coerenza-interfaccia.md docs/copertura-serie-storiche.md service-worker.js assets/app.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(agricoltura): recepisci feedback collaudo PR114"
            git push origin HEAD:feat/agricoltura-territorio
          fi

      - name: Package preview
        run: |
          cd dist
          zip -qr ../osservatorio-versilia-agricoltura-pr114-review2.zip .

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-agricoltura-pr114-review2
          path: osservatorio-versilia-agricoltura-pr114-review2.zip
          if-no-files-found: error
          retention-days: 7
