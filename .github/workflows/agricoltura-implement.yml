name: Agricoltura · artifact di collaudo

on:
  push:
    branches: ["feat/agricoltura-territorio"]

permissions:
  contents: read

concurrency:
  group: agricoltura-preview-artifact
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Verify agriculture lot
        run: |
          set -euo pipefail
          python -m json.tool data/site-data.json >/dev/null
          python -m json.tool data/source-registry.json >/dev/null
          python -m json.tool data/source-snapshots/istat-agricoltura-territorio-2020.json >/dev/null
          python scripts/test_agricoltura_territorio_v120.py
          python scripts/finalize_catalog_release.py --check
          python scripts/test_catalog_release_v116.py
          python scripts/test_site_consistency.py --source-only

      - name: Build preview
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          node --check dist/assets/app-bundle.js
          python scripts/test_indicator_pages.py
          python scripts/test_composite_indicators.py
          python scripts/test_static.py

      - name: Package preview
        run: |
          cd dist
          zip -qr ../osservatorio-versilia-agricoltura-pr114.zip .

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-agricoltura-pr114
          path: osservatorio-versilia-agricoltura-pr114.zip
          if-no-files-found: error
          retention-days: 7
