name: Territorio v1.37 semantic town panel anchors

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace brittle town panel signatures
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/patch_territorio_v137_runtime.py')
          s = p.read_text(encoding='utf-8')

          def replace_span(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker non trovato')
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{label}: end marker non trovato')
              return text[:start] + replacement + text[end:]

          over_start = '''    app03 = replace_once(
                  app03,
                  "    const panelOverline ='''
          title_start = '''    app03 = replace_once(
                  app03,
                  "    const panelTitle ='''
          option_start = '''    app03 = replace_once(
                  app03,
                  "${options.map'''

          over_block = '''    app03 = replace_once(
                  app03,
                  ": hydroRisk ? 'Matrice ufficiale ISPRA' : composite ?",
                  ": territoryProfile ? 'Letture territoriali' : hydroRisk ? 'Matrice ufficiale ISPRA' : composite ?",
                  "overline territorio comunale",
              )
          '''
          s = replace_span(s, over_start, title_start, over_block, 'overline')

          title_block = '''    app03 = replace_once(
                  app03,
                  ": hydroRisk ? `Territorio e residenti · ${html(metric.meta.year)}` : composite ?",
                  ": territoryProfile ? `${html(metric.meta.label)} · ${html(metric.meta.year)}` : hydroRisk ? `Territorio e residenti · ${html(metric.meta.year)}` : composite ?",
                  "titolo pannello territorio comunale",
              )
          '''
          s = replace_span(s, title_start, option_start, title_block, 'panel title')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile runtime patch
        run: python -m py_compile scripts/patch_territorio_v137_runtime.py
      - name: Commit semantic anchors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/patch_territorio_v137_runtime.py
          git commit -m 'fix(territorio): use semantic town panel anchors'
          git push origin HEAD:draft/territorio-indicatori-v137
