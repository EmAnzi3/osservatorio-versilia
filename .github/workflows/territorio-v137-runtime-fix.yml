name: Territorio v1.37 correct km formatter cardinality

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set exact formatter cardinalities
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_territorio_v137_runtime.py')
          s = p.read_text(encoding='utf-8')
          old = '''    app00 = replace_exact_count(
                  app00,
                  "      case 'km': return `${number2.format(v)} km`;\\n",
                  "      case 'km': return `${number2.format(v)} km`;\\n"
                  "      case 'km_per_km2': return `${number2.format(v)} km/km²`;\\n",
                  2,
                  "formatter densita lineare",
              )
          '''
          new = '''    app00 = replace_exact_count(
                  app00,
                  "      case 'km': return `${number2.format(v)} km`;\\n",
                  "      case 'km': return `${number2.format(v)} km`;\\n"
                  "      case 'km_per_km2': return `${number2.format(v)} km/km²`;\\n",
                  1,
                  "formatter densita lineare",
              )
          '''
          if s.count(old) != 1:
              raise SystemExit(f'blocco km 2→1 atteso 1, trovato {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile runtime patch
        run: python -m py_compile scripts/patch_territorio_v137_runtime.py
      - name: Commit formatter cardinality
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/patch_territorio_v137_runtime.py
          git commit -m 'fix(territorio): set formatter cardinalities 2/1'
          git push origin HEAD:draft/territorio-indicatori-v137
