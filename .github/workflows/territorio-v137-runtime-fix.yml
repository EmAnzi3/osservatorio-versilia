name: Territorio v1.37 align runtime after fragilita

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align town flag to post-fragilita renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_territorio_v137_runtime.py')
          s=p.read_text(encoding='utf-8')
          old='''    app03 = replace_once(
                  app03,
                  "    const securityMeasures = ['securityMeasures','agricultureProfile','financialProfile'].includes(metric.meta.compositeType);\\n",
                  "    const securityMeasures = ['securityMeasures','agricultureProfile','financialProfile'].includes(metric.meta.compositeType);\\n"
                  "    const territoryProfile = isTerritoryProfileType(metric);\\n",
                  "flag profilo territorio comunale",
              )
          '''
          new='''    app03 = replace_once(
                  app03,
                  "    const hydroRisk = metric.meta.compositeType === 'hydroRisk';\\n",
                  "    const hydroRisk = metric.meta.compositeType === 'hydroRisk';\\n"
                  "    const territoryProfile = isTerritoryProfileType(metric);\\n",
                  "flag profilo territorio comunale post-fragilita",
              )
          '''
          if s.count(old) != 1:
              raise SystemExit(f'blocco flag atteso 1, trovato {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Compile runtime patch
        run: python -m py_compile scripts/patch_territorio_v137_runtime.py
      - name: Commit runtime alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/patch_territorio_v137_runtime.py
          git commit -m 'fix(territorio): anchor town profile after hydroRisk'
          git push origin HEAD:draft/territorio-indicatori-v137
