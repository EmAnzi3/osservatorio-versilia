name: Territorio v1.37 align runtime after fragilita

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align runtime patch
        run: python scripts/apply_territorio_v137_runtime_post_fragilita.py
      - name: Compile runtime patch
        run: python -m py_compile scripts/patch_territorio_v137_runtime.py
      - name: Commit runtime alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/patch_territorio_v137_runtime.py
          git commit -m 'fix(territorio): align v1.37 runtime after fragilita'
          git push origin HEAD:draft/territorio-indicatori-v137
