name: Explore LIA official sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Inspect official pages
        run: python scripts/explore_lia_sources.py
      - name: Inspect Istat section census package
        run: python scripts/inspect_istat_sections_zip.py
      - name: Upload exploration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lia-source-exploration
          path: source-exploration
          retention-days: 7
