name: Explore LIA official sources

on:
  push:
    branches: ["expansion/lavoro-istruzione-abitare"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Inspect official sources
        run: python scripts/explore_lia_sources.py
      - name: Upload exploration artifact
        uses: actions/upload-artifact@v4
        with:
          name: lia-source-exploration
          path: source-exploration
          retention-days: 7
