name: Controllo frequente fonti

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/source-monitor-light.yml"
      - "scripts/source_monitor_runner.py"
      - "scripts/materialize_source_monitor_snapshot.py"
      - "scripts/monthly_data_check.py"
      - "scripts/monthly_data_check_coverage.py"
      - "scripts/monthly_data_check_status.py"
      - "scripts/source_policy.py"
      - "scripts/test_source_monitor_depth.py"
      - "ci/build-materialization-contract.json"
      - "data/source-registry.json"
      - "data/source-monitor-state.json"
      - "data/site-data.json"

permissions:
  contents: read

concurrency:
  group: source-monitor-light
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      MONITOR_RUN_TRIGGER: ${{ github.event_name }}
      MONITOR_PUBLIC_DIR: /tmp/ov-source-monitor-public-light

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run light monitor unit tests
        run: |
          python scripts/test_source_monitor_depth.py
          python -m py_compile \
            scripts/source_monitor_runner.py \
            scripts/test_source_monitor_depth.py \
            scripts/materialize_source_monitor_snapshot.py

      - name: Materialize effective public catalog for monitor
        run: |
          rm -rf "$MONITOR_PUBLIC_DIR"
          python scripts/materialize_source_monitor_snapshot.py \
            --output-dir "$MONITOR_PUBLIC_DIR"

      - name: Prepare light check
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MODE="live"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            MODE="offline"
          fi
          RUN_STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          mkdir -p reports/runtime
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "run_stamp=$RUN_STAMP" >> "$GITHUB_OUTPUT"

      - name: Run light source monitor
        id: monitor
        run: |
          python scripts/source_monitor_runner.py \
            --depth light \
            --mode "${{ steps.prepare.outputs.mode }}" \
            --data "$MONITOR_PUBLIC_DIR/site-data.json" \
            --registry "$MONITOR_PUBLIC_DIR/source-registry.json" \
            --state data/source-monitor-state.json \
            --report-md "reports/runtime/source-monitor-light-${{ steps.prepare.outputs.run_stamp }}.md" \
            --report-json "reports/runtime/source-monitor-light-${{ steps.prepare.outputs.run_stamp }}.json" \
            --next-state "reports/runtime/source-monitor-light-state.next.json"

      - name: Upload light report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-monitor-light-${{ steps.prepare.outputs.run_stamp }}
          path: reports/runtime/
          retention-days: 30

      - name: Fail on structural errors
        if: steps.monitor.outputs.status == 'attention_required'
        run: |
          echo "Il catalogo pubblico non supera i controlli strutturali del monitor leggero."
          exit 1
