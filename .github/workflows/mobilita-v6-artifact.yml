name: Mobilità v6 - artifact audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_mobilita_v6.py'
      - '.github/workflows/mobilita-v6-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-mobilita:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl pyshp shapely pyproj

      - name: Generate mobility audit artifact
        run: |
          python scripts/audit_mobilita_v6.py --output artifacts/mobilita-v6-review

      - name: Show audit summary
        if: always()
        run: |
          if [ -f artifacts/mobilita-v6-review/audit.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/mobilita-v6-review/audit.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          print('serviceDate:', d['serviceDate'])
          print('Istat 2023 coverage:', sum(v['status']=='ok' for v in d['istat']['years']['2023'].values()), '/7')
          print('TPL coverage:', sum(v['status']=='ok' for v in d['gtfs']['combined'].values()), '/7')
          for town, row in d['gtfs']['combined'].items():
              print(town, row['status'], row['trips'], row['tripsPer1000'])
          PY
          fi

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilita-v6-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/mobilita-v6-review/
          if-no-files-found: warn
          retention-days: 14
