name: Repair Cultura current-history switch once

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  repair-switch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch cache and browser contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          build = Path('scripts/build_static_safe.py')
          text = build.read_text(encoding='utf-8')
          text = text.replace('HISTORY_ASSET_VERSION = "20260827-v121-history-ui4"', 'HISTORY_ASSET_VERSION = "20260827-v121-history-ui5"')
          build.write_text(text, encoding='utf-8')

          cache = Path('scripts/test_cultura_history_cache_v121.py')
          text = cache.read_text(encoding='utf-8')
          text = text.replace('HISTORY_ASSET_VERSION = "20260827-v121-history-ui4"', 'HISTORY_ASSET_VERSION = "20260827-v121-history-ui5"')
          text = text.replace("const HOTFIX_VERSION = '20260827-v121-history-ui4';", "const HOTFIX_VERSION = '20260827-v121-history-ui5';")
          if 'Lo switch Attuale/Storico Cultura deve essere ricostruito' not in text:
              text += '''\nassert "toolkit.viewShellMarkup(currentMarkup, historyMarkup, true, note)" in UX_HISTORY, "Lo switch Attuale/Storico Cultura deve essere ricostruito nel confronto"\nassert "toolkit.viewShellMarkup(currentMarkup, historyMarkup, historyAvailable, note)" in UX_HISTORY, "Lo switch Attuale/Storico Cultura deve essere ricostruito nelle schede comunali"\n'''
          cache.write_text(text, encoding='utf-8')

          browser = Path('scripts/test_cultura_biblioteche_v121_browser.py')
          text = browser.read_text(encoding='utf-8')
          old_town = '''        chart = topic.locator(".history-panel .trend-chart")\n        assert chart.count() == 1, f"Camaiore/{key}: grafico storico non renderizzato"\n        assert chart.locator("svg").count() == 1, f"Camaiore/{key}: SVG storico assente"\n        assert topic.locator(".history-panel .ux-view-shell").count() == 0, f"Camaiore/{key}: enhancer 7/7 ha sovrascritto lo storico parziale"\n        assert topic.locator(".history-panel .comparison-bars").count() == 0, f"Camaiore/{key}: fallback confronto mostrato al posto dello storico"\n'''
          new_town = '''        shell = topic.locator(".history-panel .ux-view-shell")\n        assert shell.count() == 1, f"Camaiore/{key}: switch Attuale/Storico assente"\n        current_button = shell.locator('button[data-view-mode="current"]')\n        history_button = shell.locator('button[data-view-mode="history"]')\n        assert current_button.count() == 1 and history_button.count() == 1, f"Camaiore/{key}: toggle incompleto"\n        assert not history_button.is_disabled(), f"Camaiore/{key}: Storico disabilitato nonostante la serie disponibile"\n        history_button.click()\n        page.wait_for_timeout(120)\n        history_pane = shell.locator('[data-view-pane="history"]')\n        assert history_pane.is_visible(), f"Camaiore/{key}: pannello Storico non visibile dopo click"\n        chart = history_pane.locator(".trend-chart")\n        assert chart.count() == 1 and chart.locator("svg").count() == 1, f"Camaiore/{key}: grafico storico non renderizzato"\n        current_button.click()\n        page.wait_for_timeout(80)\n        assert shell.locator('[data-view-pane="current"] .ux-comparison-bars').count() == 1, f"Camaiore/{key}: vista Valore attuale assente"\n'''
          assert old_town in text, 'Blocco town-history precedente non trovato'
          text = text.replace(old_town, new_town, 1)

          old_compare = '''        assert_missing_rows(page.locator("#compare-bars .bar-row"), key)\n        history = page.locator(".library-history-detail")\n        assert history.count() == 1, f"{key}: storico completo non visibile nel confronto"\n        history_text = history.inner_text()\n'''
          new_compare = '''        shell = page.locator("#compare-bars > .ux-view-shell")\n        assert shell.count() == 1, f"{key}: switch Attuale/Storico assente nel confronto"\n        current_button = shell.locator('button[data-view-mode="current"]')\n        history_button = shell.locator('button[data-view-mode="history"]')\n        assert current_button.count() == 1 and history_button.count() == 1, f"{key}: toggle confronto incompleto"\n        assert not history_button.is_disabled(), f"{key}: Storico disabilitato nel confronto"\n        current_pane = shell.locator('[data-view-pane="current"]')\n        assert current_pane.is_visible(), f"{key}: Valore attuale non visibile inizialmente"\n        assert_missing_rows(current_pane.locator(".bar-row"), key)\n        history_button.click()\n        page.wait_for_timeout(120)\n        history_pane = shell.locator('[data-view-pane="history"]')\n        assert history_pane.is_visible(), f"{key}: Storico non visibile dopo click"\n        history = history_pane.locator(".library-history-detail")\n        assert history.count() == 1, f"{key}: storico completo non visibile nel pannello Storico"\n        history_text = history.inner_text()\n'''
          assert old_compare in text, 'Blocco compare-history precedente non trovato'
          text = text.replace(old_compare, new_compare, 1)
          text = text.replace('''        else:\n            assert "2022" in history_text and "2024" in history_text and "2021" not in history_text\n''', '''        else:\n            assert "2022" in history_text and "2024" in history_text and "2021" not in history_text\n        current_button.click()\n        page.wait_for_timeout(80)\n        assert current_pane.is_visible(), f"{key}: ritorno a Valore attuale non riuscito"\n''', 1)
          browser.write_text(text, encoding='utf-8')
          PY
          node --check assets/ux-history.js
          python -m py_compile scripts/test_cultura_biblioteche_v121_browser.py scripts/test_cultura_history_cache_v121.py scripts/build_static_safe.py
          python scripts/test_cultura_history_cache_v121.py

      - name: Commit switch repair
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_static_safe.py scripts/test_cultura_biblioteche_v121_browser.py scripts/test_cultura_history_cache_v121.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore Cultura current-history switch"
          git push origin HEAD:"$BRANCH"
