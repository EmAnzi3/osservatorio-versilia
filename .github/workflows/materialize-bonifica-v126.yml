name: Materialize Bonifica v1.26.0

on:
  push:
    branches: ["feat/bonifica-rischio-v126"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/bonifica-rischio-v126
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GIS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "geopandas==1.0.1" "pyogrio==0.10.0"

      - name: Materialize GIS support
        run: |
          python scripts/materialize_bonifica_gis_v126.py
          python -m json.tool data/source-snapshots/bonifica-rischio-v126-gis.json > /dev/null

      - name: Materialize canonical Lotto 6 data
        run: |
          python scripts/materialize_bonifica_rischio_v126.py
          python scripts/bump_release_cache_v126.py
          python scripts/finalize_catalog_release.py --check
          python scripts/test_catalog_release_v116.py
          python -m json.tool data/source-snapshots/bonifica-rischio-v126.json > /dev/null

      - name: Commit generated canonical files
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-snapshots/bonifica-rischio-v126-gis.json data/site-data.json data/source-registry.json data/source-monitor-state.json assets/app-parts/00.txt assets/app-parts/05.txt assets/app.js assets/export-v161.js assets/ux-history.js service-worker.js scripts/build_static_safe.py scripts/build_static_brand.py
          git commit -m "Materialize Bonifica v1.26.0"
          git push origin HEAD:feat/bonifica-rischio-v126
