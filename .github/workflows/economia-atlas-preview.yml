name: Economia Atlas Preview

on:
  pull_request:
    branches: ["main"]
    paths:
      - "assets/economy-atlas-src/**"
      - "confronta/economia/atlante-attivita-economiche/**"
      - "data/economy-atlas/**"
      - "scripts/economy-atlas-materializer-src/**"
      - "scripts/economy-atlas-test-src/**"
      - "scripts/materialize_economy_atlas_release.py"
      - "scripts/refine_economy_atlas_release.py"
      - "scripts/refine_economy_atlas_tooltips.py"
      - "scripts/refine_economy_atlas_exports.py"
      - "scripts/prepare_economy_atlas_build.py"
      - "scripts/test_economy_atlas_browser.py"
      - "scripts/run_economy_atlas_browser_contract.py"
      - ".github/workflows/economia-atlas-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Prepare static builder
        run: python scripts/prepare_economy_atlas_build.py

      - name: Materialize Economia Atlas release workspace
        run: python scripts/materialize_economy_atlas_release.py

      - name: Refine Atlas territory UX
        run: python scripts/refine_economy_atlas_release.py

      - name: Align Atlas tooltips with OV
        run: python scripts/refine_economy_atlas_tooltips.py

      - name: Add Atlas export actions
        run: python scripts/refine_economy_atlas_exports.py

      - name: Validate Atlas sources
        run: |
          node --check assets/economy-atlas.js
          python -m py_compile scripts/materialize_economy_atlas_release.py scripts/refine_economy_atlas_release.py scripts/refine_economy_atlas_tooltips.py scripts/refine_economy_atlas_exports.py scripts/prepare_economy_atlas_build.py scripts/test_economy_atlas_browser.py scripts/run_economy_atlas_browser_contract.py

      - name: Build review artifact
        run: python scripts/build_static_brand.py

      - name: Validate Atlas in browser
        run: |
          mkdir -p reports/economia-atlas-browser
          python scripts/run_economy_atlas_browser_contract.py \
            --directory dist \
            --screenshots-dir reports/economia-atlas-browser

      - name: Package review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economia-atlas-preview
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/
            reports/economia-atlas-browser/
