name: Probe RGS formazione

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API tooling
        run: python -m pip install playwright

      - name: Inspect official RGS formazione API
        continue-on-error: true
        run: python scripts/probe_rgs_formazione_browser.py
