name: Probe RGS formazione

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect official RGS formazione page
        continue-on-error: true
        run: python scripts/probe_rgs_formazione_browser.py

      - name: Upload probe screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgs-formazione-probe
          path: rgs-formazione-probe.png
          if-no-files-found: ignore
          retention-days: 2
