name: TEMP PR125 finalize

on:
  push:
    branches: ["automation/data-check-2026-08"]
    paths:
      - ".github/workflows/temp-pr125-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch monitor semantics
        run: python scripts/temp_pr125_finalize.py

      - name: Unit tests before live update
        run: |
          python -m py_compile scripts/monitor_semantic_checks.py scripts/monthly_data_check.py scripts/monthly_data_check_status.py
          python scripts/test_monthly_data_check.py

      - name: Materialize verified MIMIT 2026-08-28
        run: |
          mkdir -p reports/runtime
          python scripts/update_fuel_prices_mimit.py | tee reports/runtime/fuel-update.txt
          grep -q '"referenceDate": "2026-08-28"' reports/runtime/fuel-update.txt

      - name: Regenerate monthly monitor on current catalog
        run: |
          python scripts/monthly_data_check_status.py \
            --data data/site-data.json \
            --registry data/source-registry.json \
            --state data/source-monitor-state.json \
            --report-md reports/data-checks/2026-08.md \
            --report-json reports/runtime/data-check.json \
            --next-state reports/runtime/source-monitor-state.next.json \
            --mode live
          cp reports/runtime/source-monitor-state.next.json data/source-monitor-state.json
          cat reports/data-checks/2026-08.md

      - name: Regression tests after update
        run: |
          python scripts/test_monthly_data_check.py
          python scripts/audit_fuel_prices_mimit.py --out reports/runtime/fuel-verified.json
          python -m json.tool data/site-data.json >/dev/null
          python -m json.tool data/source-registry.json >/dev/null
          python -m json.tool data/source-monitor-state.json >/dev/null

      - name: Commit final PR125 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/monitor_semantic_checks.py \
            scripts/monthly_data_check.py \
            scripts/monthly_data_check_status.py \
            scripts/test_monthly_data_check.py \
            data/source-registry.json \
            data/site-data.json \
            data/source-snapshots/costi-fiscalita-validated-2026-08.json \
            data/source-monitor-state.json \
            reports/data-checks/2026-08.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Verifica segnali monitor e aggiorna carburanti al 28 agosto"
          git push origin HEAD:automation/data-check-2026-08
