name: Diagnose SIOPE 2025

on:
  pull_request:
    branches: ["main", "expansion/lavoro-istruzione-abitare"]

permissions:
  contents: read

concurrency:
  group: siope-2025-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data tooling
        run: python -m pip install requests

      - name: Materialize reviewed SIOPE sources
        run: python scripts/materialize_siope_sources.py

      - name: Install current SIOPE parser corrections
        run: python scripts/patch_siope_builder_download.py

      - name: Materialize verified SIOPE 2019-2025 manifest
        run: python scripts/discover_siope_resources.py

      - name: Compare all published and reconstructed 2025 values
        run: python scripts/diagnose_siope_2025.py

