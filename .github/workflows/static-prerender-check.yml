name: Validate static prerender

on:
  push:
    branches: ["refactor/static-prerender"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Apply local v1.2 dataset
        if: github.head_ref == 'expansion/v1-1-local' || github.ref_name == 'expansion/v1-1-local'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_v12_local_data.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'base64.b64decode(PAYLOAD)',
              'base64.b64decode(PAYLOAD + "=" * (-len(PAYLOAD) % 4))',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/apply_v12_local_data.py

      - name: Apply local v1.2 UI
        if: github.head_ref == 'expansion/v1-1-local' || github.ref_name == 'expansion/v1-1-local'
        run: python scripts/apply_v12_local_ui.py

      - name: Build pre-rendered site
        run: python scripts/build_static_safe.py

      - name: Run regression tests
        run: python scripts/test_static.py

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-static-preview
          path: dist
          retention-days: 7

# Deliberately no deploy-pages job: this workflow cannot publish the site.
