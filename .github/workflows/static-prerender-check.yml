name: Validate static prerender

on:
  push:
    branches: ["refactor/static-prerender"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build pre-rendered site
        run: python scripts/build_static_safe.py

      - name: Run regression tests
        run: python scripts/test_static.py

      - name: Run v1.4.0 LIA checks
        run: python scripts/test_release_v140.py

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-static-preview
          path: dist
          retention-days: 7

# Deliberately no deploy-pages job: this workflow validates PRs but cannot publish the site.
