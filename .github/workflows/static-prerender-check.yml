name: Inspect population series

on:
  pull_request:
    branches: ["main", "expansion/lavoro-istruzione-abitare"]

permissions:
  contents: read

concurrency:
  group: population-series-inspection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect annual population data
        run: python scripts/inspect_population_data.py

# Temporary read-only inspection: no commit, deploy, merge or main write.
