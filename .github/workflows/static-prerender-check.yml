name: Compile SIOPE builder

on:
  pull_request:
    branches: ["main", "expansion/lavoro-istruzione-abitare"]

permissions:
  contents: read

concurrency:
  group: siope-builder-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python scripts/materialize_siope_sources.py
      - run: python scripts/patch_siope_builder_download.py
      - run: python -m py_compile scripts/build_siope_history.py scripts/test_siope_history_v160.py scripts/apply_history_series_v160.py

# Temporary compile-only check: no commit, deploy, merge or main write.
