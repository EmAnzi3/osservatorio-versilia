name: Validate static prerender

on:
  push:
    branches: ["refactor/static-prerender"]
  pull_request:
    branches: ["main", "expansion/lavoro-istruzione-abitare"]

permissions:
  contents: write

concurrency:
  group: static-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract-openbdap-history:
    if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data tooling
        run: python -m pip install requests

      - name: Restore validated OpenBDAP archives
        id: openbdap-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/openbdap
          key: openbdap-toscana-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openbdap-toscana-${{ runner.os }}-

      - name: Bound CI network retries
        run: python scripts/prepare_openbdap_fast_retry.py

      - name: Expand the validated OpenBDAP snapshot
        run: python scripts/expand_bilanci_history_v160.py

      - name: Preserve the validated historical snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bilanci-openbdap-history-snapshot-${{ runner.os }}
          path: data/source-snapshots/bilanci-v1.6.0.json
          if-no-files-found: error
          retention-days: 7

      - name: Save validated or partial OpenBDAP archive cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/openbdap
          key: openbdap-toscana-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  build-and-test:
    if: ${{ always() && github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
    needs: extract-openbdap-history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160
          fetch-depth: 0

      - name: Download successful historical snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: bilanci-openbdap-history-snapshot-*
          path: .history-artifacts

      - name: Select one fully validated snapshot deterministically
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('.history-artifacts')
          candidates = [
              root / 'bilanci-openbdap-history-snapshot-Linux' / 'bilanci-v1.6.0.json',
              root / 'bilanci-openbdap-history-snapshot-Windows' / 'bilanci-v1.6.0.json',
              root / 'bilanci-openbdap-history-snapshot-macOS' / 'bilanci-v1.6.0.json',
          ]
          source = next((item for item in candidates if item.exists()), None)
          if source is None:
              raise SystemExit('Nessun runner ha prodotto uno snapshot OpenBDAP completo e validato')
          target = Path('data/source-snapshots/bilanci-v1.6.0.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, target)
          print(f'Snapshot selezionato: {source}')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Materialize Bilanci theme
        run: python scripts/update_bilanci_v160.py

      - name: Apply validated histories
        run: python scripts/apply_history_series_v160.py

      - name: Keep v1.5 checks compatible with explicit historical coverage
        run: python scripts/patch_v150_history_compat.py

      - name: Build pre-rendered site
        run: python scripts/build_static_safe.py

      - name: Run regression tests
        run: python scripts/test_static.py

      - name: Run v1.5.0 regional indicator checks
        run: python scripts/test_release_v150.py

      - name: Run v1.6.0 budget checks
        run: python scripts/test_release_v160.py

      - name: Run accordion and history browser checks
        run: python scripts/test_ux_experiment.py

      - name: Commit validated generated files to the experimental branch
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data docs scripts README.md
          git commit -m "Materializza serie storiche OpenBDAP validate"
          git push origin HEAD:expansion/bilanci-comunali-v160

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-v160-history-preview
          path: dist
          if-no-files-found: error
          retention-days: 7

# Private validation only: no deploy-pages action, no merge and no change to main.
