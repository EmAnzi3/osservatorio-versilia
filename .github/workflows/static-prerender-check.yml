name: Inspect SIOPE builder

on:
  pull_request:
    branches: ["main", "expansion/lavoro-istruzione-abitare"]

permissions:
  contents: read

concurrency:
  group: siope-builder-inspection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data tooling
        run: python -m pip install requests

      - name: Materialize reviewed SIOPE sources
        run: python scripts/materialize_siope_sources.py

      - name: Apply current parser corrections
        run: python scripts/patch_siope_builder_download.py

      - name: Inspect builder main contract
        run: python scripts/inspect_siope_main.py

# Temporary read-only inspection: no commit, deploy, merge or main write.
