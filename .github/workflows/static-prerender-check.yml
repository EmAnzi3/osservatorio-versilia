name: Validate static prerender

on:
  push:
    branches: ["refactor/static-prerender"]
  pull_request:
    branches: ["main", "expansion/lavoro-istruzione-abitare"]

permissions:
  contents: write

concurrency:
  group: static-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and data tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Inspect official SIOPE catalogue resources
        if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
        continue-on-error: true
        run: python scripts/discover_siope_resources.py

      - name: Expand the validated OpenBDAP snapshot with full historical coverage
        if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
        run: python scripts/expand_bilanci_history_v160.py

      - name: Materialize Bilanci theme
        if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
        run: python scripts/update_bilanci_v160.py

      - name: Apply validated histories
        if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
        run: python scripts/apply_history_series_v160.py

      - name: Keep v1.5 checks compatible with explicit historical coverage
        if: ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160' }}
        run: python scripts/patch_v150_history_compat.py

      - name: Build pre-rendered site
        run: python scripts/build_static_safe.py

      - name: Run regression tests
        run: python scripts/test_static.py

      - name: Run v1.5.0 regional indicator checks
        run: python scripts/test_release_v150.py

      - name: Run v1.6.0 budget checks
        run: python scripts/test_release_v160.py

      - name: Run accordion and history checks
        run: python scripts/test_ux_experiment.py

      - name: Commit validated generated files to the experimental branch
        if: >-
          ${{ github.event.pull_request.head.ref == 'expansion/bilanci-comunali-v160'
              && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data docs scripts README.md
          git commit -m "Materializza serie storiche OpenBDAP validate"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-static-preview
          path: dist
          retention-days: 7

# This workflow validates and materializes only the experimental PR branch.
# It contains no deploy-pages step and cannot merge the pull request.
