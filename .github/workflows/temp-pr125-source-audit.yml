name: TEMP PR125 source audit

on:
  push:
    branches: ["automation/data-check-2026-08"]
    paths:
      - ".github/workflows/temp-pr125-source-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit MIMIT carburanti
        shell: bash
        run: |
          mkdir -p reports/runtime
          python scripts/audit_fuel_prices_mimit.py > reports/runtime/fuel-mimit.json
          cat reports/runtime/fuel-mimit.json

      - name: Audit semantico ARS 1290
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, urllib.request, zipfile
          from pathlib import Path

          url = "https://www.ars.toscana.it/banche-dati/actions/esporta.php?indicatore=1290"
          snapshot_path = Path("data/source-snapshots/ars-life-expectancy-1290-2008-2022.json")
          snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
          geographies = snapshot["scope"]["geographies"]
          wanted = {str(meta["arsCode"]): key for key, meta in geographies.items()}
          sexes = set(snapshot["scope"]["sexes"])
          years = [int(y) for y in snapshot["scope"]["years"]]

          req = urllib.request.Request(url, headers={
              "User-Agent": "OsservatorioVersilia-source-audit/1.1 (+https://osservatorioversilia.it/)",
              "Accept-Language": "it-IT,it;q=0.9,en;q=0.5",
          })
          with urllib.request.urlopen(req, timeout=120) as response:
              outer = response.read()
          with zipfile.ZipFile(io.BytesIO(outer)) as archive:
              csv_name = next(name for name in archive.namelist() if name.lower().endswith(".csv"))
              raw = archive.read(csv_name)
          text = raw.decode("utf-8-sig")
          try:
              delimiter = csv.Sniffer().sniff(text[:30000], delimiters=",;\t|").delimiter
          except csv.Error:
              delimiter = ","
          reader = csv.DictReader(io.StringIO(text), delimiter=delimiter)
          matrix = {key: {sex: {} for sex in sexes} for key in geographies}
          all_years = set()
          for row in reader:
              if str(row.get("id_indicatore") or "").strip() != "1290":
                  continue
              code = str(row.get("codice_geografia") or "").strip()
              sex = str(row.get("sesso") or "").strip().lower()
              if code not in wanted or sex not in sexes:
                  continue
              try:
                  year = int(row.get("anno") or 0)
              except ValueError:
                  continue
              raw_value = str(row.get("misura_grezza") or "").strip()
              if not raw_value:
                  continue
              if "," in raw_value and "." in raw_value:
                  raw_value = raw_value.replace(".", "").replace(",", ".")
              elif "," in raw_value:
                  raw_value = raw_value.replace(",", ".")
              matrix[wanted[code]][sex][year] = float(raw_value)
              all_years.add(year)

          revisions = []
          for geo in geographies:
              for sex in sexes:
                  old_values = snapshot["series"][geo][sex]
                  for year, old in zip(years, old_values):
                      new = matrix.get(geo, {}).get(sex, {}).get(year)
                      if new is None or abs(float(old) - float(new)) > 1e-9:
                          revisions.append({"geo": geo, "sex": sex, "year": year, "old": old, "new": new})

          newer = sorted(y for y in all_years if y > max(years))
          result = {
              "zipSha256": hashlib.sha256(outer).hexdigest(),
              "csvSha256": hashlib.sha256(raw).hexdigest(),
              "snapshotCsvSha256": snapshot["source"]["csvSha256"],
              "maxObservedYear": max(all_years) if all_years else None,
              "newYears": newer,
              "historicalRevisionCount": len(revisions),
              "historicalRevisions": revisions[:50],
              "semanticMatchForPublishedYears": not revisions,
          }
          Path("reports/runtime/ars-1290-live.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Retry PNRR Regione Toscana
        shell: bash
        run: |
          curl --fail --location --retry 4 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 360 \
            --user-agent "OsservatorioVersiliaDataMonitor/1.1 (+https://osservatorioversilia.it/)" \
            "https://www301.regione.toscana.it/bancadati/pnrrPerSitoWeb/getOpenData_v6.csv" \
            --output reports/runtime/rt-pnrr-current.csv
          python scripts/pnrr_toscana_snapshot_runner.py \
            --source reports/runtime/rt-pnrr-current.csv \
            --audit-json reports/runtime/pnrr-audit.json \
            --audit-md reports/runtime/pnrr-audit.md \
            --forensic-json reports/runtime/pnrr-forensic.json \
            --forensic-md reports/runtime/pnrr-forensic.md
          cat reports/runtime/pnrr-audit.json

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr125-source-audit
          path: reports/runtime
          if-no-files-found: warn
          retention-days: 2
