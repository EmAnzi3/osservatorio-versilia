name: TEMP PR125 coast monitor fix
on:
  push:
    branches: ["automation/data-check-2026-08"]
    paths: [".github/workflows/temp-pr125-coast-monitor-fix.yml"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply permanent patch
        run: python scripts/temp_pr125_coast_monitor_fix.py
      - name: Regression contracts
        run: |
          python -m py_compile scripts/materialize_costa_mare_v123.py scripts/test_costa_mare_v123.py
          python scripts/test_costa_mare_v123.py
          python scripts/test_monthly_data_check.py
      - name: Prove materializer idempotence
        run: |
          cp data/source-monitor-state.json /tmp/source-monitor-state.before.json
          python scripts/materialize_costa_mare_v123.py
          python scripts/patch_investimenti_versilia.py
          cmp /tmp/source-monitor-state.before.json data/source-monitor-state.json
          git diff --exit-code -- data/site-data.json data/source-registry.json data/source-monitor-state.json
      - name: Commit permanent fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/materialize_costa_mare_v123.py scripts/test_costa_mare_v123.py
          git diff --cached --check
          git commit -m "Preserva lo stato live nel materializzatore Costa"
          git push origin HEAD:automation/data-check-2026-08
