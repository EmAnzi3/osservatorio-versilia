name: A3 Benchmark bulk acquisition

on:
  pull_request:
    branches: ["fix/a3-enrichment-publication-gap"]
  workflow_dispatch:

concurrency:
  group: a3-benchmark-bulk-acquisition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Build effective public catalog once
        env:
          OV_RELEASE_BUILD: "1"
        run: python scripts/build_static_brand.py
      - name: Derive current benchmark backlog
        run: |
          mkdir -p /tmp/a3-bulk-context
          python scripts/enrichment_audit_matrix.py \
            --data dist/data/site-data.json \
            --registry dist/data/source-registry.json \
            --output /tmp/a3-bulk-context/matrix.json \
            --allow-unclassified
          python scripts/enrichment_source_audit.py \
            --matrix /tmp/a3-bulk-context/matrix.json \
            --registry dist/data/source-registry.json \
            --json-output /tmp/a3-bulk-context/source-audit.json
          python scripts/enrichment_backlog.py \
            --matrix /tmp/a3-bulk-context/matrix.json \
            --source-audit /tmp/a3-bulk-context/source-audit.json \
            --json-output /tmp/a3-bulk-context/backlog.json
          cp dist/data/source-registry.json /tmp/a3-bulk-context/source-registry.json
          python scripts/a3_fanout_manifest.py \
            --backlog /tmp/a3-bulk-context/backlog.json \
            --dimension benchmark_toscana_italia \
            --max-profiles 15 \
            --output /tmp/a3-bulk-context/manifest.json \
            --matrix-output /tmp/a3-bulk-context/github-matrix.json
      - id: matrix
        name: Publish 15-worker matrix
        run: echo "matrix=$(cat /tmp/a3-bulk-context/github-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: a3-benchmark-bulk-context
          path: /tmp/a3-bulk-context
          if-no-files-found: error

  acquire:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition dependencies
        run: python -m pip install requests openpyxl
      - uses: actions/download-artifact@v4
        with:
          name: a3-benchmark-bulk-context
          path: /tmp/a3-bulk-context
      - name: Run routed acquisition worker
        run: |
          mkdir -p reports/a3-benchmark-bulk
          python scripts/a3_bulk_acquisition_worker.py \
            --manifest /tmp/a3-bulk-context/manifest.json \
            --registry /tmp/a3-bulk-context/source-registry.json \
            --profile "${{ matrix.profileId }}" \
            --output "reports/a3-benchmark-bulk/${{ matrix.profileId }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: a3-benchmark-bulk-${{ matrix.profileId }}
          path: reports/a3-benchmark-bulk/${{ matrix.profileId }}*.json
          if-no-files-found: error

  fan-in:
    needs: [prepare, acquire]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: a3-benchmark-bulk-*
          path: /tmp/a3-benchmark-bulk
          merge-multiple: true
      - name: Build bulk acquisition summary
        run: |
          mkdir -p reports
          python scripts/a3_bulk_acquisition_summary.py \
            --input-dir /tmp/a3-benchmark-bulk \
            --json-output reports/a3-benchmark-bulk-summary.json \
            --markdown-output reports/A3_BENCHMARK_BULK_SUMMARY.md
      - uses: actions/upload-artifact@v4
        with:
          name: a3-benchmark-bulk-summary
          path: |
            reports/a3-benchmark-bulk-summary.json
            reports/A3_BENCHMARK_BULK_SUMMARY.md
          if-no-files-found: error
