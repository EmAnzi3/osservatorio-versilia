name: Controllo mensile dati

on:
  schedule:
    - cron: "17 5 5 * *"
  workflow_dispatch:
    inputs:
      probe_sources:
        description: "Controlla anche le fonti online"
        required: true
        default: true
        type: boolean
      run_check:
        description: "Esegui davvero il controllo manuale"
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/monthly-data-refresh.yml"
      - "scripts/monthly_data_check.py"
      - "scripts/monthly_data_check_coverage.py"
      - "scripts/monthly_data_check_status.py"
      - "scripts/source_monitor_runner.py"
      - "scripts/source_monitor_strategy.py"
      - "scripts/materialize_source_monitor_snapshot.py"
      - "scripts/build_static_brand.py"
      - "scripts/build_static_brand_impl.py"
      - "scripts/data_status_model.py"
      - "scripts/pnrr_toscana_audit.py"
      - "scripts/source_policy.py"
      - "scripts/test_monthly_data_check.py"
      - "scripts/test_source_monitor_public_partial.py"
      - "scripts/test_source_monitor_depth.py"
      - "scripts/test_source_monitor_strategy.py"
      - "scripts/test_pnrr_toscana_audit.py"
      - "scripts/test_pnrr_status_integration.py"
      - "scripts/restore_partial_agcom_metrics.py"
      - "ci/build-materialization-contract.json"
      - "data/source-registry.json"
      - "data/source-monitor-state.json"
      - "data/site-data.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: monthly-data-refresh
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.run_check == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      MONITOR_RUN_TRIGGER: ${{ github.event_name }}
      MONITOR_PUBLIC_DIR: /tmp/ov-source-monitor-public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize current PNRR Toscana baseline
        run: |
          python scripts/materialize_pnrr_toscana_draft.py
          python scripts/patch_pnrr_toscana_review.py

      - name: Run monitor unit tests
        run: |
          python scripts/test_monthly_data_check.py
          python scripts/test_source_monitor_public_partial.py
          python scripts/test_source_monitor_depth.py
          python scripts/test_source_monitor_strategy.py
          python scripts/test_pnrr_toscana_audit.py
          python scripts/test_pnrr_status_integration.py
          python -m py_compile \
            scripts/monthly_data_check_coverage.py \
            scripts/monthly_data_check_status.py \
            scripts/source_monitor_runner.py \
            scripts/source_monitor_strategy.py \
            scripts/materialize_source_monitor_snapshot.py \
            scripts/test_source_monitor_public_partial.py \
            scripts/test_source_monitor_depth.py \
            scripts/test_source_monitor_strategy.py \
            scripts/data_status_model.py \
            scripts/pnrr_toscana_audit.py \
            scripts/test_pnrr_toscana_audit.py \
            scripts/test_pnrr_status_integration.py

      - name: Materialize effective public catalog for monitor
        run: |
          rm -rf "$MONITOR_PUBLIC_DIR"
          python scripts/materialize_source_monitor_snapshot.py \
            --output-dir "$MONITOR_PUBLIC_DIR"

      - name: Prepare check
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROBE_SOURCES: ${{ github.event.inputs.probe_sources }}
        run: |
          MODE="live"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            MODE="offline"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$PROBE_SOURCES" == "false" ]]; then
            MODE="offline"
          fi
          STAMP="$(date -u +%Y-%m)"
          RUN_STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          mkdir -p reports/runtime
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "run_stamp=$RUN_STAMP" >> "$GITHUB_OUTPUT"

      - name: Validate dataset and check sources
        id: monitor
        run: |
          python scripts/source_monitor_runner.py \
            --depth deep \
            --mode "${{ steps.prepare.outputs.mode }}" \
            --data "$MONITOR_PUBLIC_DIR/site-data.json" \
            --registry "$MONITOR_PUBLIC_DIR/source-registry.json" \
            --state data/source-monitor-state.json \
            --report-md "reports/runtime/data-check-${{ steps.prepare.outputs.run_stamp }}.md" \
            --report-json "reports/runtime/data-check-${{ steps.prepare.outputs.run_stamp }}.json" \
            --next-state "reports/runtime/source-monitor-state.next.json"

      - name: Publish monitor summary
        if: always() && steps.monitor.outputs.report_md != ''
        env:
          REPORT_MD: ${{ steps.monitor.outputs.report_md }}
        run: |
          if [[ -f "$REPORT_MD" ]]; then
            cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-check-${{ steps.prepare.outputs.run_stamp }}
          path: reports/runtime/
          retention-days: 90

      - name: Create or update annual register
        if: github.event_name == 'schedule'
        env:
          REPORT_MD: ${{ steps.monitor.outputs.report_md }}
        run: |
          YEAR="$(date -u +%Y)"
          TITLE="Registro controlli dati $YEAR"
          ISSUE_NUMBER="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$ISSUE_NUMBER" ]]; then
            cat > /tmp/data-check-register.md <<EOF
          @EmAnzi3

          Questa issue raccoglie gli esiti del controllo mensile delle fonti e del dataset di Osservatorio Versilia per il $YEAR.

          - nessun valore viene pubblicato automaticamente;
          - le anomalie bloccano il controllo;
          - il controllo distingue raggiungibilità della fonte e attualità del dato;
          - per i due indicatori PNRR usa anche il feed ufficiale machine-readable di Regione Toscana come verifica del perimetro ReGiS;
          - una PR in bozza viene aperta solo dal controllo mensile programmato quando trova modifiche sostanziali o richiede una baseline;
          - i controlli manuali sono diagnostici e non scrivono nel registro né aprono PR;
          - ogni commento mensile menziona il responsabile del progetto.
          EOF
            ISSUE_URL="$(gh issue create --title "$TITLE" --body-file /tmp/data-check-register.md)"
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$REPORT_MD"

      - name: Open draft PR with current monitoring state
        if: >-
          github.event_name == 'schedule' &&
          steps.prepare.outputs.mode == 'live' &&
          (steps.monitor.outputs.status == 'changes_detected' ||
           steps.monitor.outputs.status == 'baseline_required')
        env:
          REPORT_MD: ${{ steps.monitor.outputs.report_md }}
          NEXT_STATE: ${{ steps.monitor.outputs.next_state }}
          STAMP: ${{ steps.prepare.outputs.stamp }}
          CHECK_STATUS: ${{ steps.monitor.outputs.status }}
        run: |
          BRANCH="automation/data-check-$STAMP"
          REPORT_DEST="reports/data-checks/$STAMP.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          mkdir -p "$(dirname "$REPORT_DEST")"
          cp "$NEXT_STATE" data/source-monitor-state.json
          cp "$REPORT_MD" "$REPORT_DEST"
          git add data/source-monitor-state.json "$REPORT_DEST"
          git commit -m "Registra il controllo dati $STAMP" || true
          git push --force origin "$BRANCH"

          cat > /tmp/data-check-pr.md <<EOF
          ## Stato

          **BOZZA — nessun dato viene pubblicato automaticamente.**

          Il controllo mensile ha restituito: \`$CHECK_STATUS\`.

          Questa PR viene aperta solo dal controllo mensile programmato quando rileva modifiche sostanziali o richiede una baseline. I run \`no_changes\` e i controlli manuali restano diagnostici e non generano una nuova PR.

          Un cambiamento tecnico della fonte non equivale automaticamente a un nuovo rilascio. Per PNRR, una fotografia machine-readable ufficiale Regione Toscana/ReGiS diversa da quella pubblicata genera soltanto \`release_detected\`: l'aggiornamento dei valori richiede acquisizione, validazione e revisione separata prima del merge.

          ---

          $(cat "$REPORT_MD")
          EOF

          PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "Controllo dati $STAMP" \
              --body-file /tmp/data-check-pr.md
          else
            gh pr edit "$PR_NUMBER" \
              --title "Controllo dati $STAMP" \
              --body-file /tmp/data-check-pr.md
          fi

      - name: Fail on structural errors
        if: steps.monitor.outputs.status == 'attention_required'
        run: |
          echo "Il dataset non supera i controlli strutturali. Consultare il rapporto e l'issue annuale."
          exit 1

  fuel-history-backfill:
    name: Fuel history ${{ matrix.period.id }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        period:
          - { id: "2022-q1", start: "2022-01", end: "2022-03" }
          - { id: "2022-q2", start: "2022-04", end: "2022-06" }
          - { id: "2022-q3", start: "2022-07", end: "2022-09" }
          - { id: "2022-q4", start: "2022-10", end: "2022-12" }
          - { id: "2023-q1", start: "2023-01", end: "2023-03" }
          - { id: "2023-q2", start: "2023-04", end: "2023-06" }
          - { id: "2023-q3", start: "2023-07", end: "2023-09" }
          - { id: "2023-q4", start: "2023-10", end: "2023-12" }
          - { id: "2024-q1", start: "2024-01", end: "2024-03" }
          - { id: "2024-q2", start: "2024-04", end: "2024-06" }
          - { id: "2024-q3", start: "2024-07", end: "2024-09" }
          - { id: "2024-q4", start: "2024-10", end: "2024-12" }
          - { id: "2025-q1", start: "2025-01", end: "2025-03" }
          - { id: "2025-q2", start: "2025-04", end: "2025-06" }
          - { id: "2025-q3", start: "2025-07", end: "2025-09" }
          - { id: "2025-q4", start: "2025-10", end: "2025-12" }
          - { id: "2026-q1", start: "2026-01", end: "2026-03" }
          - { id: "2026-q2", start: "2026-04", end: "2026-06" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build quarter
        run: |
          mkdir -p /tmp/fuel-history
          python scripts/backfill_fuel_history_mimit.py \
            --start "${{ matrix.period.start }}" \
            --end "${{ matrix.period.end }}" \
            --output "/tmp/fuel-history/${{ matrix.period.id }}.json"

      - name: Upload quarter
        uses: actions/upload-artifact@v4
        with:
          name: "fuel-history-${{ matrix.period.id }}"
          path: "/tmp/fuel-history/${{ matrix.period.id }}.json"
          if-no-files-found: error
          retention-days: 3

  fuel-history-merge:
    name: Fuel history monthly merge
    if: github.event_name == 'pull_request'
    needs: fuel-history-backfill
    runs-on: ubuntu-latest

    steps:
      - name: Download quarters
        uses: actions/download-artifact@v4
        with:
          pattern: fuel-history-*
          path: /tmp/fuel-parts
          merge-multiple: true

      - name: Merge and validate 54 months
        run: |
          python - <<'PY'
          import calendar
          import json
          from pathlib import Path

          files=sorted(Path('/tmp/fuel-parts').glob('*.json'))
          if len(files) != 18:
              raise SystemExit(f'Attesi 18 trimestri, trovati {len(files)}')

          payloads=[json.loads(path.read_text(encoding='utf-8')) for path in files]
          points=sorted(
              [point for payload in payloads for point in payload.get('points', [])],
              key=lambda point: point['referenceDate'],
          )
          provenance=sorted(
              [item for payload in payloads for item in payload.get('provenance', [])],
              key=lambda item: (item['year'], item['quarter']),
          )

          expected=[]
          year,month=2022,1
          while (year,month) <= (2026,6):
              expected.append(f'{year:04d}-{month:02d}')
              month += 1
              if month == 13:
                  year += 1
                  month = 1

          actual=[point['referenceDate'] for point in points]
          if actual != expected:
              raise SystemExit(f'Serie mensile incompleta o duplicata: {actual}')

          for point in points:
              stazzema=point['towns']['Stazzema']
              if stazzema['benzina'] is not None or stazzema['gasolio'] is not None:
                  raise SystemExit(f"Stazzema non n.d. in {point['referenceDate']}")
              days=point.get('observationDays', 0)
              _,month=map(int,point['referenceDate'].split('-'))
              if days < 28 or days > 31:
                  raise SystemExit(f"Copertura giornaliera anomala in {point['referenceDate']}: {days}")

          result={
              'schemaVersion': 2,
              'source': payloads[0]['source'],
              'frequency': 'monthly',
              'statistic': payloads[0]['statistic'],
              'method': payloads[0]['method'],
              'periodStart': '2022-01',
              'periodEnd': '2026-06',
              'towns': payloads[0]['towns'],
              'fuels': payloads[0]['fuels'],
              'points': points,
              'provenance': provenance,
          }
          out=Path('/tmp/fuel-history-mimit-monthly.json')
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f"Serie mensile verificata: {len(points)} mesi · {points[0]['referenceDate']} → {points[-1]['referenceDate']}")
          PY

      - name: Upload merged monthly history
        uses: actions/upload-artifact@v4
        with:
          name: fuel-history-mimit-monthly-full
          path: /tmp/fuel-history-mimit-monthly.json
          if-no-files-found: error
          retention-days: 7

