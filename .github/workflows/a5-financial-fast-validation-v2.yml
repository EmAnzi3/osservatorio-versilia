name: A5 financial fast validation v2

on:
  push:
    branches:
      - "debug/a5-financial-fast-validation-v2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Compile changed contract
        run: python -m py_compile scripts/test_demography_lotto_a_browser_v2.py

      - name: Build candidate once
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          git diff --exit-code -- . ':(exclude)dist'

      - name: Financial thematic smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preview_dist.py --port 8127 --directory dist >/tmp/a5-financial-fast-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 1
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "http://127.0.0.1:8127/confronta/bilanci/?indicatore=financialDebtProfile"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1100})
              page.goto(url, wait_until="networkidle")
              page.wait_for_function("""() => document.querySelectorAll(
                '#compare-bars > .ux-view-shell .ux-view-toggle [data-view-mode]'
              ).length === 2""")

              assert page.locator('#compare-bars .financial-topic-bars').first.is_visible(), "financial renderer assente"
              assert page.locator('#compare-bars > .ux-view-shell').count() == 1, "financial shell non univoca"
              assert page.locator('#compare-bars > .ux-view-shell .ux-view-toggle [data-view-mode]').count() == 2, "toggle non 2"
              assert page.locator('#compare-bars .financial-aggregate-history').count() == 0, "storico aggregato legacy presente"
              assert page.locator('#compare-bars [data-view-pane="current"] .bar-row').count() == 7, "confronto non 7/7"

              history_button = page.locator('#compare-bars [data-view-mode="history"]').first
              assert not history_button.is_disabled(), "storico disabilitato"
              history_button.click()
              assert page.locator('#compare-bars [data-view-pane="history"] [data-history-select]').count() == 7, "selettori storico non 7/7"
              assert page.locator('#compare-bars [data-view-pane="history"] [data-history-town]').count() == 7, "serie storico non 7/7"

              page.locator('#compare-bars [data-view-mode="current"]').first.click()
              selector = page.locator('#compare-bars [data-view-pane="current"] select[data-composite-component]').first
              assert selector.count() == 1 and selector.locator('option').count() >= 3, "selettore finanziario incompleto"
              selector.select_option(index=1)
              page.wait_for_function("""() => document.querySelector('#compare-bars > .ux-view-shell')?.dataset.financialChoice === 'part-1'""")
              page.locator('#compare-bars [data-view-mode="history"]').first.click()
              assert page.locator('#compare-bars [data-view-pane="history"] svg[aria-label*="Interessi sulle entrate correnti"]').count() == 1, "storico non segue lettura"

              print("A5 financial thematic smoke: OK")
              browser.close()
          PY

      - name: Demography browser gate
        run: |
          set -euo pipefail
          python scripts/preview_dist.py --port 8127 --directory dist >/tmp/a5-demography-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 1
          python scripts/test_demography_lotto_a_browser_v2.py --base http://127.0.0.1:8127/
