name: Prototipo Radar Opportunità

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/opportunity-radar-prototype.yml"
      - "scripts/opportunity_radar.py"
      - "scripts/opportunity_radar_quality.py"
      - "scripts/opportunity_radar_v02.py"
      - "scripts/test_opportunity_radar.py"
      - "scripts/test_opportunity_radar_quality.py"
      - "scripts/test_opportunity_radar_v02.py"
      - "data/opportunity-sources.json"
      - "docs/opportunita-prototipo.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prototype
        run: |
          python -m py_compile \
            scripts/opportunity_radar.py \
            scripts/opportunity_radar_quality.py \
            scripts/opportunity_radar_v02.py \
            scripts/test_opportunity_radar.py \
            scripts/test_opportunity_radar_quality.py \
            scripts/test_opportunity_radar_v02.py
          python scripts/test_opportunity_radar.py
          python scripts/test_opportunity_radar_quality.py
          python scripts/test_opportunity_radar_v02.py

  live-probe:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect current opportunities v0.2
        id: collect
        shell: bash
        run: |
          mkdir -p reports/runtime
          TODAY="$(TZ=Europe/Rome date +%F)"
          set +e
          python scripts/opportunity_radar_v02.py \
            --date "$TODAY" \
            --output reports/runtime/opportunities-v02.json \
            --report reports/runtime/opportunities-v02.md
          code=$?
          set -e
          echo "$code" > reports/runtime/exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat reports/runtime/opportunities-v02.md
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-v02
          path: reports/runtime/
          retention-days: 30
      - name: Fail when a source is unreachable
        if: steps.collect.outputs.exit_code != '0'
        run: |
          echo "Almeno una fonte live non ha superato il probe v0.2; consultare l'artifact diagnostico."
          exit 1
