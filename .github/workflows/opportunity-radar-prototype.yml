name: Prototipo Radar Opportunità

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/opportunity-radar-prototype.yml"
      - "scripts/opportunity_radar.py"
      - "scripts/opportunity_radar_quality.py"
      - "scripts/opportunity_radar_v02.py"
      - "scripts/opportunity_radar_v021.py"
      - "scripts/opportunity_radar_v022.py"
      - "scripts/opportunity_radar_v024.py"
      - "scripts/opportunity_radar_v025.py"
      - "scripts/opportunity_pdf_evidence.py"
      - "scripts/build_opportunity_preview.py"
      - "scripts/test_opportunity_preview.py"
      - "scripts/test_opportunity_preview_browser.py"
      - "scripts/test_opportunity_radar.py"
      - "scripts/test_opportunity_radar_quality.py"
      - "scripts/test_opportunity_radar_v02.py"
      - "scripts/test_opportunity_radar_v021.py"
      - "scripts/test_opportunity_radar_v022.py"
      - "scripts/test_opportunity_radar_v024.py"
      - "scripts/test_opportunity_radar_v025.py"
      - "scripts/test_opportunity_pdf_evidence.py"
      - "assets/opportunity-preview.css"
      - "assets/opportunity-preview.js"
      - "data/opportunity-sources.json"
      - "data/opportunity-rules-v021.json"
      - "data/opportunity-rules-v022.json"
      - "data/opportunity-rules-v025.json"
      - "data/opportunity-presentation-v024.json"
      - "data/opportunity-source-coverage-v025.json"
      - "data/opportunity-backtest-v025.json"
      - "docs/opportunita-prototipo.md"
      - "docs/opportunita-prototipo-v021.md"
      - "docs/opportunita-prototipo-v022.md"
      - "docs/opportunita-prototipo-v023.md"
      - "docs/opportunita-prototipo-v024.md"
      - "docs/opportunita-prototipo-v025.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prototype and backtest
        run: |
          python -m py_compile \
            scripts/opportunity_radar.py \
            scripts/opportunity_radar_quality.py \
            scripts/opportunity_radar_v02.py \
            scripts/opportunity_radar_v021.py \
            scripts/opportunity_radar_v022.py \
            scripts/opportunity_radar_v024.py \
            scripts/opportunity_radar_v025.py \
            scripts/opportunity_pdf_evidence.py \
            scripts/build_opportunity_preview.py \
            scripts/test_opportunity_preview.py \
            scripts/test_opportunity_preview_browser.py \
            scripts/test_opportunity_radar.py \
            scripts/test_opportunity_radar_quality.py \
            scripts/test_opportunity_radar_v02.py \
            scripts/test_opportunity_radar_v021.py \
            scripts/test_opportunity_radar_v022.py \
            scripts/test_opportunity_radar_v024.py \
            scripts/test_opportunity_radar_v025.py \
            scripts/test_opportunity_pdf_evidence.py
          python scripts/test_opportunity_radar.py
          python scripts/test_opportunity_radar_quality.py
          python scripts/test_opportunity_radar_v02.py
          python scripts/test_opportunity_radar_v021.py
          python scripts/test_opportunity_radar_v022.py
          python scripts/test_opportunity_radar_v024.py
          python scripts/test_opportunity_radar_v025.py
          python scripts/test_opportunity_pdf_evidence.py
          python scripts/test_opportunity_preview.py
          python scripts/opportunity_radar_v025.py --backtest-only > /tmp/opportunity-backtest-v025.json
          cat /tmp/opportunity-backtest-v025.json

  live-probe:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: python -m pip install pypdf
      - name: Restore previous v0.2.5 state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/previous
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for artifact_name in opportunity-radar-v025 opportunity-radar-v024; do
            artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=30" --jq ".artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$branch\") | .id" | head -n 1 || true)"
            if [[ -z "$artifact_id" ]]; then
              continue
            fi
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/opportunity-previous.zip
            if unzip -p /tmp/opportunity-previous.zip opportunities-v025.json > reports/previous/opportunities-v025.json 2>/dev/null; then
              break
            fi
            if unzip -p /tmp/opportunity-previous.zip opportunities-v024.json > reports/previous/opportunities-v025.json 2>/dev/null; then
              break
            fi
          done
      - name: Collect current opportunities v0.2.5
        id: collect
        shell: bash
        run: |
          mkdir -p reports/runtime
          TODAY="$(TZ=Europe/Rome date +%F)"
          previous=()
          if [[ -s reports/previous/opportunities-v025.json ]]; then
            previous=(--previous reports/previous/opportunities-v025.json)
          fi
          set +e
          python scripts/opportunity_radar_v025.py \
            --date "$TODAY" \
            "${previous[@]}" \
            --output reports/runtime/opportunities-v025.json \
            --report reports/runtime/opportunities-v025.md
          code=$?
          set -e
          echo "$code" > reports/runtime/exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat reports/runtime/opportunities-v025.md
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-v025
          path: reports/runtime/
          retention-days: 90
      - name: Fail on source, continuity or backtest regression
        if: steps.collect.outputs.exit_code != '0'
        run: |
          case "${{ steps.collect.outputs.exit_code }}" in
            1) echo "Una fonte live non ha superato il probe v0.2.5." ;;
            2) echo "Una opportunità è scomparsa prima della scadenza: continuityHold non vuoto." ;;
            3) echo "Il backtest v0.2.5 è sotto le soglie minime di precision/recall." ;;
            *) echo "Probe v0.2.5 fallito con codice ${{ steps.collect.outputs.exit_code }}." ;;
          esac
          exit 1

  browser-preview:
    needs: live-probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download validated radar output
        uses: actions/download-artifact@v4
        with:
          name: opportunity-radar-v025
          path: reports/runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build canonical branded static site
        run: python scripts/build_static_brand.py
      - name: Materialize non-public opportunities preview
        run: python scripts/build_opportunity_preview.py --data reports/runtime/opportunities-v025.json --dist dist
      - name: Browser checks desktop and mobile
        shell: bash
        run: |
          python scripts/preview_dist.py --directory dist --bind 127.0.0.1 --port 8123 > /tmp/opportunity-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/opportunita-preview/ >/dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/test_opportunity_preview_browser.py --base http://127.0.0.1:8123/
      - name: Package browser preview
        run: |
          mkdir -p preview-package
          cp -a dist preview-package/dist
          cat > preview-package/APRI_ANTEPRIMA.py <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import webbrowser

          root = Path(__file__).resolve().parent / "dist"
          if not (root / "opportunita-preview" / "index.html").exists():
              raise SystemExit("Anteprima non trovata: riestrarre integralmente lo ZIP.")
          handler = partial(SimpleHTTPRequestHandler, directory=str(root))
          server = ThreadingHTTPServer(("127.0.0.1", 0), handler)
          url = f"http://127.0.0.1:{server.server_port}/opportunita-preview/"
          print(f"Radar Opportunita motore v0.2.5 / UI v0.2.4: {url}")
          print("Chiudere questa finestra o premere Ctrl+C per fermare il server.")
          webbrowser.open(url)
          try:
              server.serve_forever()
          except KeyboardInterrupt:
              pass
          PY
          cat > preview-package/APRI_ANTEPRIMA.bat <<'BAT'
          @echo off
          cd /d "%~dp0"
          where py >nul 2>nul
          if %errorlevel%==0 (
            py "%~dp0APRI_ANTEPRIMA.py"
            exit /b %errorlevel%
          )
          where python >nul 2>nul
          if %errorlevel%==0 (
            python "%~dp0APRI_ANTEPRIMA.py"
            exit /b %errorlevel%
          )
          echo Python non trovato.
          pause
          exit /b 1
          BAT
          cat > preview-package/LEGGIMI.txt <<'EOF'
          ANTEPRIMA RADAR OPPORTUNITA — MOTORE v0.2.5 / UI v0.2.4 — NON PUBBLICATA

          WINDOWS
          1. Estrarre TUTTO lo ZIP.
          2. Doppio clic su APRI_ANTEPRIMA.bat.
          3. Il launcher sceglie una porta libera e apre direttamente il browser.
          4. Chiudere la finestra del server per terminare.

          Metodo alternativo:
            py APRI_ANTEPRIMA.py

          La pagina inclusa nel pacchetto è:
            dist/opportunita-preview/index.html
          EOF
          test -f preview-package/dist/opportunita-preview/index.html
          grep -q "Anteprima v0.2.4" preview-package/dist/opportunita-preview/index.html
      - name: Upload browser preview
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-v025-browser-preview
          path: preview-package/
          if-no-files-found: error
          retention-days: 90
