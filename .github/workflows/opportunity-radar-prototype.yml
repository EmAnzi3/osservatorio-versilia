name: Prototipo Radar Opportunità

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/opportunity-radar-prototype.yml"
      - "scripts/opportunity_radar.py"
      - "scripts/test_opportunity_radar.py"
      - "data/opportunity-sources.json"
      - "docs/opportunita-prototipo.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prototype
        run: |
          python -m py_compile scripts/opportunity_radar.py scripts/test_opportunity_radar.py
          python scripts/test_opportunity_radar.py

  live-probe:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect current opportunities
        id: collect
        shell: bash
        run: |
          mkdir -p reports/runtime
          set +e
          python scripts/opportunity_radar.py \
            --output reports/runtime/opportunities.json \
            --report reports/runtime/opportunities.md
          code=$?
          set -e
          echo "$code" > reports/runtime/exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat reports/runtime/opportunities.md
      - name: Inspect live markup around Fondazione bandi
        if: always()
        run: |
          python - <<'PY'
          import urllib.request
          url='https://www.fondazionecarilucca.it/bandi-in-corso'
          req=urllib.request.Request(url,headers={'User-Agent':'OsservatorioVersilia-OpportunityRadar/0.1'})
          text=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
          for needle in ['Bando 2026 Progett-Azioni','Bando 2026 Progettare per il futuro']:
              i=text.find(needle)
              print('\n---',needle,'---')
              print(text[max(0,i-900):i+1800] if i>=0 else 'NON TROVATO')
          PY
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-prototype
          path: reports/runtime/
          retention-days: 30
      - name: Fail when a source is unreachable
        if: steps.collect.outputs.exit_code != '0'
        run: |
          echo "Almeno una fonte live non ha superato il probe; consultare l'artifact diagnostico."
          exit 1
