name: Radar Opportunità · integrazione nascosta

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/opportunity-radar-integration.yml"
      - "scripts/opportunity_radar*.py"
      - "scripts/run_opportunity_radar*.py"
      - "scripts/build_opportunity*.py"
      - "scripts/source_favicon_assets.py"
      - "scripts/source_brandmark_fallback.py"
      - "scripts/source_pcm_favicon_alias.py"
      - "scripts/test_opportunity*.py"
      - "data/opportunity-*.json"
      - "assets/opportunity-preview*.css"
      - "assets/opportunity-preview*.js"
      - "assets/source-icons/**"
      - "docs/opportunita-integrazione.md"
  workflow_dispatch:

concurrency:
  group: opportunity-radar-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  engine-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate engine and coverage contracts
        run: |
          python -m py_compile \
            scripts/opportunity_radar.py scripts/opportunity_radar_quality.py \
            scripts/opportunity_radar_v02.py scripts/opportunity_radar_v021.py \
            scripts/opportunity_radar_v022.py scripts/opportunity_radar_v024.py \
            scripts/opportunity_radar_v025.py scripts/opportunity_radar_v03.py \
            scripts/opportunity_radar_v03_post.py scripts/run_opportunity_radar_v03.py \
            scripts/run_opportunity_radar_v04.py scripts/run_opportunity_radar_v041.py \
            scripts/run_opportunity_radar_v042.py scripts/run_opportunity_radar_v043.py \
            scripts/build_opportunity_preview.py scripts/build_opportunity_preview_v03.py \
            scripts/build_opportunity_preview_v04.py scripts/build_opportunity_preview_v043.py \
            scripts/build_opportunity_integration.py scripts/source_favicon_assets.py \
            scripts/source_brandmark_fallback.py scripts/source_pcm_favicon_alias.py \
            scripts/test_opportunity_integration.py scripts/test_opportunity_integration_browser.py
          for f in data/opportunity-*.json; do python -m json.tool "$f" > /dev/null; done
          python scripts/test_opportunity_radar_v03.py
          python scripts/test_opportunity_radar_v04.py
          python scripts/test_opportunity_radar_v043.py
          python scripts/run_opportunity_radar_v043.py --backtest-only > /tmp/backtest-v043.json
          cat /tmp/backtest-v043.json

  live-radar:
    needs: engine-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pypdf
      - name: Restore previous state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/previous
          current_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for branch in "$current_branch" prototype/opportunity-radar-v01; do
            for artifact_name in opportunity-radar-integration-runtime opportunity-radar-v04; do
              artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=60" --jq ".artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$branch\") | .id" | head -n 1 || true)"
              [[ -z "$artifact_id" ]] && continue
              gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/opportunity-previous.zip
              if unzip -p /tmp/opportunity-previous.zip opportunities-v04.json > reports/previous/opportunities-previous.json 2>/dev/null; then
                echo "Bootstrap continuità da $branch / $artifact_name"
                exit 0
              fi
            done
          done
          echo "Nessuno stato precedente disponibile: prima esecuzione senza bootstrap."
      - name: Collect v0.4.3
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/runtime
          TODAY="$(TZ=Europe/Rome date +%F)"
          previous=()
          [[ -s reports/previous/opportunities-previous.json ]] && previous=(--previous reports/previous/opportunities-previous.json)
          set +e
          python scripts/run_opportunity_radar_v043.py --date "$TODAY" "${previous[@]}" --output reports/runtime/opportunities-v04.json --report reports/runtime/opportunities-v04.md
          code=$?
          set -e
          echo "$code" > reports/runtime/exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat reports/runtime/opportunities-v04.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunity-radar-integration-runtime
          path: reports/runtime/
          retention-days: 90
      - name: Enforce radar gates
        if: steps.collect.outputs.exit_code != '0'
        run: |
          echo "Radar v0.4.3 fallito con codice ${{ steps.collect.outputs.exit_code }}."
          exit 1

  integrated-preview:
    needs: live-radar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opportunity-radar-integration-runtime
          path: reports/runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build real-site integration
        run: |
          python scripts/build_static_brand.py
          python scripts/build_opportunity_integration.py --data reports/runtime/opportunities-v04.json --dist dist
          python scripts/test_opportunity_integration.py --dist dist
          test -s dist/assets/source-favicons/provenance.json
      - name: Browser checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preview_dist.py --directory dist --bind 127.0.0.1 --port 8123 > /tmp/opportunity-integration-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8123/opportunita/ >/dev/null && break
            sleep 1
          done
          python scripts/test_opportunity_integration_browser.py --base http://127.0.0.1:8123/
      - name: Package local check
        run: |
          mkdir -p preview-package
          cp -a dist preview-package/dist
          cat > preview-package/APRI_ANTEPRIMA.py <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import webbrowser
          root=Path(__file__).resolve().parent/'dist'
          if not (root/'opportunita'/'index.html').exists(): raise SystemExit('Pagina /opportunita/ non trovata: riestrarre integralmente lo ZIP.')
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(SimpleHTTPRequestHandler,directory=str(root)))
          url=f'http://127.0.0.1:{server.server_port}/opportunita/'
          print(f'Radar Opportunita - collaudo integrazione: {url}')
          webbrowser.open(url)
          try: server.serve_forever()
          except KeyboardInterrupt: pass
          PY
          cat > preview-package/APRI_ANTEPRIMA.bat <<'BAT'
          @echo off
          cd /d "%~dp0"
          where py >nul 2>nul && py "%~dp0APRI_ANTEPRIMA.py" && exit /b 0
          where python >nul 2>nul && python "%~dp0APRI_ANTEPRIMA.py" && exit /b 0
          echo Python non trovato.
          pause
          BAT
          cat > preview-package/LEGGIMI.txt <<'TXT'
          COLLAUDO INTEGRAZIONE RADAR OPPORTUNITA - NON PUBBLICATO
          Route simulata: /opportunita/
          La pagina resta noindex e fuori da home, header e sitemap.
          TXT
          test -f preview-package/dist/opportunita/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-integration-preview
          path: preview-package/
          retention-days: 90
