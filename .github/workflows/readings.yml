name: Validate Percorsi di lettura

on:
  pull_request:
    paths:
      - "data/readings.json"
      - "assets/readings.css"
      - "scripts/build_readings.py"
      - "scripts/test_readings.py"
      - "scripts/test_readings_browser.py"
      - "scripts/build_static_brand.py"
      - "scripts/build_data_status.py"
      - "scripts/data_status_model.py"
      - "data/site-data.json"
      - "data/source-registry.json"
      - "data/source-monitor-state.json"
      - ".github/workflows/readings.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Materialize current canonical inputs
        run: |
          python scripts/apply_costi_fiscalita_release.py
          python scripts/materialize_pnrr_toscana_draft.py
          python scripts/patch_pnrr_toscana_review.py

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/build_readings.py scripts/test_readings.py scripts/test_readings_browser.py

      - name: Build site and derived status
        run: |
          python scripts/build_static_brand.py
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py
          python scripts/test_readings.py

      - name: Start local server
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8123 --directory dist >/tmp/ov-readings-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/letture/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ov-readings-http.log
          exit 1

      - name: Validate desktop and mobile
        run: python scripts/test_readings_browser.py --base http://127.0.0.1:8123/
