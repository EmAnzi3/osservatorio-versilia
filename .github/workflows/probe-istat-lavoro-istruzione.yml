name: Probe ISTAT lavoro istruzione eta genere

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lavoro-istruzione-eta-genere
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Estrai snapshot ISTAT 2024
        run: python scripts/probe_istat_lavoro_istruzione_eta_genere.py
      - name: Versiona snapshot verificato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-snapshots/istat-lavoro-istruzione-eta-genere-2024.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Snapshot ISTAT lavoro e istruzione 2024 [skip ci]"
          git push origin HEAD:agent/lavoro-istruzione-eta-genere
