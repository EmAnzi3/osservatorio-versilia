name: Probe ISTAT lavoro istruzione eta genere

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/probe_istat_lavoro_istruzione_eta_genere.py"
      - "scripts/materialize_lavoro_istruzione_eta_genere.py"
      - "scripts/test_lavoro_istruzione_eta_genere*.py"
      - "data/source-snapshots/istat-lavoro-istruzione-eta-genere-2024.json"
      - "assets/visual-grammar.js"
      - "assets/visual-grammar.css"
      - ".github/workflows/probe-istat-lavoro-istruzione.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Validate canonical release input
        run: |
          python scripts/finalize_catalog_release.py --check
          python scripts/test_catalog_release_v116.py
          python scripts/test_lavoro_istruzione_eta_genere.py
          node --check assets/visual-grammar.js

      - name: Validate versioned ISTAT 2024 snapshot
        run: |
          python -m json.tool data/source-snapshots/istat-lavoro-istruzione-eta-genere-2024.json > /dev/null

      - name: Probe and reconcile the live ISTAT API
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/probe_istat_lavoro_istruzione_eta_genere.py
          python -m json.tool data/source-snapshots/istat-lavoro-istruzione-eta-genere-2024.json > /dev/null
          git diff --exit-code -- data/source-snapshots/istat-lavoro-istruzione-eta-genere-2024.json

      - name: Build canonical preview
        run: |
          python scripts/build_static_brand.py
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py
          node --check assets/pnrr-town-detail.js
          python scripts/build_pnrr_toscana_deep_dive.py
          python scripts/inject_pnrr_town_experience.py
          python scripts/copy_percorsi_dist.py

      - name: Start local preview server
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preview_dist.py --port 8123 --directory dist >/tmp/ov-lavoro-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ov-lavoro-http.log
          exit 1

      - name: Validate age and gender experience in browser
        run: |
          python scripts/test_lavoro_istruzione_eta_genere_browser.py --base http://127.0.0.1:8123/
          python scripts/test_lavoro_istruzione_versilia_pyramid_browser.py --base http://127.0.0.1:8123/

      - name: Upload focused preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lavoro-istruzione-eta-genere-preview
          path: dist
          retention-days: 14
