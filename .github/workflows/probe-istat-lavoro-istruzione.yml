name: Probe ISTAT lavoro istruzione eta genere

on:
  push:
    branches: ["agent/lavoro-istruzione-eta-genere"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe dataflow ISTAT
        run: python scripts/probe_istat_lavoro_istruzione_eta_genere.py
