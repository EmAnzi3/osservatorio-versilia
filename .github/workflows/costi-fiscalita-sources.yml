name: Audit sorgenti costi fiscalità redditi

on:
  push:
    branches: ["agent/costi-fiscalita-redditi"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "costi-fiscalita-sources-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  income:
    name: MEF imponibile medio 2011-2024
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/audit_taxable_income_history_mef.py --start 2011 --end 2024 --out /tmp/mef-taxable-income-history.json
      - uses: actions/upload-artifact@v4
        with:
          name: mef-taxable-income-history
          path: /tmp/mef-taxable-income-history.json
          retention-days: 14

  income-comprehensive:
    name: MEF reddito complessivo - controllo definizione
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/audit_income_history_mef.py --start 2011 --end 2024 --out /tmp/mef-income-history.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mef-income-history
          path: /tmp/mef-income-history.json
          if-no-files-found: warn
          retention-days: 14

  imu:
    name: MEF IMU 2025
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pypdf
      - run: python scripts/audit_imu_2025.py --out /tmp/imu-2025.json
      - uses: actions/upload-artifact@v4
        with:
          name: imu-2025
          path: /tmp/imu-2025.json
          retention-days: 14

  fuel:
    name: MIMIT carburanti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/audit_fuel_prices_mimit.py --out /tmp/mimit-fuel.json
      - uses: actions/upload-artifact@v4
        with:
          name: mimit-fuel
          path: /tmp/mimit-fuel.json
          retention-days: 14

  waste:
    name: ISPRA costo rifiuti 2024
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/audit_waste_cost_ispra.py --out /tmp/ispra-waste-cost.json
      - uses: actions/upload-artifact@v4
        with:
          name: ispra-waste-cost
          path: /tmp/ispra-waste-cost.json
          retention-days: 14

  inflation:
    name: NIC Toscana 2016-2024
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/audit_inflation_nic_toscana.py --out /tmp/nic-toscana-2016-2024.json
      - uses: actions/upload-artifact@v4
        with:
          name: nic-toscana-2016-2024
          path: /tmp/nic-toscana-2016-2024.json
          retention-days: 14

  inflation-lucca:
    name: Istat NIC Provincia di Lucca 2016-2024
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/audit_inflation_nic_lucca.py --start 2016 --end 2024 --out /tmp/nic-lucca-2016-2024.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nic-lucca-2016-2024
          path: /tmp/nic-lucca-2016-2024.json
          if-no-files-found: warn
          retention-days: 14

  tari:
    name: MEF TARI 2025 Forte e Pietrasanta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pypdf
      - run: python scripts/audit_tari_2025_missing.py --out /tmp/tari-2025-missing.json
      - uses: actions/upload-artifact@v4
        with:
          name: tari-2025-missing
          path: /tmp/tari-2025-missing.json
          retention-days: 14
