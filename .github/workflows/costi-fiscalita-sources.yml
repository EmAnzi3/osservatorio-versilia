name: Audit sorgenti costi fiscalità redditi

on:
  push:
    branches: ["agent/costi-fiscalita-redditi"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "costi-fiscalita-sources-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install pypdf
      - name: MEF income 2011-2024
        run: python scripts/audit_income_history_mef.py --start 2011 --end 2024 --out /tmp/mef-income-history.json
      - name: MEF IMU 2025
        run: python scripts/audit_imu_2025.py --out /tmp/imu-2025.json
      - name: MIMIT fuel prices
        run: python scripts/audit_fuel_prices_mimit.py --out /tmp/mimit-fuel.json
      - name: ISPRA waste costs 2024
        run: python scripts/audit_waste_cost_ispra.py --out /tmp/ispra-waste-cost.json
      - name: ISTAT NIC Toscana 2011-2024
        run: python scripts/audit_inflation_nic_toscana.py --out /tmp/nic-toscana-2011-2024.json
      - name: MEF TARI missing municipalities 2025
        run: python scripts/audit_tari_2025_missing.py --out /tmp/tari-2025-missing.json
      - name: Upload validated source snapshots
        uses: actions/upload-artifact@v4
        with:
          name: costi-fiscalita-validated-sources
          path: |
            /tmp/mef-income-history.json
            /tmp/imu-2025.json
            /tmp/mimit-fuel.json
            /tmp/ispra-waste-cost.json
            /tmp/nic-toscana-2011-2024.json
            /tmp/tari-2025-missing.json
          retention-days: 14
