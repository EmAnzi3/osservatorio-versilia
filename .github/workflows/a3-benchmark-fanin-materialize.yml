name: A3 Benchmark fan-in materialization

on:
  pull_request:
    branches: ["fix/a3-enrichment-publication-gap"]
    paths:
      - ".github/workflows/a3-benchmark-fanin-materialize.yml"

permissions:
  contents: read

jobs:
  fan-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile fan-in materializer
        run: python -m py_compile scripts/materialize_a3_benchmark_fanin_pass.py
      - name: Show pending benchmark state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          site=json.loads(Path("data/site-data.json").read_text(encoding="utf-8"))
          mids=[
            "localUnits","localUnitsChange","localEmployees","localEmployeesChange","employeesPerLocalUnit",
            "libraryActiveBorrowersPer100","libraryLoansPerResident","libraryWeeklyOpeningHours",
            "landUse","landUseChange"
          ]
          for mid in mids:
              metric=(site.get("metrics") or {}).get(mid) or {}
              print(mid, json.dumps((metric.get("meta") or {}).get("benchmark"), ensure_ascii=False, sort_keys=True))
          PY
      - name: Materialize accumulated PASS candidates
        run: python scripts/materialize_a3_benchmark_fanin_pass.py
      - name: Verify fan-in scope
        shell: bash
        run: |
          git diff --name-only > /tmp/a3-fanin-changed.txt
          cat /tmp/a3-fanin-changed.txt
          test "$(cat /tmp/a3-fanin-changed.txt)" = "data/site-data.json"
          git diff --stat -- data/site-data.json > /tmp/a3-fanin-stat.txt
          cat /tmp/a3-fanin-stat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a3-benchmark-fanin-materialized
          path: |
            data/site-data.json
            /tmp/a3-fanin-changed.txt
            /tmp/a3-fanin-stat.txt
          if-no-files-found: error
