name: Allinea compatibilità draft sicurezza

on:
  push:
    branches: ["agent/sicurezza-territorio-draft"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sicurezza-territorio-draft
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/patch_security_draft_compat.py
      - run: |
          python -m py_compile scripts/patch_security_draft_compat.py
          git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json scripts/test_static.py social-kit/config/editorial-calendar.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da applicare"
          else
            git commit -m "Allinea test e dipendenze al catalogo sicurezza"
            git push origin HEAD:agent/sicurezza-territorio-draft
          fi
