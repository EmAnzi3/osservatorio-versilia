name: Materialize readable v1.3.1 sources

on:
  push:
    branches: ["cleanup/readable-v1.3.1"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/readable-v1.3.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Materialize approved sources
        run: python scripts/apply_release_v131.py

      - name: Verify readable sources before commit
        run: |
          python scripts/build_static_safe.py
          python scripts/test_static.py
          python scripts/test_release_v131.py
          test "$(python - <<'PY'
          import json
          print(len(json.load(open('data/site-data.json', encoding='utf-8'))['metrics']))
          PY
          )" = "69"
          ! grep -R "Anteprima locale" assets/app-parts data/site-data.json

      - name: Commit materialized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json assets/static.css assets/fidelity.css assets/fidelity.js assets/app-parts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Materializza i sorgenti leggibili della v1.3.1"
          git push origin HEAD:cleanup/readable-v1.3.1
