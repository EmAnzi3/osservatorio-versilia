name: Territorio v1.37 canonical QA
# Gate canonico v1.37: build completa + contratto dist.

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - scripts/build_static_brand.py
      - scripts/materialize_territorio_v137.py
      - scripts/patch_territorio_v137_runtime.py
      - scripts/verify_territorio_v137_dist.py
      - data/source-snapshots/territorio-v137-official.json
      - .github/workflows/territorio-v137-runtime-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile v1.37 Python
        run: python -m py_compile scripts/materialize_territorio_v137.py scripts/patch_territorio_v137_runtime.py scripts/build_static_brand.py scripts/verify_territorio_v137_dist.py
      - name: Run canonical static build
        id: canonical
        continue-on-error: true
        run: |
          mkdir -p tmp
          set +e
          python scripts/build_static_brand.py > tmp/territorio-v137-canonical-build.log 2>&1
          status=$?
          cat tmp/territorio-v137-canonical-build.log
          echo "$status" > tmp/territorio-v137-canonical-build.status
          exit $status
      - name: Upload canonical build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: territorio-v137-canonical-build-diagnostics
          path: |
            tmp/territorio-v137-canonical-build.log
            tmp/territorio-v137-canonical-build.status
          if-no-files-found: error
          retention-days: 7
      - name: Fail if canonical build failed
        if: steps.canonical.outcome != 'success'
        run: exit 1
      - name: Assert canonical dist contract
        run: python scripts/verify_territorio_v137_dist.py
      - name: Assert final runtime tokens
        run: |
          grep -R -q "territoryProfileTypes" dist/assets
          grep -R -q "sqm_per_resident" dist/assets
          grep -R -q "km_per_km2" dist/assets
