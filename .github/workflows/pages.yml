name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  checks: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quick:
    name: quick
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'ready_for_review') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install quick build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Run quick preflight
        run: python scripts/preflight.py --quick

      - name: Upload verified preview
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14

  full:
    name: full
    needs: quick
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && needs.quick.result == 'success') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.action == 'ready_for_review' || needs.quick.result == 'success'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify prior quick on ready-for-review
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            > /tmp/ov-check-runs.json
          python - <<'PY'
          import json
          import os

          head_sha = os.environ["HEAD_SHA"]
          payload = json.load(open("/tmp/ov-check-runs.json", encoding="utf-8"))
          matches = [
              run
              for run in payload.get("check_runs", [])
              if run.get("name") == "quick"
              and run.get("head_sha") == head_sha
              and run.get("conclusion") == "success"
          ]
          if not matches:
              raise SystemExit(f"Nessun quick verde trovato per {head_sha}")
          print(f"Quick già verde sullo stesso SHA: {head_sha}")
          PY

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install full test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
          npm install --global lighthouse@12.8.2

      - name: Prepare coherent dist for full-only checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          git diff --exit-code -- . ':(exclude)dist'
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py
          python scripts/build_pnrr_toscana_deep_dive.py
          python scripts/inject_pnrr_town_experience.py
          python scripts/copy_percorsi_dist.py
          node --check dist/assets/app-bundle.js

      - name: Run full-only preflight
        run: python scripts/preflight.py --full --skip-quick

  build:
    name: build
    needs: [quick, full]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && needs.full.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Build deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_static_brand.py
          git diff --exit-code -- . ':(exclude)dist'
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py
          python scripts/build_pnrr_toscana_deep_dive.py
          python scripts/inject_pnrr_town_experience.py
          python scripts/copy_percorsi_dist.py
          node --check dist/assets/app-bundle.js
          python scripts/test_site_consistency.py

      - name: Upload static site for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
