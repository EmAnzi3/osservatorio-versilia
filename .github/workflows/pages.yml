name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Build pre-rendered site
        run: python scripts/build_static_safe.py

      - name: Run regression tests
        run: python scripts/test_static.py

      - name: Run release compatibility checks
        run: python scripts/test_release_v170_compat.py

      - name: Run source-link checks
        run: python scripts/test_source_links_v160.py

      - name: Run SIOPE history checks
        run: python scripts/test_siope_history_v160.py

      - name: Run accordion and history checks
        run: python scripts/test_ux_experiment.py

      - name: Run export checks
        run: python scripts/test_exports_v161.py

      - name: Run ASIA, ATECO and AGCOM tests
        run: |
          python scripts/test_agid_indicators.py
          python scripts/test_ateco_agcom_audit.py
          python scripts/test_agcom_primary_percentages.py
          python -m py_compile \
            scripts/update_agid_indicators_resilient.py \
            scripts/restore_partial_agcom_metrics.py \
            scripts/enrich_ateco_agcom_audit.py \
            scripts/audit_agcom_primary.py \
            scripts/apply_agcom_primary_percentages.py \
            scripts/apply_agcom_absolute_policy.py \
            scripts/monthly_data_check_coverage.py

      - name: Verify municipal crests
        run: |
          python - <<'PY'
          from pathlib import Path
          import mimetypes
          crests = [
              'massarosa.png', 'viareggio.svg', 'camaiore.svg',
              'pietrasanta.svg', 'seravezza.png', 'forte-dei-marmi.svg',
              'stazzema.webp'
          ]
          for crest in crests:
              path = Path('dist/crests') / crest
              assert path.exists() and path.stat().st_size > 0, f'Stemma mancante: {crest}'
          for crest in ['viareggio.svg', 'camaiore.svg', 'pietrasanta.svg', 'forte-dei-marmi.svg']:
              assert mimetypes.guess_type(crest)[0] == 'image/svg+xml'
          print('Stemmi verificati: 7/7')
          PY

      - name: Run monthly monitor checks
        run: |
          python scripts/test_monthly_data_check.py
          mkdir -p /tmp/monthly-data-check
          python scripts/monthly_data_check_coverage.py \
            --mode offline \
            --report-md /tmp/monthly-data-check/report.md \
            --report-json /tmp/monthly-data-check/report.json \
            --next-state /tmp/monthly-data-check/state.json

      - name: Upload static site for deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
