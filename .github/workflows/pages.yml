name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Materialize Economy v1.13 release
        run: python scripts/apply_costi_fiscalita_release.py

      - name: Validate Economy v1.13 data and semantics
        run: python scripts/test_costi_fiscalita_redditi_draft.py

      - name: Materialize Demography Lotto A draft
        run: |
          python scripts/materialize_demography_lotto_a_v4.py
          python scripts/test_demography_lotto_a_materialized.py
          python scripts/materialize_demography_lotto_a_v5.py
          python scripts/test_demography_lotto_a_v5.py
          python scripts/materialize_demography_rcs_lotto_a.py
          python scripts/test_demography_rcs_lotto_a.py
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool data/source-registry.json > /dev/null
          python -m json.tool data/source-monitor-state.json > /dev/null
          python -m json.tool data/source-snapshots/istat-demography-lotto-a-2026-08.json > /dev/null
          python -m json.tool data/source-snapshots/istat-rcs-demography-2025.json > /dev/null

      - name: Materialize complete Income Lotto A draft
        run: |
          python scripts/materialize_income_lotto_a_v2.py
          python scripts/patch_income_lotto_a_frontend.py
          python scripts/patch_demography_lotto_a_frontend_v2.py
          python scripts/patch_income_lotto_a_regressions.py
          python scripts/test_income_lotto_a_v2.py
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool data/source-registry.json > /dev/null
          python -m json.tool data/source-monitor-state.json > /dev/null
          python -m json.tool data/source-snapshots/mef-income-lotto-a-2024.json > /dev/null

      - name: Materialize Fiscalità Lotto B
        run: |
          python scripts/materialize_fiscal_lotto_b.py
          python scripts/test_fiscal_lotto_b.py
          python -m json.tool data/site-data.json > /dev/null
          python -m json.tool data/source-registry.json > /dev/null
          python -m json.tool data/source-monitor-state.json > /dev/null
          python -m json.tool data/source-snapshots/fiscal-lotto-b-2025.json > /dev/null

      - name: Materialize PNRR Toscana release
        run: |
          python scripts/materialize_pnrr_toscana_draft.py
          python scripts/patch_pnrr_toscana_review.py
          python scripts/test_pnrr_toscana_draft.py
          python scripts/test_pnrr_toscana_review.py

      - name: Apply Fiscalità Lotto B frontend semantics
        run: python scripts/patch_fiscal_lotto_b_frontend.py

      - name: Build pre-rendered site
        run: python scripts/build_static_brand.py

      - name: Materialize public data status
        run: |
          python scripts/build_data_status.py
          python scripts/inject_data_status_runtime.py

      - name: Build PNRR Toscana deep dive
        run: |
          node --check assets/pnrr-town-detail.js
          python scripts/build_pnrr_toscana_deep_dive.py
          python scripts/inject_pnrr_town_experience.py
          python scripts/test_pnrr_toscana_draft.py
          python scripts/test_pnrr_toscana_review.py

      - name: Start local release server
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preview_dist.py --port 8123 --directory dist >/tmp/ov-release-http.log 2>&1 &
          echo $! > /tmp/ov-release-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ov-release-http.log
          exit 1

      - name: Validate Demography Lotto A v2 in browser
        run: python scripts/test_demography_lotto_a_browser_v2.py --base http://127.0.0.1:8123/

      - name: Validate Income Lotto A in browser
        run: python scripts/test_income_lotto_a_browser.py --base http://127.0.0.1:8123/

      - name: Validate Fiscalità Lotto B in browser
        run: python scripts/test_fiscal_lotto_b_browser.py --base http://127.0.0.1:8123/

      - name: Validate PNRR Toscana town experience
        run: python scripts/test_pnrr_toscana_town_browser.py --base http://127.0.0.1:8123/

      - name: Validate income and inflation history in browser
        run: python scripts/check_income_inflation_history_browser.py --base http://127.0.0.1:8123/

      - name: Validate public data status
        run: |
          node --check assets/data-status.js
          python scripts/test_data_status.py
          python scripts/test_data_status_browser.py --base http://127.0.0.1:8123/

      - name: Run regression tests
        run: python scripts/test_static.py

      - name: Run launch foundation checks
        run: python scripts/test_launch_foundations.py

      - name: Run indicator page and SEO checks
        run: python scripts/test_indicator_pages.py

      - name: Run composite indicator checks
        run: python scripts/test_composite_indicators.py

      - name: Run brand identity checks
        run: python scripts/test_brand_identity.py

      - name: Run PWA checks
        run: |
          node --check assets/pwa.js
          node --check service-worker.js
          python scripts/test_pwa.py

      - name: Run visual grammar checks
        run: |
          node --check assets/visual-grammar.js
          python scripts/test_visual_grammar.py

      - name: Run chart surface checks
        run: python scripts/test_chart_surfaces.py

      - name: Run release compatibility checks
        run: |
          python scripts/test_release_v170_compat.py
          python scripts/test_history_v180.py

      - name: Run source-link checks
        run: python scripts/test_source_links_v160.py

      - name: Run SIOPE history checks
        run: python scripts/test_siope_history_v160.py

      - name: Run accordion and history checks
        run: python scripts/test_ux_experiment.py

      - name: Run mobile interaction checks
        run: |
          node --check assets/ux-accordion.js
          node --check assets/ux-history.js
          node --check assets/ux-history-core.js
          python scripts/test_mobile_interactions.py
          python scripts/test_accordion_tools_persistence.py

      - name: Run export checks
        run: python scripts/test_exports_v161.py

      - name: Run ASIA, ATECO and AGCOM tests
        run: |
          python scripts/test_agid_indicators.py
          python scripts/test_agid_refresh_idempotent.py
          python scripts/test_ateco_agcom_audit.py
          python scripts/test_agcom_primary_percentages.py
          python -m py_compile \
            scripts/update_agid_indicators_resilient.py \
            scripts/restore_partial_agcom_metrics.py \
            scripts/enrich_ateco_agcom_audit.py \
            scripts/audit_agcom_primary.py \
            scripts/apply_agcom_primary_percentages.py \
            scripts/apply_agcom_absolute_policy.py \
            scripts/monthly_data_check_coverage.py \
            scripts/monthly_data_check_status.py \
            scripts/data_status_model.py \
            scripts/pnrr_toscana_audit.py \
            scripts/pnrr_toscana_forensic.py \
            scripts/pnrr_toscana_snapshot_runner.py \
            scripts/materialize_pnrr_toscana_draft.py \
            scripts/patch_pnrr_toscana_review.py \
            scripts/build_pnrr_toscana_deep_dive.py \
            scripts/inject_pnrr_town_experience.py \
            scripts/test_pnrr_toscana_audit.py \
            scripts/test_pnrr_status_integration.py \
            scripts/test_pnrr_toscana_draft.py \
            scripts/test_pnrr_toscana_review.py \
            scripts/test_pnrr_toscana_town_browser.py \
            scripts/build_data_status.py \
            scripts/inject_data_status_runtime.py \
            scripts/materialize_demography_lotto_a_v5.py \
            scripts/materialize_demography_rcs_lotto_a.py \
            scripts/patch_demography_lotto_a_frontend_v2.py \
            scripts/test_demography_lotto_a_v5.py \
            scripts/test_demography_rcs_lotto_a.py \
            scripts/test_demography_lotto_a_browser_v2.py \
            scripts/materialize_income_lotto_a.py \
            scripts/materialize_income_lotto_a_v2.py \
            scripts/patch_income_lotto_a_frontend.py \
            scripts/patch_income_lotto_a_regressions.py \
            scripts/test_income_lotto_a_materialized.py \
            scripts/test_income_lotto_a_v2.py \
            scripts/test_income_lotto_a_browser.py \
            scripts/materialize_fiscal_lotto_b.py \
            scripts/patch_fiscal_lotto_b_frontend.py \
            scripts/test_fiscal_lotto_b.py \
            scripts/test_fiscal_lotto_b_browser.py

      - name: Verify municipal crests
        run: |
          python - <<'PY'
          from pathlib import Path
          import mimetypes
          crests = [
              'massarosa.png', 'viareggio.svg', 'camaiore.svg',
              'pietrasanta.svg', 'seravezza.png', 'forte-dei-marmi.svg',
              'stazzema.webp'
          ]
          for crest in crests:
              path = Path('dist/crests') / crest
              assert path.exists() and path.stat().st_size > 0, f'Stemma mancante: {crest}'
          for crest in ['viareggio.svg', 'camaiore.svg', 'pietrasanta.svg', 'forte-dei-marmi.svg']:
              assert mimetypes.guess_type(crest)[0] == 'image/svg+xml'
          print('Stemmi verificati: 7/7')
          PY

      - name: Run monthly monitor checks
        run: |
          python scripts/test_monthly_data_check.py
          python scripts/test_pnrr_toscana_audit.py
          python scripts/test_pnrr_status_integration.py
          mkdir -p /tmp/monthly-data-check
          python scripts/monthly_data_check_status.py \
            --mode offline \
            --report-md /tmp/monthly-data-check/report.md \
            --report-json /tmp/monthly-data-check/report.json \
            --next-state /tmp/monthly-data-check/state.json
          python - <<'PY'
          import json
          site = json.load(open('data/site-data.json', encoding='utf-8'))
          state = json.load(open('/tmp/monthly-data-check/state.json', encoding='utf-8'))
          assert state['schemaVersion'] == 2
          assert len(state['metrics']) == len(site['metrics'])
          PY

      - name: Include Percorsi Versilia
        run: python scripts/copy_percorsi_dist.py

      - name: Validate Percorsi Versilia
        run: |
          node --check percorsi/app.js
          node --check percorsi/data-loader.js
          node --check dist/assets/app-bundle.js
          python scripts/test_percorsi_draft.py
          python scripts/test_accordion_no_overlap.py
          python scripts/test_percorsi_refinements.py

      - name: Enforce site-wide consistency contract
        run: |
          python -m py_compile scripts/site_chrome.py scripts/preview_dist.py scripts/test_site_chrome.py scripts/test_site_consistency.py scripts/test_site_chrome_browser.py
          python scripts/test_site_chrome.py
          python scripts/test_site_consistency.py
          python scripts/test_site_chrome_browser.py --base http://127.0.0.1:8123/

      - name: Upload draft preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: osservatorio-versilia-v116-preview
          path: dist
          retention-days: 14

      - name: Upload static site for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
