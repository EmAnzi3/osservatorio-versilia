name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cache-busted site
        shell: bash
        run: |
          set -euo pipefail
          version="20260803-1720"

          find . -name '*.html' -type f -print0 | xargs -0 sed -E -i \
            -e "s#app\\.js(\\?v=[0-9-]+)?\"#app.js?v=${version}\"#g" \
            -e "s#original\\.css(\\?v=[0-9-]+)?\"#original.css?v=${version}\"#g" \
            -e "s#static\\.css(\\?v=[0-9-]+)?\"#static.css?v=${version}\"#g"

          python - <<'PY'
          from pathlib import Path

          version = "20260803-1720"
          marker = "data-ov-fidelity"
          bootstrap = f'''  <script data-ov-fidelity>
            (() => {{
              const appScript = [...document.scripts].find(script => /\/assets\/app\.js(?:\?|$)/.test(script.src));
              if (!appScript) return;
              const assetRoot = new URL('.', appScript.src);
              const stylesheet = document.createElement('link');
              stylesheet.rel = 'stylesheet';
              stylesheet.href = new URL(`fidelity.css?v={version}`, assetRoot).href;
              document.head.append(stylesheet);
              const script = document.createElement('script');
              script.src = new URL(`fidelity.js?v={version}`, assetRoot).href;
              document.head.append(script);
            }})();
          </script>
          '''

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  text = text.replace('</body>', bootstrap + '</body>')
                  path.write_text(text, encoding='utf-8')
          PY

          test -s crests/massarosa.png
          test -s crests/viareggio.svg
          test -s crests/camaiore.svg
          test -s crests/pietrasanta.svg
          test -s crests/seravezza.png
          test -s crests/forte-dei-marmi.svg
          test -s crests/stazzema.webp
          test -s images/versilia-viareggio-apuane.jpg
          test -s assets/fonts/geist-latin.woff2
          test -s assets/fonts/geist-mono-latin.woff2
          test -s assets/fidelity.css
          test -s assets/fidelity.js
          node --check assets/fidelity.js
          test "$(sha256sum images/versilia-viareggio-apuane.jpg | cut -d' ' -f1)" = "13d7da265085bc58bd09f2d8fe6936eb4621847768f4428b74526777e84741ab"
          grep -q "correctHero" index.html
          grep -q "images/versilia-viareggio-apuane.jpg?v=20260803-1658" index.html
          grep -R "app.js?v=${version}" --include='*.html' . >/dev/null
          grep -R "data-ov-fidelity" --include='*.html' . >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          version="20260803-1720"

          for attempt in {1..18}; do
            if curl -L --fail --silent --show-error "${base}crests/massarosa.png?verify=${version}" -o /tmp/massarosa.png \
              && curl -L --fail --silent --show-error "${base}images/versilia-viareggio-apuane.jpg?verify=${version}" -o /tmp/hero.jpg \
              && curl -L --fail --silent --show-error "${base}assets/fidelity.css?verify=${version}" -o /tmp/fidelity.css \
              && curl -L --fail --silent --show-error "${base}assets/fidelity.js?verify=${version}" -o /tmp/fidelity.js \
              && curl -L --fail --silent --show-error "${base}comuni/massarosa/?verify=${version}" -o /tmp/massarosa.html \
              && test "$(stat -c%s /tmp/massarosa.png)" -gt 20000 \
              && test "$(sha256sum /tmp/hero.jpg | cut -d' ' -f1)" = "13d7da265085bc58bd09f2d8fe6936eb4621847768f4428b74526777e84741ab" \
              && grep -q '#site-header-mount' /tmp/fidelity.css \
              && grep -q 'chart-y-label' /tmp/fidelity.js \
              && grep -q 'data-ov-fidelity' /tmp/massarosa.html \
              && grep -q "fidelity.js?v=${version}" /tmp/massarosa.html; then
              exit 0
            fi
            sleep 10
          done
          echo 'La pagina pubblica non contiene ancora sticky header e valori dell’ordinata.' >&2
          exit 1
