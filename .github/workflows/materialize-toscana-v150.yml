name: Materialize Toscana v1.5.0 sources

on:
  push:
    branches: ["expansion/toscana-indicatori-comunali"]
  pull_request:
    branches: ["expansion/lavoro-istruzione-abitare"]

permissions:
  contents: write

concurrency:
  group: materialize-toscana-v150
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/toscana-indicatori-comunali
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source snapshot
        run: python scripts/repair_toscana_snapshot.py

      - name: Materialize readable sources
        run: python scripts/update_toscana_indicators_v150.py

      - name: Commit generated files
        run: |
          if git diff --quiet -- data/site-data.json assets/app-parts/00.txt data/source-snapshots/toscana-indicatori-v1.5.0.json; then
            echo "Sorgenti già materializzati."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json assets/app-parts/00.txt data/source-snapshots/toscana-indicatori-v1.5.0.json
          git commit -m "Materializza gli indicatori comunali toscani v1.5.0"
          git push origin HEAD:expansion/toscana-indicatori-comunali
