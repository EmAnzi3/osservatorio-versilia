name: Radar Opportunità · v0.4.4 quality gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - "data/opportunity-*.json"
      - "scripts/*opportunity*.py"
      - "assets/opportunity-*.css"
      - "assets/opportunity-*.js"
      - ".github/workflows/opportunity-radar-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: opportunity-radar-v044-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Validate v0.4.4 contracts and audit replay
        run: |
          python -m py_compile \
            scripts/run_opportunity_radar_v044.py \
            scripts/opportunity_daily_refresh.py \
            scripts/opportunity_daily_refresh_revalidated.py \
            scripts/opportunity_daily_refresh_resilient.py \
            scripts/opportunity_daily_refresh_stable.py \
            scripts/opportunity_daily_refresh_audit_fixed.py \
            scripts/opportunity_audit_corpus_promotions.py \
            scripts/opportunity_matrix_promotions.py \
            scripts/opportunity_municipal_relevance.py \
            scripts/opportunity_discovery_resilient.py \
            scripts/opportunity_transport_smoke.py \
            scripts/opportunity_regione_toscana_guard.py \
            scripts/opportunity_issue_notification.py \
            scripts/opportunity_run_report.py \
            scripts/opportunity_runtime_snapshot.py \
            scripts/test_opportunity_regione_toscana_guard.py \
            scripts/test_opportunity_issue_notification.py \
            scripts/test_opportunity_content_sanitization.py \
            scripts/test_opportunity_run_report.py \
            scripts/test_opportunity_runtime_snapshot.py \
            scripts/test_opportunity_automation_workflow.py \
            scripts/test_opportunity_daily_continuity.py \
            scripts/test_opportunity_primary_revalidation.py \
            scripts/test_opportunity_discovery_resilience.py \
            scripts/test_opportunity_source_health.py \
            scripts/test_opportunity_publishability_matrix.py \
            scripts/test_opportunity_expired_lifecycle.py \
            scripts/test_opportunity_municipal_relevance.py \
            scripts/test_opportunity_audit_corpus_promotions.py \
            scripts/test_opportunity_snapshot_lifecycle.py \
            scripts/build_opportunity_preview_v044.py \
            scripts/materialize_opportunity_release_snapshot.py \
            scripts/build_opportunity_release.py \
            scripts/test_opportunity_radar_v044.py \
            scripts/test_opportunity_release_browser.py
          python scripts/test_opportunity_regione_toscana_guard.py
          python scripts/test_opportunity_issue_notification.py
          python scripts/test_opportunity_content_sanitization.py
          python scripts/test_opportunity_run_report.py
          python scripts/test_opportunity_runtime_snapshot.py
          python scripts/test_opportunity_automation_workflow.py
          python scripts/test_opportunity_daily_continuity.py
          python scripts/test_opportunity_primary_revalidation.py
          python scripts/test_opportunity_discovery_resilience.py
          python scripts/test_opportunity_source_health.py
          python scripts/test_opportunity_publishability_matrix.py
          python scripts/test_opportunity_expired_lifecycle.py
          python scripts/test_opportunity_municipal_relevance.py
          python scripts/test_opportunity_audit_corpus_promotions.py
          python scripts/test_opportunity_radar_v044.py
          python scripts/run_opportunity_radar_v044.py --backtest-only

      - name: Validate frozen v0.4.4 baseline
        run: |
          python - <<'PY'
          import json
          p = json.load(open('data/opportunity-release.json', encoding='utf-8'))
          assert p['releaseVersion'] == '0.4.4'
          assert len(p['opportunities']) == 30, len(p['opportunities'])
          assert (p.get('counts') or {}).get('new') == 5
          print('Baseline v0.4.4 verificato: 30 opportunità · 5 nuove')
          PY

      - name: Materialize current public snapshot with audit corpus
        run: |
          python scripts/materialize_opportunity_release_snapshot.py
          python scripts/test_opportunity_snapshot_lifecycle.py --file data/opportunity-release.json --mode release

      - name: Build public site
        run: |
          python scripts/build_static_brand.py
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path('dist/opportunita/index.html').read_text(encoding='utf-8')
          payload = json.load(open('data/opportunity-release.json', encoding='utf-8'))
          needle = 'opportunity-preview-v04.js?v=20260908-relevance1'
          assert needle in html, 'JS Radar non versionato: rischio cache client obsoleto'
          assert 'data-municipal-headline=' in html
          assert 'data-partnership=' in html
          assert html.count('data-opportunity-card') == len(payload.get('opportunities') or [])
          print('Build pubblica allineata al replay audit:', len(payload.get('opportunities') or []), 'schede')
          PY

      - name: Start local server
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preview_dist.py --port 8123 --directory dist >/tmp/ov-radar-v044.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8123/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ov-radar-v044.log
          exit 1

      - name: Validate public Radar in browser
        run: python scripts/test_opportunity_release_browser.py --base http://127.0.0.1:8123/

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: radar-opportunita-v044-preview
          path: dist
          retention-days: 7

  daily-production-dry-run:
    name: daily production dry-run
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Seed dry-run from latest verified runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/opportunity-radar-daily"
          SNAPSHOT="data/opportunity-daily-public.json"
          cp "$SNAPSHOT" /tmp/opportunity-daily-main.json
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          if git show "refs/remotes/origin/$BRANCH:$SNAPSHOT" > /tmp/opportunity-daily-pending.json 2>/dev/null; then
            python scripts/opportunity_runtime_snapshot.py \
              --main /tmp/opportunity-daily-main.json \
              --candidate /tmp/opportunity-daily-pending.json \
              --output "$SNAPSHOT"
          else
            python scripts/opportunity_runtime_snapshot.py \
              --main /tmp/opportunity-daily-main.json \
              --output "$SNAPSHOT"
          fi
          cp "$SNAPSHOT" /tmp/opportunity-daily-previous.json

      - name: Materialize verified baseline
        run: python scripts/materialize_opportunity_release_snapshot.py

      - name: Run current live discovery through production entrypoint
        run: python scripts/opportunity_daily_refresh_stable.py --date "$(date -u +%F)"

      - name: Validate current daily snapshot
        run: python scripts/test_opportunity_snapshot_lifecycle.py --file data/opportunity-daily-public.json --mode daily

      - name: Build tomorrow public Radar
        run: |
          python scripts/build_static_brand.py
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/opportunity-daily-public.json').read_text(encoding='utf-8'))
          html = Path('dist/opportunita/index.html').read_text(encoding='utf-8')
          year, month, day = str(payload.get('referenceDate') or '').split('-')
          displayed = f'{day}/{month}/{year}'
          assert displayed in html, displayed
          assert html.count('data-opportunity-card') == len(payload.get('opportunities') or [])
          print('Build dry-run collegata allo snapshot', displayed + ':', len(payload.get('opportunities') or []), 'schede')
          PY

      - name: Start dry-run local server
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preview_dist.py --port 8124 --directory dist >/tmp/ov-radar-daily-dryrun.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8124/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ov-radar-daily-dryrun.log
          exit 1

      - name: Browser QA tomorrow dry-run
        run: python scripts/test_opportunity_release_browser.py --base http://127.0.0.1:8124/

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-opportunita-daily-dryrun-${{ github.run_id }}
          path: |
            data/opportunity-daily-public.json
            reports/runtime/opportunity-daily-summary.md
            reports/runtime/opportunity-continuity-hold.json
            reports/runtime/opportunity-publishability-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7