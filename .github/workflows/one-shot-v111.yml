name: One-shot v1.11.0 publish patch

on:
  push:
    branches: ["agent/migrazioni-omi-v111"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-v111
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/migrazioni-omi-v111
          fetch-depth: 0

      - name: Install Python dependency
        run: python -m pip install playwright

      - name: Apply v1.11.0 patch
        run: python scripts/one_shot_v111.py

      - name: Validate generated source
        run: |
          python scripts/test_release_v111.py
          cat assets/app-parts/*.txt > /tmp/app-bundle.js
          node --check /tmp/app-bundle.js
          node --check assets/visual-grammar.js
          node --check assets/ux-history.js
          node --check assets/ux-history-core.js
          node --check service-worker.js
          python -m py_compile scripts/build_static_safe.py scripts/build_static_brand.py scripts/test_release_v111.py

      - name: Commit final patch
        run: |
          git checkout HEAD -- .github/workflows/pages.yml .github/workflows/one-shot-v111.yml
          rm -f scripts/one_shot_v111.py .tmp/v111-*.b64
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish data v1.11.0 and migration OMI views"
          git push origin HEAD:agent/migrazioni-omi-v111
