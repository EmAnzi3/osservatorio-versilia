name: Audit Amministrazione RGS

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "audit-amministrazione-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute RGS administration values
        run: python scripts/audit_rgs_amministrazione_values.py

      - name: Inspect official Conto Annuale bulk download
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/probe_contoannuale_download.py
