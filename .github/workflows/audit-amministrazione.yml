name: Audit Amministrazione RGS

on:
  push:
    branches: ["agent/amministrazione-lotto-a"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "audit-amministrazione-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test RGS CSV form submission
        run: python scripts/audit_rgs_post_probe.py
