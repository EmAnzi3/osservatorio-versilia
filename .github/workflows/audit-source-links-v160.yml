name: Audit source links v1.6.0

on:
  push:
    branches: ["expansion/bilanci-comunali-v160"]

permissions:
  contents: read

concurrency:
  group: source-link-audit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit-source-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Audit links exposed by indicator cards
        run: python scripts/audit_source_links.py

# Diagnostic only: no write, deploy or merge.
