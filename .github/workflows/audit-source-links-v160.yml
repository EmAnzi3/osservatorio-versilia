name: Audit source links v1.6.0

on:
  push:
    branches: ["expansion/bilanci-comunali-v160"]

permissions:
  contents: write

concurrency:
  group: source-link-audit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit-source-links:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: expansion/bilanci-comunali-v160
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Audit links exposed by indicator cards
        run: python scripts/audit_source_links.py

      - name: Preserve the temporary audit report on the experimental branch
        run: |
          cp /tmp/osservatorio-versilia-source-link-audit.json data/source-link-audit-v1.6.0.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-link-audit-v1.6.0.json
          git commit -m "Registra audit temporaneo dei link fonte"
          git push origin HEAD:expansion/bilanci-comunali-v160

# Temporary diagnostic only: no deploy or merge.
