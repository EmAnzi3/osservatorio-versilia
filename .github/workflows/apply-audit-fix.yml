name: Apply audit fixes

on:
  push:
    branches: ["main"]
    paths:
      - ".auditpatch/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .auditpatch/chunk00 .auditpatch/chunk01 .auditpatch/chunk02 .auditpatch/chunk03 \
              .auditpatch/chunk04 .auditpatch/chunk05 .auditpatch/chunk06 .auditpatch/chunk07 > /tmp/audit-fix.b64
          base64 --decode /tmp/audit-fix.b64 > /tmp/audit-fix.zip
          unzip -t /tmp/audit-fix.zip
          unzip -p /tmp/audit-fix.zip app.js > assets/app.js
          unzip -p /tmp/audit-fix.zip static.css > assets/static.css
          unzip -p /tmp/audit-fix.zip site.webmanifest > site.webmanifest

      - name: Import missing media
        shell: bash
        run: |
          set -euo pipefail
          base="https://versilia-in-numeri.decent-raven-1888.chatgpt.site"
          mkdir -p images crests
          curl --fail --location --retry 3 "$base/versilia-viareggio-apuane.jpg" -o images/versilia-viareggio-apuane.jpg
          curl --fail --location --retry 3 "$base/crests/massarosa.png" -o crests/massarosa.png
          curl --fail --location --retry 3 "$base/crests/viareggio.svg" -o crests/viareggio.svg
          curl --fail --location --retry 3 "$base/crests/camaiore.svg" -o crests/camaiore.svg
          curl --fail --location --retry 3 "$base/crests/pietrasanta.svg" -o crests/pietrasanta.svg
          curl --fail --location --retry 3 "$base/crests/seravezza.png" -o crests/seravezza.png
          curl --fail --location --retry 3 "$base/crests/forte-dei-marmi.svg" -o crests/forte-dei-marmi.svg
          curl --fail --location --retry 3 "$base/crests/stazzema.webp" -o crests/stazzema.webp
          test -s images/versilia-viareggio-apuane.jpg
          for file in crests/*; do test -s "$file"; done

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/app.js
          rm -rf .auditpatch
          rm -f .github/workflows/apply-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Corregge fedeltà, grafici e layout"
          git push
