name: Genera dataset definitivo ASIA e AGCOM

on:
  push:
    branches: ["feature/ateco-agcom-audit"]
    paths:
      - ".github/workflows/seed-release-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ateco-agcom-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data tests
        run: |
          python scripts/test_agid_indicators.py
          python scripts/test_ateco_agcom_audit.py
          python scripts/test_agcom_primary_percentages.py

      - name: Build definitive dataset from official sources
        run: |
          python scripts/update_agid_indicators_resilient.py
          python scripts/enrich_ateco_agcom_audit.py
          python scripts/audit_agcom_primary.py
          python scripts/apply_agcom_primary_percentages.py
          python scripts/apply_agcom_absolute_policy.py

      - name: Validate declared coverage
        run: |
          mkdir -p /tmp/data-check
          python scripts/monthly_data_check_coverage.py \
            --mode offline \
            --report-md /tmp/data-check/report.md \
            --report-json /tmp/data-check/report.json \
            --next-state /tmp/data-check/state.json

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build and regression test
        run: |
          python scripts/build_static_safe.py
          python scripts/test_static.py
          python - <<'PY'
          from pathlib import Path
          import mimetypes
          crests = [
              'massarosa.png', 'viareggio.svg', 'camaiore.svg',
              'pietrasanta.svg', 'seravezza.png', 'forte-dei-marmi.svg',
              'stazzema.webp'
          ]
          for crest in crests:
              path = Path('dist/crests') / crest
              assert path.exists() and path.stat().st_size > 0, f'Stemma mancante: {crest}'
          for crest in ['viareggio.svg','camaiore.svg','pietrasanta.svg','forte-dei-marmi.svg']:
              assert mimetypes.guess_type(crest)[0] == 'image/svg+xml'
          print('Stemmi verificati: 7/7')
          PY

      - name: Commit generated release data and remove seed workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/site-data.json \
            data/source-registry.json \
            data/source-snapshots/agid-asia-agcom-2026-08.json \
            README.md \
            docs/aggiornamento-mensile-dati.md
          git rm .github/workflows/seed-release-data.yml
          git commit -m "Registra ATECO 2023 e dati FTTH AGCOM verificati"
          git push origin HEAD:feature/ateco-agcom-audit
