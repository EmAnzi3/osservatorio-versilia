name: SIR validation probe

on:
  pull_request:
    paths:
      - "scripts/sir_probe.py"
      - ".github/workflows/sir-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official SIR archive endpoints
        run: python scripts/sir_probe.py
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: sir-validation-probe
          path: reports/runtime/sir-probe.json
          retention-days: 30
