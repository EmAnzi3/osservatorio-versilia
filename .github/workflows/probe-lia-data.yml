name: Probe LIA data endpoints

on:
  push:
    branches: ["expansion/lavoro-istruzione-abitare"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/probe_lia_downloads.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lia-probe
          path: lia-probe
          retention-days: 7
