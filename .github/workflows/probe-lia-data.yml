name: Materialize LIA v1.4.0

on:
  push:
    branches: ["expansion/lavoro-istruzione-abitare"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: expansion/lavoro-istruzione-abitare
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize readable sources
        run: python scripts/update_lia_v140.py

      - name: Commit generated files
        run: |
          if git diff --quiet -- data/site-data.json assets/app-parts/00.txt data/source-snapshots/lia-v1.4.0.json; then
            echo "Sorgenti già materializzati."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json assets/app-parts/00.txt data/source-snapshots/lia-v1.4.0.json
          git commit -m "Materializza i nuovi indicatori LIA in sorgenti leggibili"
          git push origin HEAD:expansion/lavoro-istruzione-abitare
