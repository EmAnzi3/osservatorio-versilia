name: Territorio v1.37 apply canonical code patches

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-integrate.yml
      - scripts/apply_territorio_v137_patches.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-closed code patches
        run: python scripts/apply_territorio_v137_patches.py
      - name: Compile patched Python
        run: python -m py_compile scripts/materialize_territorio_v137.py scripts/patch_territorio_v137_runtime.py scripts/build_static_brand.py scripts/verify_territorio_v137_dist.py
      - name: Commit code integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/materialize_territorio_v137.py scripts/build_static_brand.py scripts/verify_territorio_v137_dist.py
          git commit -m 'feat(territorio): integrate v1.37 into canonical build'
          git push origin HEAD:draft/territorio-indicatori-v137
