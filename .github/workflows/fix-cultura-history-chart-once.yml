name: Restore Cultura chart histories once

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  repair-history-chart:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace table history with canonical chart UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ux = Path('assets/ux-history.js')
          text = ux.read_text(encoding='utf-8')
          text = text.replace("const HOTFIX_VERSION = '20260827-v121-history-ui5';", "const HOTFIX_VERSION = '20260827-v121-history-ui6';")

          marker = "  function enhanceCompare(data) {\n"
          if "function libraryHistoryChartMarkup(metric, selectedTown = '')" not in text:
              assert marker in text
              helper = r'''  function libraryHistoryChartMarkup(metric, selectedTown = '') {
    const palette = ['#0f5c6e', '#b56843', '#64743d', '#855b7b', '#b88a1c', '#4e7096', '#914d47'];
    const rows = (metric?.rows || []).map((row, index) => {
      const years = row.series?.years || [];
      const values = row.series?.values || [];
      const points = years.map((year, pointIndex) => ({ year: Number(year), value: Number(values[pointIndex]) }))
        .filter(point => Number.isFinite(point.year) && Number.isFinite(point.value));
      return { town: row.town, slug: row.slug || '', color: palette[index % palette.length], points };
    });
    const plotted = rows.filter(row => row.points.length);
    const years = [...new Set(plotted.flatMap(row => row.points.map(point => point.year)))].sort((a, b) => a - b);
    if (years.length < 2 || !plotted.length) {
      return '<div class="ux-history-unavailable"><strong>Serie storica non disponibile</strong><p>Non risultano almeno due annualità osservate.</p></div>';
    }

    const values = plotted.flatMap(row => row.points.map(point => point.value));
    const rawMin = Math.min(...values), rawMax = Math.max(...values);
    const padding = (rawMax - rawMin || Math.max(Math.abs(rawMax) * .1, 1)) * .08;
    let min = rawMin - padding, max = rawMax + padding;
    if (rawMin >= 0 && min < 0) min = 0;
    const range = max - min || 1;
    const width = 920, height = 390;
    const left = metric.meta.unit === 'per100' ? 132 : 78, right = 30, top = 26, bottom = 52;
    const chartWidth = width - left - right, chartHeight = height - top - bottom;
    const firstYear = years[0], lastYear = years.at(-1), yearRange = Math.max(1, lastYear - firstYear);
    const x = year => left + (year - firstYear) / yearRange * chartWidth;
    const y = value => top + (max - value) / range * chartHeight;
    const valueText = value => {
      if (metric.meta.unit === 'decimal') return `${new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(value)}`;
      if (metric.meta.unit === 'hours') return `${new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(value)} ore`;
      if (metric.meta.unit === 'per100') return `${new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(value)} ogni 100`;
      return new Intl.NumberFormat('it-IT',{maximumFractionDigits:2}).format(value);
    };

    const ticks = [0,.25,.5,.75,1].map(fraction => {
      const value = max - fraction * range;
      const py = top + fraction * chartHeight;
      return `<line class="ux-history-grid" x1="${left}" y1="${py}" x2="${width-right}" y2="${py}"></line><text class="ux-history-axis-label" x="${left-10}" y="${py+4}" text-anchor="end">${toolkit.escapeHtml(valueText(value))}</text>`;
    }).join('');
    const yearStep = Math.max(1, Math.ceil(years.length / 9));
    const yearLabels = years.map((year,index) => (index % yearStep === 0 || index === years.length-1 || year === 2020)
      ? `<text class="ux-history-axis-label${year === 2020 ? ' library-pandemic-axis' : ''}" x="${x(year)}" y="${height-16}" text-anchor="middle">${toolkit.escapeHtml(year === 2020 ? '2020*' : year)}</text>`
      : '').join('');

    const groups = plotted.map(row => {
      const map = new Map(row.points.map(point => [point.year, point.value]));
      const segments = [];
      let current = [];
      years.forEach(year => {
        if (map.has(year)) current.push({year,value:map.get(year)});
        else if (current.length) { segments.push(current); current = []; }
      });
      if (current.length) segments.push(current);
      const lines = segments.map(segment => segment.length >= 2
        ? `<polyline class="ux-series-line" points="${segment.map(point => `${x(point.year)},${y(point.value)}`).join(' ')}"></polyline>`
        : '').join('');
      const points = row.points.map(point => {
        const px=x(point.year), py=y(point.value), boxWidth=230, boxHeight=50;
        const boxX=Math.max(left-8,Math.min(width-right-boxWidth,px-boxWidth/2));
        const boxY=py < boxHeight+28 ? py+18 : py-boxHeight-16;
        const formatted=valueText(point.value);
        return `<g class="chart-point" tabindex="0" role="button" aria-label="${toolkit.escapeHtml(`${row.town} · ${point.year}: ${formatted}`)}"><circle class="chart-hit" cx="${px}" cy="${py}" r="13"></circle><circle class="chart-dot ux-series-point" cx="${px}" cy="${py}" r="4"></circle><g class="chart-tooltip" hidden><line class="chart-guide" x1="${px}" y1="${py}" x2="${px}" y2="${boxY < py ? boxY+boxHeight : boxY}"></line><rect x="${boxX}" y="${boxY}" width="${boxWidth}" height="${boxHeight}" rx="8"></rect><text class="chart-tooltip-year" x="${boxX+12}" y="${boxY+16}">${toolkit.escapeHtml(`${row.town} · ${point.year}`)}</text><text class="chart-tooltip-value" x="${boxX+12}" y="${boxY+36}">${toolkit.escapeHtml(formatted)}</text></g></g>`;
      }).join('');
      return `<g class="ux-series-group ${row.slug === selectedTown ? 'is-selected' : ''}" data-history-town="${toolkit.escapeHtml(row.slug)}" style="--series-color:${row.color}">${lines}${points}</g>`;
    }).join('');

    const legend = rows.map(row => {
      if (!row.points.length) return `<span class="ux-history-reference is-unavailable">${toolkit.escapeHtml(row.town)} · n.d.</span>`;
      const start=row.points[0], end=row.points.at(-1);
      return `<button type="button" data-history-select="${toolkit.escapeHtml(row.slug)}" data-town="${toolkit.escapeHtml(row.town)}" data-start="${start.value}" data-end="${end.value}" data-start-year="${start.year}" data-end-year="${end.year}" aria-pressed="${row.slug === selectedTown}" style="--series-color:${row.color}">${toolkit.escapeHtml(row.town)}</button>`;
    }).join('');
    const note = years.includes(2020)
      ? 'Gli anni senza dato restano vuoti e non vengono interpolati. * 2020: anno pandemico anomalo.'
      : 'Gli anni senza dato restano vuoti e non vengono interpolati.';
    return `<div class="ux-history-card library-history-chart"><div class="ux-history-head"><div><strong>Andamento ${firstYear}–${lastYear}</strong><span>Una linea per Comune; tooltip sui valori osservati e vuoti dove il dato manca.</span></div><span>${toolkit.escapeHtml(metric.meta.source)}</span></div><div class="ux-history-scroll"><div class="ux-history-chart ${selectedTown ? 'has-selection' : ''}" data-unit="${toolkit.escapeHtml(metric.meta.unit)}"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${toolkit.escapeHtml(`${metric.meta.label}: confronto storico`)}">${ticks}${groups}${yearLabels}</svg></div></div><p class="ux-history-scroll-hint">Scorri il grafico orizzontalmente per leggere l’intera serie.</p><div class="ux-history-legend" aria-label="Comuni">${legend}</div><p class="aggregate-note">${toolkit.escapeHtml(note)}</p></div>`;
  }

'''
              text = text.replace(marker, helper + marker, 1)

          old = '''      const historyDetail = document.querySelector('#compare-tools .library-history-detail');
      if (!historyDetail) return;
      const currentMarkup = target.innerHTML;
      const historyMarkup = historyDetail.outerHTML;
      historyDetail.remove();
      const note = 'Lo storico mantiene tutti gli anni ufficiali disponibili: gli n.d. restano tali e la media di ogni anno usa soltanto i Comuni con dato.';
'''
          new = '''      const historyDetail = document.querySelector('#compare-tools .library-history-detail');
      historyDetail?.remove();
      const currentMarkup = target.innerHTML;
      const historyMarkup = libraryHistoryChartMarkup(selected.metric, selectedTown);
      const note = 'Lo storico usa lo stesso linguaggio grafico degli altri indicatori: una linea per Comune, tooltip sui valori osservati e vuoti espliciti dove il dato manca.';
'''
          if old in text:
              text = text.replace(old, new, 1)
          else:
              assert "libraryHistoryChartMarkup(selected.metric, selectedTown)" in text
          ux.write_text(text, encoding='utf-8')

          build = Path('scripts/build_static_safe.py')
          text = build.read_text(encoding='utf-8').replace('HISTORY_ASSET_VERSION = "20260827-v121-history-ui5"', 'HISTORY_ASSET_VERSION = "20260827-v121-history-ui6"')
          build.write_text(text, encoding='utf-8')

          catalog = Path('scripts/test_catalog_release_v116.py')
          text = catalog.read_text(encoding='utf-8').replace('HISTORY_ASSET_VERSION = "20260827-v121-history-ui5"', 'HISTORY_ASSET_VERSION = "20260827-v121-history-ui6"')
          catalog.write_text(text, encoding='utf-8')

          cache = Path('scripts/test_cultura_history_cache_v121.py')
          text = cache.read_text(encoding='utf-8')
          text = text.replace('HISTORY_ASSET_VERSION = "20260827-v121-history-ui5"', 'HISTORY_ASSET_VERSION = "20260827-v121-history-ui6"')
          text = text.replace("const HOTFIX_VERSION = '20260827-v121-history-ui5';", "const HOTFIX_VERSION = '20260827-v121-history-ui6';")
          text = text.replace('assert "function libraryHistoryTableMarkup(metric)" in PART, "Renderer storico Cultura assente"\nassert "Media comuni con dato" in PART, "Colonna media storica assente"\nassert "libraryHistoryTableMarkup(metric)" in PART, "Storico non collegato al rendering del confronto"\n', 'assert "function libraryHistoryChartMarkup(metric, selectedTown = \'\')" in UX_HISTORY, "Renderer grafico storico Cultura assente"\nassert "libraryHistoryChartMarkup(selected.metric, selectedTown)" in UX_HISTORY, "Grafico storico Cultura non collegato allo switch"\nassert "tooltip sui valori osservati" in UX_HISTORY, "Contratto tooltip storico Cultura assente"\n')
          cache.write_text(text, encoding='utf-8')

          browser = Path('scripts/test_cultura_biblioteche_v121_browser.py')
          text = browser.read_text(encoding='utf-8')
          old_block = '''        history = history_pane.locator(".library-history-detail")
        assert history.count() == 1, f"{key}: storico completo non visibile nel pannello Storico"
        history_text = history.inner_text()
        assert "Media comuni con dato" in history_text
        row_2024 = history.locator("tbody tr").filter(has_text="2024").first
        assert row_2024.count() == 1, f"{key}: riga storica 2024 assente"
        assert EXPECTED_2024_MEAN[key] in row_2024.inner_text(), (
            f"{key}: media 2024 visibile errata ({row_2024.inner_text()})"
        )
        assert "5/7" in row_2024.inner_text(), f"{key}: media 2024 non dichiara 5/7"
        if key in ("libraryLoansPerResident", "libraryActiveBorrowersPer100"):
            assert "1998" in history_text and "2024" in history_text and "2020" in history_text
        else:
            assert "2022" in history_text and "2024" in history_text and "2021" not in history_text
'''
          new_block = '''        history = history_pane.locator(".library-history-chart")
        assert history.count() == 1, f"{key}: grafico storico non visibile nel pannello Storico"
        assert history.locator("table").count() == 0, f"{key}: lo storico non deve essere tabellare"
        chart = history.locator(".ux-history-chart")
        assert chart.count() == 1 and chart.locator("svg").count() == 1, f"{key}: SVG storico assente"
        assert chart.locator(".ux-series-group").count() == 6, f"{key}: attese 6 serie comunali osservate"
        assert chart.locator(".chart-point").count() >= 12, f"{key}: punti storici insufficienti"
        first_point = chart.locator(".chart-point").first
        first_point.hover(force=True)
        page.wait_for_timeout(60)
        assert first_point.locator(".chart-tooltip").is_visible(), f"{key}: tooltip storico non attivo"
        history_text = history.inner_text()
        assert "Stazzema · n.d." in history_text, f"{key}: assenza storica Stazzema non esplicita"
        if key in ("libraryLoansPerResident", "libraryActiveBorrowersPer100"):
            assert "1998" in history_text and "2024" in history_text and "2020" in history_text
        else:
            assert "2022" in history_text and "2024" in history_text and "2021" not in history_text
'''
          assert old_block in text, 'Blocco browser tabellare non trovato'
          text = text.replace(old_block, new_block, 1)
          browser.write_text(text, encoding='utf-8')
          PY
          node --check assets/ux-history.js
          python -m py_compile scripts/test_cultura_biblioteche_v121_browser.py scripts/test_cultura_history_cache_v121.py scripts/test_catalog_release_v116.py scripts/build_static_safe.py
          python scripts/test_cultura_history_cache_v121.py
          python scripts/test_cultura_biblioteche_v121.py

      - name: Commit chart history repair
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ux-history.js scripts/build_static_safe.py scripts/test_catalog_release_v116.py scripts/test_cultura_history_cache_v121.py scripts/test_cultura_biblioteche_v121_browser.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore graph-based Cultura histories"
          git push origin HEAD:"$BRANCH"
