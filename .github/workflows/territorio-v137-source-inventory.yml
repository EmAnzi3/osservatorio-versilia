name: Territorio v1.37 source inventory

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - scripts/inspect_territorio_v137_sources.py
      - .github/workflows/territorio-v137-source-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve official source inventory
        run: python scripts/inspect_territorio_v137_sources.py
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: territorio-v137-source-inventory
          path: tmp/territorio-v137-source-inventory.json
          if-no-files-found: error
          retention-days: 7
