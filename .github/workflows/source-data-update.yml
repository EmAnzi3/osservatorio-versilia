name: Aggiorna dati dalla fonte

# Esegue sui runner GitHub gli aggiornatori di `scripts/update_source_data.py`
# richiesti in `ci/source-update-request.json` e committa il risultato sul ramo
# della PR. Serve per le fonti che si scaricano solo da qui (ARS, Istat).
# Non tocca mai main: la PR resta da verificare e la fusione resta manuale.

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/source-data-update.yml"
      - "ci/source-update-request.json"
      - "scripts/update_source_data.py"

permissions:
  contents: write

concurrency:
  group: source-data-update-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Offline updater tests
        run: cd scripts && python test_update_source_data.py
      - name: Run requested updaters
        run: |
          python - <<'PY'
          import json, subprocess, sys
          request = json.load(open("ci/source-update-request.json", encoding="utf-8"))
          commands = [["ars-legacy", "--metric", m] for m in request.get("arsLegacy", [])]
          commands += [["istat-mobility", "--year", str(int(y))] for y in request.get("istatMobility", [])]
          failed = 0
          for args in commands:
              print("::group::" + " ".join(args))
              failed |= subprocess.call([sys.executable, "scripts/update_source_data.py", *args])
              print("::endgroup::")
          sys.exit(failed)
          PY
      - name: Commit updated data to the PR branch
        run: |
          if git diff --quiet; then echo "Nessun dato cambiato."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git status --short
          git commit -m "Dati aggiornati dalla fonte (workflow Aggiorna dati dalla fonte)"
          git push origin "HEAD:${{ github.head_ref }}"
