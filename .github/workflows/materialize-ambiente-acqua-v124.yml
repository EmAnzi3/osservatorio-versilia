name: Materialize Ambiente acqua v124

on:
  push:
    branches:
      - staging/ambiente-acqua-v124
    paths:
      - '.github/workflows/materialize-ambiente-acqua-v124.yml'
      - 'scripts/v124-parts/**'
      - 'data/source-snapshots/ambiente-acqua-v124-manifest.json'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/ambiente-acqua-v124
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble materializer
        run: cat scripts/v124-parts/*.part > scripts/materialize_ambiente_acqua_v124.py
      - name: Harden SISBON parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/materialize_ambiente_acqua_v124.py')
          s=p.read_text(encoding='utf-8')
          old='''    procedures=[]\n    for row in csv.DictReader(io.StringIO(text)):\n        town=clean(row.get("nome_comune",""))'''
          new='''    procedures=[]\n    sample=text[:8192]\n    try:\n        dialect=csv.Sniffer().sniff(sample, delimiters=",;\\t")\n    except csv.Error:\n        dialect=csv.excel\n    reader=csv.DictReader(io.StringIO(text), dialect=dialect)\n    fieldmap={clean(name).casefold():name for name in (reader.fieldnames or [])}\n    if "nome_comune" not in fieldmap:\n        raise RuntimeError(f"SISBON schema inatteso: headers={reader.fieldnames!r}; preview={text[:300]!r}")\n    def cell(row,name):\n        key=fieldmap.get(name.casefold())\n        return row.get(key,"") if key else ""\n    for row in reader:\n        town=clean(cell(row,"nome_comune"))'''
          if old not in s:
              raise SystemExit('SISBON parser marker not found')
          s=s.replace(old,new,1)
          for name in ['stato_corr_proc','geojson','codice_regionale','denominazione_sito','indirizzo','d_stato_cont','d_stato_proc']:
              s=s.replace(f'row.get("{name}","")',f'cell(row,"{name}")')
          s=s.replace('row.get("geojson") or "{}"','cell(row,"geojson") or "{}"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install source readers
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Materialize verified data and UI
        run: python scripts/materialize_ambiente_acqua_v124.py
      - name: Validate Python release contract
        run: |
          python scripts/finalize_catalog_release.py --check
          python scripts/test_catalog_release_v116.py
      - name: Remove bootstrap files
        run: |
          rm -rf scripts/v124-parts
          rm .github/workflows/materialize-ambiente-acqua-v124.yml
      - name: Commit materialized release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Materialize Ambiente acqua e bonifiche v1.24.0'
          git push origin HEAD:staging/ambiente-acqua-v124
