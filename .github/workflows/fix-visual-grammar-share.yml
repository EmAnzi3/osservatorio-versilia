name: Fix visual grammar population share

on:
  push:
    branches: ["feat/agricoltura-territorio"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agricoltura-territorio
      - name: Make Massarosa share assertion data-driven
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_visual_grammar.py')
          text = path.read_text(encoding='utf-8')

          anchor = 'DIST = ROOT / "dist"\n'
          helper = '''DIST = ROOT / "dist"\n\n\ndef massarosa_population_share_label() -> str:\n    data = json.loads((ROOT / "data" / "site-data.json").read_text(encoding="utf-8"))\n    rows = data["metrics"]["population"]["rows"]\n    values = [row for row in rows if isinstance(row.get("value"), (int, float))]\n    numerator = next(float(row["value"]) for row in values if row["town"] == "Massarosa")\n    denominator = sum(float(row["value"]) for row in values)\n    return f"{numerator / denominator * 100:.1f}%".replace(".", ",")\n'''
          if 'def massarosa_population_share_label()' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('DIST anchor not found exactly once')
              text = text.replace(anchor, helper, 1)

          old_static = '    assert "13,7%" in massarosa\n'
          new_static = '    assert massarosa_population_share_label() in massarosa\n'
          if old_static in text:
              text = text.replace(old_static, new_static, 1)
          elif new_static not in text:
              raise SystemExit('Static share assertion not found')

          old_browser = '        assert "13,7%" in population_text, f"Quota popolazione Massarosa inattesa: {population_text!r}"\n'
          new_browser = '        assert massarosa_population_share_label() in population_text, f"Quota popolazione Massarosa inattesa: {population_text!r}"\n'
          if old_browser in text:
              text = text.replace(old_browser, new_browser, 1)
          elif new_browser not in text:
              raise SystemExit('Browser share assertion not found')

          if '"13,7%"' in text:
              raise SystemExit('Stale hard-coded Massarosa share remains')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_visual_grammar.py
          git diff --cached --exit-code && exit 0
          git commit -m "test(visual): deriva quota Massarosa dai dati canonici"
          git push origin HEAD:feat/agricoltura-territorio
