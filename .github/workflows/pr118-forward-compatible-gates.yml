name: PR118 · Forward-compatible legacy gates

on:
  push:
    branches:
      - feature/life-expectancy-history-sex-v122
    paths:
      - .github/workflows/pr118-forward-compatible-gates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/life-expectancy-history-sex-v122
          fetch-depth: 0

      - name: Make legacy gates release-forward-compatible
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Cultura: il test deve seguire la release canonica corrente, non fissarsi sulla v1.21.
          p = Path('scripts/test_cultura_biblioteche_v121.py')
          text = p.read_text(encoding='utf-8')
          import_line = 'from finalize_catalog_release import VERSION as CATALOG_VERSION, UPDATED as CATALOG_UPDATED\n'
          if import_line not in text:
              marker = 'from pathlib import Path\n'
              if text.count(marker) != 1:
                  raise SystemExit('test_cultura_biblioteche_v121.py: Path import marker not unique')
              text = text.replace(marker, marker + '\n' + import_line, 1)
          old = '    require(site["version"] == "v1.21.0" and site["updated"] == "27 agosto 2026", "Release non finalizzata")'
          new = '    require(site["version"] == CATALOG_VERSION and site["updated"] == CATALOG_UPDATED, "Release catalogo corrente non finalizzata")'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('test_cultura_biblioteche_v121.py: release assertion not found')
          p.write_text(text, encoding='utf-8')

          # Cultura: il materializzatore v1.21 può essere rieseguito su release future
          # per verificare i dati, ma non deve tentare di riscrivere metadati/cache di release.
          p = Path('scripts/materialize_cultura_biblioteche_v121.py')
          text = p.read_text(encoding='utf-8')
          marker = 'def patch_release_files() -> None:\n'
          guard = (
              'def patch_release_files() -> None:\n'
              '    current_finalizer = FINALIZER.read_text(encoding="utf-8")\n'
              '    if (\n'
              '        \'VERSION = "v1.20.0"\' not in current_finalizer\n'
              '        and \'VERSION = "v1.21.0"\' not in current_finalizer\n'
              '    ):\n'
              '        # Il lotto è già incorporato in una release successiva: non effettuare\n'
              '        # downgrade di versione né dei cache-buster durante i gate di regressione.\n'
              '        return\n'
          )
          if 'current_finalizer = FINALIZER.read_text' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('materialize_cultura_biblioteche_v121.py: patch_release_files marker not unique')
              text = text.replace(marker, guard, 1)
          p.write_text(text, encoding='utf-8')

          # Brand: la grammatica visiva deve usare la revisione canonica del builder corrente.
          p = Path('scripts/test_brand_identity.py')
          text = p.read_text(encoding='utf-8')
          old_import = 'from build_static_brand import APP_BUNDLE_ASSET_VERSION\n'
          new_import = old_import + 'from build_static_safe import UX_ASSET_VERSION\n'
          if 'from build_static_safe import UX_ASSET_VERSION\n' not in text:
              if text.count(old_import) != 1:
                  raise SystemExit('test_brand_identity.py: build import marker not unique')
              text = text.replace(old_import, new_import, 1)
          old = '        require("assets/visual-grammar.js?v=20260826-v120" in text,\n'
          new = '        require(f"assets/visual-grammar.js?v={UX_ASSET_VERSION}" in text,\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('test_brand_identity.py: visual grammar assertion not found')
          p.write_text(text, encoding='utf-8')

          # Launch/social: stessa revisione UX usata dal builder, senza hard-code di una release passata.
          p = Path('scripts/test_launch_foundations.py')
          text = p.read_text(encoding='utf-8')
          import_line = 'from build_static_safe import UX_ASSET_VERSION\n'
          if import_line not in text:
              marker = 'import os\n'
              if text.count(marker) != 1:
                  raise SystemExit('test_launch_foundations.py: os import marker not unique')
              text = text.replace(marker, marker + '\n' + import_line, 1)
          old = 'SOCIAL_ASSET_VERSION = "20260826-v120"'
          new = 'SOCIAL_ASSET_VERSION = UX_ASSET_VERSION'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('test_launch_foundations.py: social asset version not found')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched contracts
        run: |
          python scripts/finalize_catalog_release.py --check
          python scripts/test_cultura_biblioteche_v121.py
          python -m py_compile \
            scripts/materialize_cultura_biblioteche_v121.py \
            scripts/test_cultura_biblioteche_v121.py \
            scripts/test_brand_identity.py \
            scripts/test_launch_foundations.py

      - name: Commit gate fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/materialize_cultura_biblioteche_v121.py \
            scripts/test_cultura_biblioteche_v121.py \
            scripts/test_brand_identity.py \
            scripts/test_launch_foundations.py
          git commit -m "test: make legacy release gates forward-compatible"
          git push origin HEAD:feature/life-expectancy-history-sex-v122
