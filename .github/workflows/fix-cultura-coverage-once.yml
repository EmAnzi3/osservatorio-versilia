name: Cultura histories contract

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  history-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Cultura histories and 5/7 coverage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_cultura_biblioteche_v121.py
