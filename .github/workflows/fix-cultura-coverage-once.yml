name: Cultura 5/7 coverage contract

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  coverage-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate approved partial coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          site = json.loads(Path('data/site-data.json').read_text(encoding='utf-8'))
          keys = (
              'libraryLoansPerResident',
              'libraryActiveBorrowersPer100',
              'libraryWeeklyOpeningHours',
          )
          for key in keys:
              metric = site['metrics'][key]
              assert metric['method']['coverage'] == '5/7', (key, metric['method']['coverage'])
              rows = {row['code']: row for row in metric['rows']}
              assert sum(row['value'] is not None for row in rows.values()) == 5
              assert rows['046018']['value'] is None and rows['046018']['formatted'] == 'n.d.'
              assert rows['046030']['value'] is None and rows['046030']['formatted'] == 'n.d.'
              assert '(5/7)' in metric['aggregate']['label']
          print('Cultura 5/7 coverage contract OK: 5 valori + Massarosa/Stazzema n.d., senza zeri.')
          PY
