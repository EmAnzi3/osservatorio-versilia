name: Territorio v1.37 finalize protected areas and contracts

on:
  push:
    branches:
      - draft/territorio-indicatori-v137
    paths:
      - .github/workflows/territorio-v137-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/territorio-indicatori-v137
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic finalizer
        run: python scripts/finalize_territorio_v137.py
      - name: Compile finalized Python
        run: python -m py_compile scripts/finalize_territorio_v137.py scripts/patch_territorio_v137_runtime.py scripts/materialize_territorio_v137.py scripts/verify_territorio_v137_dist.py
      - name: Commit finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/patch_territorio_v137_runtime.py scripts/materialize_territorio_v137.py scripts/verify_territorio_v137_dist.py
          git commit -m 'fix(territorio): finalize protected-area views and contracts'
          git push origin HEAD:draft/territorio-indicatori-v137
